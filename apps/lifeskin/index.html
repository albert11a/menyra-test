<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E4F48" />
  <title>Lifeskin</title>

  <!-- Die Vorschau beim Teilen.
       Hier stand: "setzt api/lifeskin.js beim Ausliefern ein. Stuende sie
       hier fest, kaeme sie doppelt vor." Diese Datei gibt es nicht - es
       gab sie nie -, und deshalb kam beim Teilen ueberhaupt keine
       Vorschau: eine nackte graue Adresse, in einem Markt, in dem der
       Link durch WhatsApp weitergereicht wird.

       Sie steht jetzt fest, und das ist hier NICHT die schlechtere
       Loesung, sondern die bessere: api/oferta.js ist eine Funktion, weil
       sie fuer jedes Lokal einen anderen Namen und ein anderes Logo
       einsetzt. Diese Seite ist fuer jeden Besucher dieselbe. Fest heisst
       damit: kein Kaltstart, keine Firestore-Abfrage, vom CDN
       ausgeliefert - und nichts, was versehentlich etwas verraten kann.

       Die Adressen sind absolut. WhatsApp, Facebook und Instagram loesen
       keine relativen Pfade auf; ein "/apps/..." kommt dort als nichts an. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lifeskin" />
  <meta property="og:locale" content="sq_AL" />
  <meta property="og:title" content="60 sekonda skanim falas" />
  <meta property="og:description" content="Dr. Violeta Gashi ju thotë çfarë i duhet lëkurës suaj. Pa regjistrim." />
  <meta property="og:url" content="https://www.mnyra.com/lifeskin" />
  <meta property="og:image" content="https://www.mnyra.com/apps/lifeskin/share-lifeskin.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Lifeskin — Dr. Violeta Gashi, Dermatologe" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="60 sekonda skanim falas" />
  <meta name="twitter:description" content="Dr. Violeta Gashi ju thotë çfarë i duhet lëkurës suaj. Pa regjistrim." />
  <meta name="twitter:image" content="https://www.mnyra.com/apps/lifeskin/share-lifeskin.jpg" />
  <meta name="description" content="Dr. Violeta Gashi ju thotë çfarë i duhet lëkurës suaj. Skanim 60 sekonda, falas dhe pa regjistrim." />
  <link rel="canonical" href="https://www.mnyra.com/lifeskin" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Verbindung zu Firestore aufbauen, solange noch geladen wird. Auf dem
       Handy kostet eine neue Gegenstelle DNS, TCP und TLS - im schwachen Netz
       zusammen eine halbe Sekunde. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="//firestore.googleapis.com" />

  <!-- Das Bild von Dr. Gashi steht auf der zweiten Karte, also rund drei
       Sekunden nach dem Oeffnen. Ohne diese Zeile beginnt der Browser erst
       dann zu laden, und die Karte steht einen Wimpernschlag leer da - genau
       die Karte, die das Vertrauen tragen soll. 9 KB, einmal. -->
  <link rel="preload" as="image" href="/apps/lifeskin/dr-gashi.jpg" />

  <link rel="stylesheet" href="/apps/lifeskin/lifeskin-styles.css" />

  <!-- Alle Module auf einmal anfordern statt in Wellen. Ohne diese Zeilen
       findet der Browser lifeskin-metrics.js erst, wenn lifeskin-app.js da
       ist und ihn danach fragt - und dann noch einmal fuer jedes weitere. -->
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-app.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-metrics.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-face.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-pose.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-content.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-catalog.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-session.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-config.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-pixel.js" />
</head>
<body>

<div class="ls-fortschritt" aria-hidden="true"><div class="ls-fortschritt__balken"></div></div>

<!-- 01 Einstieg -->
<!--
  DER BILDSCHIRM, DER 772 VON 894 BESUCHERN VERLOR.

  Aufbau, Schriftgroessen, Knopf und Zeile darunter sind dieselben wie
  vorher. Geaendert hat sich EINES: Der Text steht nicht mehr fest, sondern
  wechselt zwischen zwei Karten - erst was es ist, dann wer es macht und
  was es kostet. Ein Satz, der beides auf einmal sagen musste, sagte keines
  von beiden.

  Was hier NICHT mehr steht: der Namensschirm. Er lag zwischen der Anzeige
  und der Kamera und hat dort Besucher gekostet, ohne ihnen etwas zu geben.
  Gefragt wird nach den Fotos, wenn der Fall schon gesichert ist.
-->
<section class="ls-schirm" id="ls-einstieg" data-aktiv="ja">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-inhalt ls-inhalt--mitte">
    <!-- Die wechselnden Karten.
         Der Inhalt wird aus EINSTIEG_KARTEN gesetzt; im Aufbau steht keine
         Zeichenkette, sonst waere die zweite Sprache nicht mehr einzuziehen.

         BEIDE KARTEN LIEGEN IN DERSELBEN RASTERZELLE, nicht nacheinander.
         Damit ist der Kasten so hoch wie die hoehere Karte und bleibt es -
         beim Wechsel springt weder der Knopf noch die Zeile darunter. -->
    <div class="ls-karten" id="ls-karten"></div>
    <div class="ls-punkte" id="ls-punkte" aria-hidden="true"></div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-start" data-text="einstiegKnopf"></button>
    <!-- Die Zeile unter dem Knopf beantwortet die Frage, die an dieser
         Stelle wirklich jemand hat: Was passiert, wenn ich hier tippe? -->
    <p class="ls-klein" id="ls-einstieghinweis"></p>
  </div>
</section>

<!-- 03 Vorbereitung -->
<section class="ls-schirm" id="ls-vorbereitung" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <!-- Mittig wie auf dem Einstieg. Drei Regeln und ein Hinweis fuellen
       keinen Telefonbildschirm; oben angeschlagen stand darunter ein
       Drittel leere Flaeche, und der Knopf lag allein am unteren Rand. -->
  <div class="ls-inhalt ls-inhalt--mitte">
    <h2 data-text="vorbereitungTitel"></h2>
    <div class="ls-regeln">
      <div class="ls-regel">
        <!-- DASSELBE ZEICHEN WIE AUF DER ERSTEN KARTE DES EINSTIEGS.
             Wer es dort gesehen hat, sieht es hier wieder - und es steht
             fuer dieselbe Sache: das Gesicht im Rahmen.

             Leer und mit data-zeichen, nicht ausgezeichnet: Der Pfad steht
             in EINER Tabelle (Trichter.ZEICHEN). Ein Pfad an zwei Orten
             ist frueher oder spaeter zwei verschiedene Pfade. -->
        <span class="ls-regel__zeichen" data-zeichen="scan-face" aria-hidden="true"></span>
        <span class="ls-regel__text" data-text="vorbereitungMitte"></span>
      </div>
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungLicht"></span>
      </div>
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungHoehe"></span>
      </div>
    </div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-kameraoeffnen" data-text="vorbereitungKnopf"></button>
  </div>
</section>

<!-- 04 Aufnahme -->
<!-- Der Fehlerkasten.
     Lag frueher in der Anschriftsseite - dort war er falsch aufgehoben: Er
     meldet Kamerafehler, und die passieren drei Bildschirme davor. Mit der
     Anschriftsseite waere er ersatzlos verschwunden.
     Er liegt ueber allen Bildschirmen und wird eingeblendet, wo er
     gebraucht wird. -->
<div class="ls-fehler ls-verstecken" id="ls-fehler" role="alert">
  <p id="ls-fehlertext"></p>
  <button type="button" class="ls-knopf ls-knopf--text" id="ls-fehlernochmal"
          style="justify-content:flex-start;padding-left:0"></button>
</div>

<section class="ls-schirm ls-schirm--kamera" id="ls-kamera" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-kamera" data-bereit="nein">
    <!-- playsinline ist auf iOS Pflicht: ohne springt Safari in den
         Vollbildmodus und der Trichter bricht ab. -->
    <!-- Das Bild liegt im Kreis, alles ausserhalb bleibt schwarz. -->
    <div class="ls-kamera__kreis">
      <!-- Solange kein Bild da ist, dreht sich hier etwas. Der Satz
           darunter sagt "Po hapet kamera…" - aber eine ruhige Flaeche
           daneben sieht trotzdem aus wie eine Seite, die haengt. -->
      <div class="ls-kamera__laedt" aria-hidden="true"></div>
      <video id="ls-video" playsinline muted autoplay></video>
    </div>
    <canvas id="ls-leinwand"></canvas>
    <!-- Der Ring mit den Strichen. Er ersetzt das feste Oval: Jeder Strich,
         der zugeht, ist eine vermessene Blickrichtung. -->
    <canvas id="ls-ring" class="ls-ring" aria-hidden="true"></canvas>
    <!-- Die Punkte, die dem Gesicht folgen. Sie liegen ueber dem Bild und
         zeigen dem Besucher, dass er erkannt wird. -->
    <canvas id="ls-netz" class="ls-netz" aria-hidden="true"></canvas>
    <!-- Bleibt als Messbereich: Er sagt, welcher Teil des Bildes ausgewertet
         wird, und deckt sich Zahl fuer Zahl mit #oval() in lifeskin-app.js.
         Gezeichnet wird er nicht mehr - das macht der Ring darueber. -->
    <div class="ls-oval" id="ls-oval" data-stand="rot"><div class="ls-oval__ring"></div></div>
  </div>
  <p class="ls-hinweis" id="ls-kamerahinweis"></p>
  <!-- Der Zaehler stand hier einmal: "7 von 9 Ansichten vermessen".
       Das ist unsere Sprache, nicht seine - wie weit die Aufnahme ist,
       sieht er am Ring, und zwar ohne zu lesen. -->
  <div class="ls-fuss">
    <!-- Hier stand der Ausloeser "Foto aufnehmen".
         Er war als Rueckfallweg gedacht und wurde als Anweisung gelesen:
         Wer ihn sieht, glaubt, er muesse selbst ausloesen - und haelt still,
         statt den Kopf zu drehen. Damit hielt der Rueckfallweg genau den
         Hauptweg auf.
         Jetzt steht dort eine Frage. Der Ausloeser liegt im Blatt dahinter,
         wo ihn nur findet, wer ihn wirklich braucht. -->
    <button type="button" class="ls-knopf ls-knopf--leise" id="ls-hilfe"
            aria-haspopup="dialog" aria-expanded="false" aria-controls="ls-blatt"
            data-text="kameraHilfeKnopf"></button>
  </div>
</section>

<!-- Das Blatt zum Kameraschirm. Liegt ueber der Seite, damit der Bildschirm
     darunter genau einen Bildschirm hoch bleibt. -->
<div class="ls-blatt ls-verstecken" id="ls-blatt" role="dialog" aria-modal="true"
     aria-labelledby="ls-blatttitel">
  <div class="ls-blatt__grund" data-blatt-zu></div>
  <div class="ls-blatt__leib">
    <span class="ls-blatt__griff" aria-hidden="true"></span>
    <h2 id="ls-blatttitel" data-text="kameraHilfeTitel"></h2>
    <p id="ls-blatttext" data-text="kameraHilfeText"></p>
    <p class="ls-klein" id="ls-blattnot" data-text="kameraHilfeNotText"></p>
    <button type="button" class="ls-knopf ls-knopf--leise" id="ls-manuell"
            data-text="kameraHilfeNotKnopf"></button>
    <button type="button" class="ls-knopf ls-knopf--text" id="ls-blattzu" data-blatt-zu
            data-text="kameraHilfeZu"></button>
  </div>
</div>

<!-- 05 Die kurzen Fragen -->
<!--
  EIN BILDSCHIRM FUER ALLE VIER FRAGEN, nicht vier Bildschirme.

  Der Inhalt kommt aus FRAGEN in lifeskin-content.js und wird hier
  eingesetzt. Vier feste Abschnitte waeren vier Mal derselbe Aufbau - und
  wer eine Frage dazunimmt, muesste an zwei Stellen denken.

  Und sie stehen NACH der Aufnahme: Alles vor den Fotos kostet Besucher,
  ohne ihnen etwas zu geben. Hier ist der Fall gesichert, die Bilder gehen
  im Hintergrund hinaus, und die Fragen fuellen die Wartezeit.
-->
<section class="ls-schirm" id="ls-fragen" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" id="ls-fragenzurueck" aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
    <span class="ls-zaehler" id="ls-fragenzaehler"></span>
  </div>
  <!-- Der Karton um die Frage. Er wird beim Wechsel bewegt, nicht der
       ganze Bildschirm: Kopfzeile und Knopf bleiben stehen, damit der
       Daumen sie nicht sucht, waehrend die Frage wandert. -->
  <div class="ls-inhalt" id="ls-frageblatt">
    <p class="ls-klein" id="ls-frageneinleitung"></p>
    <h2 id="ls-fragetitel"></h2>
    <p class="ls-klein" id="ls-frageunter"></p>
    <div class="ls-wahl" id="ls-fragewahl"></div>
    <!-- Fuer die zwei Fragen, die getippt werden: Name und Nummer. -->
    <input class="ls-eingabe" id="ls-fragefeld" type="text" name="vorname"
           autocomplete="given-name" enterkeyhint="done"
           aria-describedby="ls-fragefehler" hidden />
    <p class="ls-fragefehler" id="ls-fragefehler" role="alert" hidden></p>
  </div>
  <div class="ls-fuss">
    <!-- Nur bei Mehrfachwahl. Wo eine Antwort genuegt, geht es von selbst
         weiter - ein Knopf, der nur bestaetigt, was gerade getippt wurde,
         ist ein Tipp zu viel. -->
    <button type="button" class="ls-knopf" id="ls-frageweiter" hidden></button>
  </div>
</section>

<!-- 06 Analyse -->
<section class="ls-schirm" id="ls-analyse" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-analyse">
    <!-- Kein Foto. Der Kunde hat sein Gesicht gerade eine halbe Minute lang
         gesehen; was er hier wissen will, steht in den Zeilen darunter. -->
    <div class="ls-analyse__kreis" id="ls-analysekreis" aria-hidden="true">
      <span class="ls-analyse__zahl" id="ls-analysezahl"></span>
    </div>
    <div class="ls-schritte" id="ls-analyseschritte"></div>
  </div>
</section>






<script type="module" src="/apps/lifeskin/lifeskin-app.js"></script>
</body>
</html>
