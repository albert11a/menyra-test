<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E4F48" />
  <title>Lifeskin</title>

  <!-- Die Vorschau beim Teilen setzt api/lifeskin.js beim Ausliefern ein.
       Stuende sie hier fest, kaeme sie doppelt vor. -->

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Verbindung zu Firestore aufbauen, solange noch geladen wird. Auf dem
       Handy kostet eine neue Gegenstelle DNS, TCP und TLS - im schwachen Netz
       zusammen eine halbe Sekunde. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="//firestore.googleapis.com" />

  <link rel="stylesheet" href="/apps/lifeskin/lifeskin-styles.css" />

  <!-- Alle Module auf einmal anfordern statt in Wellen. Ohne diese Zeilen
       findet der Browser lifeskin-metrics.js erst, wenn lifeskin-app.js da
       ist und ihn danach fragt - und dann noch einmal fuer jedes weitere. -->
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-app.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-metrics.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-face.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-pose.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-content.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-catalog.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-session.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-config.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-pixel.js" />
</head>
<body>

<div class="ls-fortschritt" aria-hidden="true"><div class="ls-fortschritt__balken"></div></div>

<!-- 01 Einstieg -->
<section class="ls-schirm" id="ls-einstieg" data-aktiv="ja">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-inhalt ls-inhalt--mitte">
    <h1 data-text="einstiegTitel"></h1>
    <p class="ls-gross ls-leise" data-text="einstiegUnter"></p>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-start" data-text="einstiegKnopf"></button>
    <!-- Der Hinweis steht vor dem Scan und nicht erst danach.
         Danach waere er eine Ausrede; hier ist er das, was Vertrauen
         schafft: Wir sagen vorher, was das hier ist und was nicht. -->
    <p class="ls-klein" id="ls-haftung"></p>
  </div>
</section>

<!-- 02 Name und Alter -->
<section class="ls-schirm" id="ls-name" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-inhalt">
    <div class="ls-feld">
      <h2 data-text="nameTitel"></h2>
      <input class="ls-eingabe" id="ls-namefeld" type="text" name="vorname"
             autocomplete="given-name" enterkeyhint="next"
             data-platzhalter="namePlatzhalter" />
    </div>
    <div class="ls-feld">
      <h2 data-text="alterTitel"></h2>
      <div class="ls-alter" id="ls-alterwahl"></div>
      <p class="ls-klein" data-text="alterGrund"></p>
    </div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-nameweiter" data-text="weiter" disabled></button>
  </div>
</section>

<!-- 03 Vorbereitung -->
<section class="ls-schirm" id="ls-vorbereitung" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-inhalt">
    <h2 data-text="vorbereitungTitel"></h2>
    <div class="ls-regeln">
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A9 9 0 0 1 21 12a8.9 8.9 0 0 1-2.2 4.5M6.2 6.2A9 9 0 0 0 3 12a9 9 0 0 0 9 7 8.9 8.9 0 0 0 3.4-.7"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungMakeup"></span>
      </div>
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungLicht"></span>
      </div>
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungHoehe"></span>
      </div>
    </div>
    <div class="ls-schutz">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.4 9-8 10-4.6-1-8-5-8-10V6z"/></svg>
      <span data-text="vorbereitungSchutz"></span>
    </div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-kameraoeffnen" data-text="vorbereitungKnopf"></button>
  </div>
</section>

<!-- 04 Aufnahme -->
<!-- Der Fehlerkasten.
     Lag frueher in der Anschriftsseite - dort war er falsch aufgehoben: Er
     meldet Kamerafehler, und die passieren drei Bildschirme davor. Mit der
     Anschriftsseite waere er ersatzlos verschwunden.
     Er liegt ueber allen Bildschirmen und wird eingeblendet, wo er
     gebraucht wird. -->
<div class="ls-fehler ls-verstecken" id="ls-fehler" role="alert">
  <p id="ls-fehlertext"></p>
  <button type="button" class="ls-knopf ls-knopf--text" id="ls-fehlernochmal"
          style="justify-content:flex-start;padding-left:0"></button>
</div>

<section class="ls-schirm ls-schirm--kamera" id="ls-kamera" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-kamera" data-bereit="nein">
    <!-- playsinline ist auf iOS Pflicht: ohne springt Safari in den
         Vollbildmodus und der Trichter bricht ab. -->
    <!-- Das Bild liegt im Kreis, alles ausserhalb bleibt schwarz. -->
    <div class="ls-kamera__kreis">
      <video id="ls-video" playsinline muted autoplay></video>
    </div>
    <canvas id="ls-leinwand"></canvas>
    <!-- Der Ring mit den Strichen. Er ersetzt das feste Oval: Jeder Strich,
         der zugeht, ist eine vermessene Blickrichtung. -->
    <canvas id="ls-ring" class="ls-ring" aria-hidden="true"></canvas>
    <!-- Die Punkte, die dem Gesicht folgen. Sie liegen ueber dem Bild und
         zeigen dem Besucher, dass er erkannt wird. -->
    <canvas id="ls-netz" class="ls-netz" aria-hidden="true"></canvas>
    <!-- Bleibt als Messbereich: Er sagt, welcher Teil des Bildes ausgewertet
         wird, und deckt sich Zahl fuer Zahl mit #oval() in lifeskin-app.js.
         Gezeichnet wird er nicht mehr - das macht der Ring darueber. -->
    <div class="ls-oval" id="ls-oval" data-stand="rot"><div class="ls-oval__ring"></div></div>
  </div>
  <p class="ls-hinweis" id="ls-kamerahinweis"></p>
  <!-- Der Zaehler stand hier einmal: "7 von 9 Ansichten vermessen".
       Das ist unsere Sprache, nicht seine - wie weit die Aufnahme ist,
       sieht er am Ring, und zwar ohne zu lesen. -->
  <div class="ls-fuss">
    <!-- Hier stand der Ausloeser "Foto aufnehmen".
         Er war als Rueckfallweg gedacht und wurde als Anweisung gelesen:
         Wer ihn sieht, glaubt, er muesse selbst ausloesen - und haelt still,
         statt den Kopf zu drehen. Damit hielt der Rueckfallweg genau den
         Hauptweg auf.
         Jetzt steht dort eine Frage. Der Ausloeser liegt im Blatt dahinter,
         wo ihn nur findet, wer ihn wirklich braucht. -->
    <button type="button" class="ls-knopf ls-knopf--leise" id="ls-hilfe"
            aria-haspopup="dialog" aria-expanded="false" aria-controls="ls-blatt"
            data-text="kameraHilfeKnopf"></button>
  </div>
</section>

<!-- Das Blatt zum Kameraschirm. Liegt ueber der Seite, damit der Bildschirm
     darunter genau einen Bildschirm hoch bleibt. -->
<div class="ls-blatt ls-verstecken" id="ls-blatt" role="dialog" aria-modal="true"
     aria-labelledby="ls-blatttitel">
  <div class="ls-blatt__grund" data-blatt-zu></div>
  <div class="ls-blatt__leib">
    <span class="ls-blatt__griff" aria-hidden="true"></span>
    <h2 id="ls-blatttitel" data-text="kameraHilfeTitel"></h2>
    <p id="ls-blatttext" data-text="kameraHilfeText"></p>
    <p class="ls-klein" id="ls-blattnot" data-text="kameraHilfeNotText"></p>
    <button type="button" class="ls-knopf ls-knopf--leise" id="ls-manuell"
            data-text="kameraHilfeNotKnopf"></button>
    <button type="button" class="ls-knopf ls-knopf--text" id="ls-blattzu" data-blatt-zu
            data-text="kameraHilfeZu"></button>
  </div>
</div>

<!-- 05 Analyse -->
<section class="ls-schirm" id="ls-analyse" data-aktiv="nein">
  <div class="ls-kopf">
    <button type="button" class="ls-zurueck" data-zurueck aria-label="Zurück" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="ls-marke">Lifeskin</span>
  </div>
  <div class="ls-analyse">
    <!-- Kein Foto. Der Kunde hat sein Gesicht gerade eine halbe Minute lang
         gesehen; was er hier wissen will, steht in den Zeilen darunter. -->
    <div class="ls-analyse__kreis" id="ls-analysekreis" aria-hidden="true">
      <span class="ls-analyse__zahl" id="ls-analysezahl"></span>
    </div>
    <div class="ls-schritte" id="ls-analyseschritte"></div>
  </div>
</section>






<script type="module" src="/apps/lifeskin/lifeskin-app.js"></script>
</body>
</html>
