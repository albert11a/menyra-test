<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E4F48" />
  <title>Lifeskin</title>

  <!-- Die Vorschau beim Teilen setzt api/lifeskin.js beim Ausliefern ein.
       Stuende sie hier fest, kaeme sie doppelt vor. -->

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Verbindung zu Firestore aufbauen, solange noch geladen wird. Auf dem
       Handy kostet eine neue Gegenstelle DNS, TCP und TLS - im schwachen Netz
       zusammen eine halbe Sekunde. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="//firestore.googleapis.com" />

  <link rel="stylesheet" href="/apps/lifeskin/lifeskin-styles.css" />

  <!-- Alle Module auf einmal anfordern statt in Wellen. Ohne diese Zeilen
       findet der Browser lifeskin-metrics.js erst, wenn lifeskin-app.js da
       ist und ihn danach fragt - und dann noch einmal fuer jedes weitere. -->
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-app.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-metrics.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-face.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-rules.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-content.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-catalog.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-session.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-config.js" />
</head>
<body>

<div class="ls-fortschritt" aria-hidden="true"><div class="ls-fortschritt__balken"></div></div>

<!-- 01 Einstieg -->
<section class="ls-schirm" id="ls-einstieg" data-aktiv="ja">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-inhalt ls-inhalt--mitte">
    <h1 data-text="einstiegTitel"></h1>
    <p class="ls-gross ls-leise" data-text="einstiegUnter"></p>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-start" data-text="einstiegKnopf"></button>
  </div>
</section>

<!-- 02 Name und Alter -->
<section class="ls-schirm" id="ls-name" data-aktiv="nein">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-inhalt">
    <div class="ls-feld">
      <h2 data-text="nameTitel"></h2>
      <input class="ls-eingabe" id="ls-namefeld" type="text" name="vorname"
             autocomplete="given-name" enterkeyhint="next"
             data-platzhalter="namePlatzhalter" />
    </div>
    <div class="ls-feld">
      <h2 data-text="alterTitel"></h2>
      <div class="ls-alter" id="ls-alterwahl"></div>
      <p class="ls-klein" data-text="alterGrund"></p>
    </div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-nameweiter" data-text="weiter" disabled></button>
  </div>
</section>

<!-- 03 Vorbereitung -->
<section class="ls-schirm" id="ls-vorbereitung" data-aktiv="nein">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-inhalt">
    <h2 data-text="vorbereitungTitel"></h2>
    <div class="ls-regeln">
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A9 9 0 0 1 21 12a8.9 8.9 0 0 1-2.2 4.5M6.2 6.2A9 9 0 0 0 3 12a9 9 0 0 0 9 7 8.9 8.9 0 0 0 3.4-.7"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungMakeup"></span>
      </div>
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungLicht"></span>
      </div>
      <div class="ls-regel">
        <span class="ls-regel__zeichen" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
        </span>
        <span class="ls-regel__text" data-text="vorbereitungHoehe"></span>
      </div>
    </div>
    <div class="ls-schutz">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.4 9-8 10-4.6-1-8-5-8-10V6z"/></svg>
      <span data-text="vorbereitungSchutz"></span>
    </div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-kameraoeffnen" data-text="vorbereitungKnopf"></button>
  </div>
</section>

<!-- 04 Aufnahme -->
<section class="ls-schirm ls-schirm--kamera" id="ls-kamera" data-aktiv="nein">
  <div class="ls-kamera">
    <!-- playsinline ist auf iOS Pflicht: ohne springt Safari in den
         Vollbildmodus und der Trichter bricht ab. -->
    <video id="ls-video" playsinline muted autoplay></video>
    <canvas id="ls-leinwand"></canvas>
    <div class="ls-oval" id="ls-oval" data-stand="rot"><div class="ls-oval__ring"></div></div>
  </div>
  <p class="ls-hinweis" id="ls-kamerahinweis"></p>
  <div class="ls-pruefungen">
    <span class="ls-pruefung" id="ls-pruefung-gesicht" data-ok="nein"><i class="ls-pruefung__punkt"></i><span data-text="pruefungGesicht"></span></span>
    <span class="ls-pruefung" id="ls-pruefung-abstand" data-ok="nein"><i class="ls-pruefung__punkt"></i><span data-text="pruefungAbstand"></span></span>
    <span class="ls-pruefung" id="ls-pruefung-licht" data-ok="nein"><i class="ls-pruefung__punkt"></i><span data-text="pruefungLicht"></span></span>
    <span class="ls-pruefung" id="ls-pruefung-ruhe" data-ok="nein"><i class="ls-pruefung__punkt"></i><span data-text="pruefungRuhe"></span></span>
  </div>
  <div class="ls-fuss">
    <!-- Der Ausloeser ist der Rueckfallweg. Im Regelfall loest die Seite
         selbst aus, sobald alle vier Pruefungen drei Sekunden gruen sind. -->
    <button type="button" class="ls-knopf ls-knopf--leise" id="ls-manuell" data-text="aufnahmeKnopfManuell"></button>
  </div>
</section>

<!-- 05 Analyse -->
<section class="ls-schirm" id="ls-analyse" data-aktiv="nein">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-analyse">
    <div class="ls-analyse__bild"><img id="ls-analysebild" alt="" /></div>
    <div class="ls-schritte" id="ls-analyseschritte"></div>
  </div>
</section>

<!-- 06 Befund -->
<section class="ls-schirm" id="ls-befund" data-aktiv="nein">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-inhalt">
    <h2 id="ls-befundtitel"></h2>
    <span class="ls-typ" id="ls-hauttyp"></span>

    <div class="ls-lob" id="ls-lob">
      <div>
        <div class="ls-lob__marke" data-text="befundGut"></div>
        <p id="ls-lobtext"></p>
      </div>
    </div>

    <div class="ls-werte" id="ls-werte"></div>
    <p class="ls-kombi" id="ls-kombi"></p>
    <p class="ls-haftung" id="ls-haftung"></p>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-befundweiter" data-text="befundWeiter"></button>
    <input class="ls-eingabe ls-verstecken" id="ls-whatsappnummer" type="tel"
           inputmode="tel" autocomplete="tel" placeholder="+383 …" />
    <button type="button" class="ls-knopf ls-knopf--text" id="ls-whatsapp" data-text="befundWhatsApp"></button>
  </div>
</section>

<!-- 07 Empfehlung -->
<section class="ls-schirm" id="ls-empfehlung" data-aktiv="nein">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-inhalt">
    <h2 data-text="empfehlungTitel"></h2>
    <div class="ls-produkte" id="ls-produkte"></div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf" id="ls-empfehlungweiter" data-text="weiter"></button>
  </div>
</section>

<!-- 08 Angebot -->
<section class="ls-schirm" id="ls-angebot" data-aktiv="nein">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-inhalt">
    <h2 id="ls-angebottitel"></h2>

    <div class="ls-preis">
      <div id="ls-einzelpreise"></div>
      <div class="ls-preis__zeile" style="border-top:1px solid var(--linie);padding-top:12px">
        <span class="ls-preis__anker" id="ls-anker"></span>
        <span class="ls-preis__gross" id="ls-setpreis"></span>
      </div>
      <span class="ls-preis__spart" id="ls-spart"></span>
      <span class="ls-preis__tag" id="ls-protag"></span>
    </div>

    <div class="ls-sicher">
      <span class="ls-sicher__zeile">
        <svg class="ls-sicher__zeichen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
        <strong data-text="angebotNachnahme"></strong>
      </span>
      <span class="ls-sicher__zeile">
        <svg class="ls-sicher__zeichen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="ls-rueckgabe"></span>
      </span>
      <span class="ls-sicher__zeile">
        <svg class="ls-sicher__zeichen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="ls-lieferzeit"></span>
      </span>
    </div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf ls-knopf--kauf" id="ls-bestellen" data-text="angebotKnopf"></button>
  </div>
</section>

<!-- 09 Anschrift -->
<section class="ls-schirm" id="ls-anschrift" data-aktiv="nein">
  <div class="ls-uebersicht">
    <span class="ls-uebersicht__name" id="ls-uebersichtname"></span>
    <span class="ls-uebersicht__preis" id="ls-uebersichtpreis"></span>
  </div>
  <div class="ls-inhalt">
    <h2 data-text="anschriftTitel"></h2>

    <div class="ls-fehler ls-verstecken" id="ls-fehler">
      <p id="ls-fehlertext"></p>
      <button type="button" class="ls-knopf ls-knopf--text" id="ls-fehlernochmal" style="justify-content:flex-start;padding-left:0"></button>
    </div>

    <div class="ls-formular" id="ls-formular">
      <label class="ls-feld">
        <span class="ls-feld__marke" data-text="feldName"></span>
        <input class="ls-eingabe" name="name" type="text" autocomplete="name" enterkeyhint="next" />
      </label>
      <label class="ls-feld">
        <span class="ls-feld__marke" data-text="feldStrasse"></span>
        <input class="ls-eingabe" name="strasse" type="text" autocomplete="street-address" enterkeyhint="next" />
      </label>
      <label class="ls-feld">
        <span class="ls-feld__marke" data-text="feldOrt"></span>
        <input class="ls-eingabe" name="ort" type="text" autocomplete="address-level2" enterkeyhint="next" />
      </label>
      <label class="ls-feld">
        <span class="ls-feld__marke" data-text="feldPlz"></span>
        <input class="ls-eingabe" name="plz" type="text" inputmode="numeric" autocomplete="postal-code" enterkeyhint="next" />
      </label>
      <label class="ls-feld">
        <span class="ls-feld__marke" data-text="feldTelefon"></span>
        <input class="ls-eingabe" name="telefon" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="done" />
        <span class="ls-klein" data-text="telefonGrund"></span>
      </label>
    </div>
  </div>
  <div class="ls-fuss">
    <button type="button" class="ls-knopf ls-knopf--kauf" id="ls-absenden" data-text="bestellKnopf"></button>
    <p class="ls-klein" style="text-align:center" data-text="angebotNachnahme"></p>
  </div>
</section>

<!-- 10 Danke -->
<section class="ls-schirm" id="ls-danke" data-aktiv="nein">
  <div class="ls-kopf"><span class="ls-marke">Lifeskin</span></div>
  <div class="ls-inhalt ls-inhalt--mitte">
    <span class="ls-danke__zeichen" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
    </span>
    <h1 id="ls-danketitel"></h1>
    <p class="ls-nummer" id="ls-dankenummer"></p>
    <p class="ls-gross ls-leise" data-text="dankeText"></p>
    <p class="ls-leise" data-text="dankeWiederholung"></p>
  </div>
</section>

<script type="module" src="/apps/lifeskin/lifeskin-app.js"></script>
</body>
</html>
