<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MNYRA Landing</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --ink: #111827;
      --muted: #64748b;
      --accent: #4f46e5;
      --panel: #ffffff;
      --line: #e2e8f0;
      --placeholder: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", sans-serif;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
    }

    .glow {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.2) 0%, rgba(79, 70, 229, 0) 70%);
      top: 18%;
      left: 14%;
      filter: blur(18px);
      pointer-events: none;
    }

    .card {
      width: min(540px, 100%);
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .greeting-wrap {
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .greeting {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(26px, 5vw, 34px);
      color: var(--accent);
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      transition: opacity 320ms ease, transform 320ms ease;
    }

    .greeting.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--placeholder);
    }

    .brand-name {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 0.16em;
      row-gap: 0;
      font-size: clamp(42px, 10vw, 56px);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.04em;
    }

    .copy {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.65;
      max-width: 380px;
    }

    .copy span {
      display: block;
    }

    .status {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.7;
    }

    .error {
      color: #be123c;
      opacity: 1;
    }

    @media (max-width: 420px) {
      .page {
        padding: 18px;
      }

      .card {
        gap: 14px;
      }

      .copy {
        font-size: 13px;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800;900&family=Playfair+Display:wght@500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page">
    <div class="glow" aria-hidden="true"></div>
    <main class="card" aria-live="polite">
      <div class="greeting-wrap">
        <h1 id="greeting" class="greeting is-visible">Mire se vini</h1>
      </div>

      <div class="brand-row">
        <div class="logo-box">
          <img id="logo" src="https://placehold.co/200x200/f8fafc/94a3b8?text=LOGO" alt="Business Logo" />
        </div>
        <h2 id="brandName" class="brand-name">business.</h2>
      </div>

      <p class="copy" id="message">
        <span>Biznesi yt eshte tashme i pergatitur ne Mnyra.</span>
        <span>Prezenca jote digjitale eshte gati per aktivizim.</span>
      </p>

      <div id="status" class="status">Faqja po ngarkohet...</div>
    </main>
  </div>

  <script type="module">
    import { db } from "/shared/firebase-config.js";
    import { doc, getDoc } from "/shared/vendor/firebase/11.0.0/firebase-firestore.js";

    const greetings = [
      "Mire se vini",
      "Welcome",
      "Willkommen",
      "Bienvenido",
      "Bienvenue",
      "Benvenuto",
      "Ola",
      "Welkom",
      "Valkommen",
      "Hos geldiniz",
      "Yokoso",
      "Huanying",
      "Namaste"
    ];

    const greetingNode = document.getElementById("greeting");
    const logoNode = document.getElementById("logo");
    const brandNode = document.getElementById("brandName");
    const messageNode = document.getElementById("message");
    const statusNode = document.getElementById("status");

    let greetingIndex = 0;

    function setStatus(text, isError = false) {
      statusNode.textContent = String(text || "");
      statusNode.classList.toggle("error", !!isError);
    }

    function cycleGreeting() {
      window.setInterval(() => {
        greetingNode.classList.remove("is-visible");
        window.setTimeout(() => {
          greetingIndex = (greetingIndex + 1) % greetings.length;
          greetingNode.textContent = greetings[greetingIndex];
          greetingNode.classList.add("is-visible");
        }, 210);
      }, 4000);
    }

    function readRestaurantIdFromPath() {
      const path = String(window.location.pathname || "");
      const match = path.match(/\/lp\/([^/?#]+)/i);
      if (!match || !match[1]) return "";
      try {
        return decodeURIComponent(match[1]);
      } catch {
        return match[1];
      }
    }

    function readRestaurantIdFromQuery() {
      const params = new URLSearchParams(window.location.search);
      return String(
        params.get("rid")
        || params.get("r")
        || params.get("restaurantId")
        || params.get("restaurant")
        || ""
      ).trim();
    }

    function resolveLogoUrl(...values) {
      for (const value of values) {
        const next = String(value || "").trim();
        if (next) return next;
      }
      return "https://placehold.co/200x200/f8fafc/94a3b8?text=LOGO";
    }

    function normalizeBusinessNameColor(value, fallback = "#111827") {
      const raw = String(value || "").trim();
      return /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : fallback;
    }

    function splitBusinessNameParts(value) {
      const businessName = String(value || "Business").trim() || "Business";
      const baseName = businessName.replace(/\.+$/g, "").trim() || businessName;
      const parts = baseName.split(/\s+/).filter(Boolean);
      if (parts.length <= 1) {
        return { part1: `${baseName}.`, part2: "" };
      }
      return {
        part1: parts.slice(0, -1).join(" "),
        part2: `${parts[parts.length - 1]}.`
      };
    }

    function renderBrandName(value, colorPart1, colorPart2) {
      const parts = splitBusinessNameParts(value);
      brandNode.textContent = "";
      const firstPartNode = document.createElement("span");
      firstPartNode.textContent = parts.part1;
      firstPartNode.style.color = colorPart1;
      brandNode.appendChild(firstPartNode);
      if (parts.part2) {
        const secondPartNode = document.createElement("span");
        secondPartNode.textContent = parts.part2;
        secondPartNode.style.color = colorPart2;
        brandNode.appendChild(secondPartNode);
      }
    }

    function renderScreenOne(payload = {}) {
      const businessName = String(payload.businessName || "Business").trim() || "Business";
      const logoUrl = resolveLogoUrl(payload.logoUrl, payload.logo);
      const businessNameColor = normalizeBusinessNameColor(payload.businessNameColor);
      const legacyPart2Color = businessNameColor && businessNameColor.toLowerCase() !== "#111827" ? businessNameColor : "";
      const businessNameColorPart1 = normalizeBusinessNameColor(payload.businessNameColorPart1 || businessNameColor, "#111827");
      const businessNameColorPart2 = normalizeBusinessNameColor(payload.businessNameColorPart2 || legacyPart2Color, "#4f46e5");
      const line1 = String(payload.messageLine1 || `${businessName} eshte tashme i pergatitur ne Mnyra.`).trim();
      const line2 = String(payload.messageLine2 || "Prezenca jote digjitale eshte gati per aktivizim.").trim();

      logoNode.src = logoUrl;
      logoNode.alt = `${businessName} Logo`;
      renderBrandName(businessName, businessNameColorPart1, businessNameColorPart2);
      messageNode.textContent = "";
      const firstLineNode = document.createElement("span");
      const secondLineNode = document.createElement("span");
      firstLineNode.textContent = line1;
      secondLineNode.textContent = line2;
      messageNode.appendChild(firstLineNode);
      messageNode.appendChild(secondLineNode);
      setStatus("Lead Landing aktive.");
    }

    async function loadLanding() {
      const restaurantId = readRestaurantIdFromQuery() || readRestaurantIdFromPath();
      if (!restaurantId) {
        setStatus("Nuk u gjet ID e lokalit.", true);
        return;
      }

      try {
        const [metaSnap, restaurantSnap] = await Promise.all([
          getDoc(doc(db, "restaurants", restaurantId, "public", "meta")),
          getDoc(doc(db, "restaurants", restaurantId))
        ]);

        const meta = metaSnap.exists() ? (metaSnap.data() || {}) : {};
        const restaurant = restaurantSnap.exists() ? (restaurantSnap.data() || {}) : {};
        const screenOne = meta.landingScreenOne && typeof meta.landingScreenOne === "object"
          ? meta.landingScreenOne
          : {};

        renderScreenOne({
          businessName: screenOne.businessName || meta.name || meta.restaurantName || restaurant.name || restaurant.restaurantName || "Business",
          businessNameColor: screenOne.businessNameColor || meta.businessNameColor || meta.landingBusinessNameColor || restaurant.businessNameColor || restaurant.landingBusinessNameColor,
          businessNameColorPart1: screenOne.businessNameColorPart1 || meta.businessNameColorPart1 || meta.landingBusinessNameColorPart1 || restaurant.businessNameColorPart1 || restaurant.landingBusinessNameColorPart1,
          businessNameColorPart2: screenOne.businessNameColorPart2 || meta.businessNameColorPart2 || meta.landingBusinessNameColorPart2 || restaurant.businessNameColorPart2 || restaurant.landingBusinessNameColorPart2,
          logoUrl: screenOne.logoUrl || meta.logoUrl || meta.logo || restaurant.logoUrl || restaurant.logo,
          logo: restaurant.logo,
          messageLine1: screenOne.messageLine1,
          messageLine2: screenOne.messageLine2
        });
      } catch (err) {
        console.error(err);
        setStatus("Faqja nuk mund te ngarkohej.", true);
      }
    }

    cycleGreeting();
    loadLanding();
  </script>
</body>
</html>
