<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

  <link rel="preconnect" href="https://menyra-media.alberthoti-vsa.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="//menyra-media.alberthoti-vsa.workers.dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="512x512" href="/apps/menyra-social/assets/icon-512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/apps/menyra-social/assets/icon-192.png" />
  <link rel="modulepreload" href="/apps/menyra-social/social-app.js?v=2026-03-06-perf-1">
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      }
    };
  </script>
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "@shared/": "/shared/",
      "@apps/": "/apps/"
    }
  }
  </script>
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body { background: #f8fafc; color: #0f172a; margin: 0; }
    #app {
      min-height: 100vh;
      height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
    }
    :root {
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }
    html.modal-open,
    body.modal-open {
      overflow: hidden;
      overscroll-behavior: none;
    }
    html.modal-open { background: #ffffff; }
    body.modal-open { background: #ffffff; }
    body.modal-open #app,
    body.modal-open #app > .min-h-screen { background: #ffffff !important; }
    body.modal-open #app { pointer-events: none; visibility: hidden; }
    body.modal-open #overlayRoot,
    body.modal-open #overlayRoot > * { pointer-events: auto; visibility: visible; }
    .modal-overlay { position: fixed; inset: 0; padding-bottom: env(safe-area-inset-bottom); }
    .modal-sheet {
      max-height: calc(100dvh - env(safe-area-inset-bottom));
      border-bottom-width: 0 !important;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .leaflet-container { background: #0f172a; }
    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom { display: none !important; }
    .custom-div-icon { background: transparent; border: none; overflow: visible; }
    .leaflet-marker-icon { overflow: visible; }

    /* Pulsierender Radar-Effekt fuer User-Standort */
    .user-radar { position: relative; z-index: 1; }
    .user-radar::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.4);
      animation: radar-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      z-index: -1;
    }
    @keyframes radar-ping {
      75%, 100% { transform: scale(1.8); opacity: 0; }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-in-left { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slide-in-right { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slide-in-bottom { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fade-in 0.4s ease-out forwards; }
    .slide-in-from-left-10 { animation: slide-in-left 0.5s ease-out forwards; }
    .slide-in-from-right-10 { animation: slide-in-right 0.5s ease-out forwards; }
    .slide-in-from-bottom-10 { animation: slide-in-bottom 0.6s ease-out forwards; }
    .slide-in-from-bottom-6 { animation: slide-in-bottom 0.3s ease-out forwards; }
    body.fast-mode .animate-in,
    body.fast-mode .slide-in-from-left-10,
    body.fast-mode .slide-in-from-right-10,
    body.fast-mode .slide-in-from-bottom-10,
    body.fast-mode .slide-in-from-bottom-6 { animation: none !important; }
    body.fast-mode .backdrop-blur,
    body.fast-mode .backdrop-blur-sm,
    body.fast-mode .backdrop-blur-md,
    body.fast-mode .backdrop-blur-lg,
    body.fast-mode .backdrop-blur-xl { backdrop-filter: none !important; }
    body.fast-mode .shadow-2xl,
    body.fast-mode .shadow-xl,
    body.fast-mode .shadow-lg,
    body.fast-mode .shadow-md,
    body.fast-mode .shadow-sm { box-shadow: none !important; }
    body.fast-mode img { background: #e2e8f0; }
    body.fast-mode .transition-transform,
    body.fast-mode .transition-all { transition: none !important; }
    body.fast-mode .feed-card { contain: content; }
    body.fast-mode .animate-pulse { animation: none !important; }
    body.fast-mode .group-hover\:scale-105 { transform: none !important; }
    img { display: block; background: transparent; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .modal-scroll { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    #appBootShell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(120% 120% at 0% 0%, #e0e7ff 0%, #f8fafc 45%, #ffffff 100%);
      color: #0f172a;
    }
    .boot-shell-card {
      width: min(480px, calc(100vw - 32px));
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 28px;
      padding: 22px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }
    .boot-pulse {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
      box-shadow: 0 12px 26px rgba(79, 70, 229, 0.32);
      animation: boot-float 1.6s ease-in-out infinite;
    }
    .boot-line {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%);
      background-size: 200% 100%;
      animation: boot-shimmer 1.4s linear infinite;
    }
    @keyframes boot-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes boot-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @supports (-webkit-touch-callout: none) {
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app">
    <div id="appBootShell">
      <div class="boot-shell-card">
        <div style="display:flex;align-items:center;gap:14px;">
          <div class="boot-pulse" aria-hidden="true"></div>
          <div style="display:grid;gap:8px;flex:1;">
            <div style="font-weight:800;letter-spacing:-0.02em;font-size:1.2rem;">MNYRA Social</div>
            <div style="font-size:0.82rem;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">wird gestartet ...</div>
          </div>
        </div>
        <div style="display:grid;gap:10px;margin-top:18px;">
          <div class="boot-line" style="width:88%;"></div>
          <div class="boot-line" style="width:68%;"></div>
          <div class="boot-line" style="width:76%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const SOCIAL_ENTRY = "/apps/menyra-social/social-app.js?v=2026-03-06-perf-1";
    const LUCIDE_URL = "https://unpkg.com/lucide@latest";

    function loadLucideInBackground() {
      const script = document.createElement("script");
      script.src = LUCIDE_URL;
      script.async = true;
      document.head.appendChild(script);
    }

    async function bootstrapSocialApp() {
      try {
        await import(SOCIAL_ENTRY);
      } catch (err) {
        const app = document.getElementById("app");
        if (app) {
          app.innerHTML = "<div style='padding:24px;font-family:Plus Jakarta Sans,sans-serif;color:#0f172a;'>Start fehlgeschlagen. Bitte Seite neu laden.</div>";
        }
        console.error("social bootstrap failed", err);
      }
    }

    if ("requestAnimationFrame" in window) {
      requestAnimationFrame(() => bootstrapSocialApp());
    } else {
      setTimeout(() => bootstrapSocialApp(), 0);
    }
    if ("requestIdleCallback" in window) {
      requestIdleCallback(() => loadLucideInBackground(), { timeout: 2000 });
    } else {
      setTimeout(() => loadLucideInBackground(), 900);
    }
  </script>
  <script type="module" src="/apps/menyra-social/pwa.js?v=2026-03-06-perf-1"></script>
</body>
</html>
