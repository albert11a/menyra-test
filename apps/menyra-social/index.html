<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MENYRA Social</title>
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MENYRA Social" />
  <meta name="application-name" content="MENYRA Social" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/apps/menyra-social/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="1024x1024" href="/apps/menyra-social/assets/menyra-social-logo.png" />
  <link rel="apple-touch-icon" href="/apps/menyra-social/assets/menyra-social-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "@shared/": "/shared/",
      "@apps/": "/apps/"
    }
  }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-in-left { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slide-in-right { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slide-in-bottom { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fade-in 0.4s ease-out forwards; }
    .slide-in-from-left-10 { animation: slide-in-left 0.5s ease-out forwards; }
    .slide-in-from-right-10 { animation: slide-in-right 0.5s ease-out forwards; }
    .slide-in-from-bottom-10 { animation: slide-in-bottom 0.6s ease-out forwards; }
    .slide-in-from-bottom-6 { animation: slide-in-bottom 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="./social-app.js"></script>
  <script type="module" src="/apps/menyra-social/pwa.js"></script>
</body>
</html>
