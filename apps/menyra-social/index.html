    /* Die feste Blende hinter der Kopfzeile.
       ===================================================================
       Am Seitenende faehrt Chrome iOS beim Hoch- und wieder Runterscrollen
       seine Adressleiste ein und aus. position: sticky wird dabei aus dem
       Scroll-Offset gerechnet, und fuer diese Bilder ist der Offset veraltet -
       die Kopfzeile hinkt sichtbar hinterher, und darueber steht, was
       eigentlich hinter ihr liegen sollte.
       Dagegen hilft kein Griff AN der Kopfzeile: was an ihrer Ebene haengt,
       hinkt mit ihr mit (ein Ueberstand nach oben tat genau das). Es braucht
       etwas, das gar nicht erst am Scroll haengt.
       position: fixed ist viewport-gebunden: WebKit und Blink halten die
       Blende waehrend solcher Uebergaenge an der Ansicht, statt sie aus einem
       Offset zu rechnen. Mit eigener Ebene (translateZ(0)) haelt sie sogar der
       Scrolling-Thread selbst - dieselbe Ebene, auf der iOS auch scrollt.
       Sie deckt genau die Flaeche der oberen Leiste ab und liegt im Stapel
       zwischen Seiteninhalt und Kopfzeile. Steht die Kopfzeile sauber, ist sie
       vollstaendig hinter ihr und ausserdem farbgleich mit dem Seitengrund -
       zu sehen ist sie also nie. Hinkt die Kopfzeile, fuellt sie den Spalt.
       Ausdruecklich KEIN Platz im Dokument: sie malt nur. Ein Platzhalter im
       Fluss hat frueher beim Aufklappen der Location die ganze Seite darunter
       verschoben, und die Kacheln blitzten.
       Sie steht bewusst AUSSERHALB von .smart-header-shell: deren transform
       waere sonst ihr Bezugsrahmen, und fixed haette wieder am Scroll
       gehangen statt am Bild. */
    .smart-header-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--smart-header-top-height, calc(max(0.5rem, var(--safe-area-top)) + 4.0625rem));
      z-index: 88;
      pointer-events: none;
      background: #f8fafc;
      transform: translateZ(0);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    /* Dieselbe Flaeche noch einmal - aber ausserhalb von #app, wo kein
       Neuaufbau sie erreichen kann. Sie ist der Boden, der auch dann noch
       traegt, wenn die Kopfzeile selbst fuer ein paar Bilder nicht da ist.
       Ohne Kopfzeile im Dokument bleibt sie aus, sonst laege sie ueber dem
       Inhalt von Ansichten, die gar keine Kopfzeile haben. */
    #smartHeaderGuard {
      display: none;
    }
    html.smart-header-present #smartHeaderGuard {
      display: block;
      position: fixed;
      /* Sie fangt WEIT ueber dem Bildrand an, nicht bei 0.
         Der Streifen, den Chrome iOS beim Ausfahren der Adressleiste freigibt,
         liegt OBERHALB des Bildursprungs - bei 0 anzufangen deckt ihn also
         gar nicht. Solange die Kopfzeile steht, faengt ihn ihr eigener
         Ueberstand ab; fehlt sie fuer ein paar Bilder (die Aufnahme zeigt
         sieben), fehlt auch der. Dann traegt nur noch diese Flaeche hier -
         und deshalb reicht sie genauso weit hinauf.
         Sichtbar wird davon nichts: oberhalb des Bildrands ist ohnehin nichts
         zu sehen, und die Farbe ist die des Seitengrunds. */
      top: calc(-1 * var(--smart-header-guard-overscan));
      left: 0;
      right: 0;
      height: calc(var(--smart-header-guard-overscan) + var(--smart-header-top-height, calc(max(0.5rem, var(--safe-area-top)) + 4.0625rem)));
      /* Knapp unter der Kopfzeile (100), aber ueber allem anderen. Nachgemessen
         hat kein Element im Inhalt ueberhaupt einen z-index ab 50 - hier ist
         also Luft, und im Zweifel gewinnt die Wache gegen den Inhalt. */
      z-index: 99;
      pointer-events: none;
      background: #f8fafc;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    /* Auf der Karte steht die Kopfzeile im Fluss - dort deckt sie nichts ab. */
    html.smart-header-map-scope #smartHeaderGuard {
      display: none;
    }
    /* Auf der Karte steht die Kopfzeile im Fluss ihres eigenen Wrappers und
       scrollt gar nicht - dort gibt es nichts zu ueberdecken. */
    .map-fixed-page-header .smart-header-backdrop {
      display: none;
    }
    .smart-header-shell {
      /* Eine Farbe fuer die ganze Kopfzeile. Vorher standen hier vier
         Flaechen-Variablen, die nie jemand gelesen hat - und die Shell selbst
         hatte gar keinen Hintergrund. */
      --smart-header-surface: #f8fafc;
      --smart-header-border: rgb(226 232 240 / 0.82);
      position: -webkit-sticky;
      position: sticky;
      /* Die Kopfzeile reicht nach oben ueber ihre sichtbare Kante hinaus.
         ===================================================================
         Die Bildschirmaufnahme vom Geraet, Bild fuer Bild ausgemessen, zeigt
         den Hergang eindeutig:
           Bild 43-57  Browserleiste endet bei 246, Hamburger bei 345
           Bild 58     Browserleiste endet bei 251, Hamburger bei 435
           Bild 59-71  Leiste wandert 256 -> 330,   Hamburger bleibt 435
           Bild 72+    Browserleiste endet bei 336, Hamburger bei 435
         Die Kopfzeile bewegt sich also NICHT - sie steht ueber die ganze
         Stoerung hinweg still. Was sich bewegt, ist die Adressleiste von
         Chrome: sie faehrt ueber 14 Bilder aus. Die Seite steht sofort an
         ihrer Endstelle, die Leiste zieht langsam nach, und dazwischen wird
         ein Streifen frei, der sonst dauerhaft HINTER der Adressleiste liegt.
         In diesem Streifen steht Seiteninhalt, denn die Kopfzeile faengt
         genau an dessen Unterkante an - in Ruhe buendig, waehrend der Fahrt
         eben nicht.
         Deshalb hilft dort weder ein Element mit position: fixed (das haengt
         am selben Viewport-Ursprung wie die Kopfzeile und liegt damit genau
         dort, wo sie ohnehin ist) noch ein Ueberstand an einem
         Pseudo-Element. Was hilft, ist die Box selbst: sie reicht um
         --smart-header-overscan weiter nach oben und malt dort ihre eigene
         Flaeche.
         Der negative Aussenabstand zieht die Box nach oben, die gleich grosse
         Polsterung schiebt ihren Inhalt wieder an seinen Platz. Unterkante
         und alles darunter bleiben damit auf den Pixel, wo sie waren - es
         waechst nur Flaeche nach oben, in einen Bereich, den man in Ruhe gar
         nicht sieht. Das sticky-top wandert um denselben Betrag ins Negative,
         damit die sichtbare Kante weiter bei 0 klebt. */
      --smart-header-overscan: 200px;
      margin-top: calc(-1 * var(--smart-header-overscan));
      padding-top: var(--smart-header-overscan);
      top: calc(-1 * var(--smart-header-overscan));
      width: 100%;
      max-width: 100%;
      z-index: 100;
      pointer-events: none;
      isolation: isolate;
      /* Das klebende Element malt selbst deckend.
         Es ist das Element, aus dem der Browser die eigene Ebene baut, auf der
         die Kopfzeile beim Scrollen mitfaehrt. War sie durchsichtig, musste der
         Compositor sie gegen den Inhalt dahinter blenden statt ihn einfach zu
         ueberdecken - und wo dabei etwas fehlte, sah man den Inhalt. Deckend
         kann dort nichts mehr durch.
         Sichtbar aendert sich nichts: dieselbe Farbe malt darin schon
         .smart-header-top, ueber genau dieselbe Flaeche. */
      background: var(--smart-header-surface);
      /* HIER STAND EINE ERZWUNGENE EBENE - UND SIE WAR DIE URSACHE.
         =================================================================
         translateZ(0) + will-change: transform + backface-visibility: hidden
         standen hier, um die Kopfzeile auf eine eigene Compositing-Ebene zu
         zwingen. Genau diese Kombination laesst WebKit auf iOS die KINDER
         eines Elements beim Scrollen nicht mehr malen: die Flaeche bleibt
         stehen, Logo und Icons verschwinden, bis das Scrollen aufhoert. Am
         Geraet sah man es als "Kopfzeile weg, nur noch ihre Flaeche" - und
         die Bildschirmaufnahme hat sieben Bilder ohne Kopfzeile gezeigt.
         Es ist ein bekannter WebKit-Fehler, kein Feinschliff. Die Ebene ist
         deshalb raus, samt der Gegenregel fuer die Karte, die es ohne sie
         nicht mehr braucht.
         Was sie erreichen sollte, erreicht sie ohnehin nicht: Chrome auf iOS
         benutzt die WebView des Systems und muss sie beim Wechsel der
         Adressleiste neu vermessen; kein CSS einer Seite kann ein Element
         waehrend dieser Fahrt Bild fuer Bild an die Leiste koppeln. Der Spalt
         laesst sich nur fuellen - das erledigen der Ueberstand nach oben und
         die Wache in index.html, beide ohne erzwungene Ebene. */
      box-shadow: 0 8px 18px -22px rgb(15 23 42 / 0.12), 0 14px 24px -30px rgb(15 23 42 / 0.1);
    }
    .smart-header-shell::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -16px;
      height: 16px;
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(180deg, rgb(15 23 42 / 0.05) 0%, rgb(15 23 42 / 0.025) 38%, rgb(15 23 42 / 0) 100%);
    }
    /* Der Ueberstand nach OBEN - der zweite von zwei Griffen, und er deckt den
       Fall ab, den die feste Blende NICHT abdecken kann.
       ===================================================================
       Die Bildschirmaufnahme vom Geraet zeigt es Bild fuer Bild: waehrend
       Chrome iOS am Seitenende seine Adressleiste ausfaehrt, wird die ganze
       Seite rund 25px zu tief gezeichnet. Im Streifen darueber steht genau
       der Inhalt, der oberhalb der SOLLposition der Kopfzeile liegt - der
       Inhalt hat sich also nicht bewegt, die Kopfzeile wurde versetzt.
       Wird die ganze Seite versetzt, wandert alles mit, was in ihr steht -
       auch ein Element mit position: fixed. Die Blende allein greift dann
       nicht. Was hier hilft, ist Flaeche: die Kopfzeile malt ueber ihre
       Oberkante hinaus weiter, und der Versatz laeuft in diese Flaeche
       hinein statt in den Seiteninhalt.
       Beide Griffe stehen bewusst nebeneinander, sie decken verschiedene
       Faelle:
         - Ueberstand: die ganze Seite ist versetzt (Fall der Aufnahme).
         - Blende: nur die klebende Kopfzeile ist aus einem veralteten
           Scroll-Offset gerechnet, der Inhalt steht richtig.
       Beide sind unsichtbar, solange nichts hinkt: der Ueberstand liegt dann
       ausserhalb des Bildes, die Blende hinter der Kopfzeile.
       320px decken den groessten am Geraet gemessenen Versatz ab. */
    .smart-header-shell::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 320px;
      pointer-events: none;
      background: var(--smart-header-surface);
    }
    /* Auf der Karte steht die Kopfzeile im Fluss ihres Wrappers - dort gibt es
       nichts zu ueberdecken, und der Ueberstand laege ueber dem Inhalt. */
    .map-fixed-page-header .smart-header-shell::before {
      content: none;
    }
    /* Ebenso auf der Karte: dort scrollt nichts hinter die Kopfzeile, und der
       negative Aussenabstand wuerde sie aus ihrem Wrapper herausziehen. */
    .map-fixed-page-header .smart-header-shell {
      --smart-header-overscan: 0px;
      margin-top: 0;
      padding-top: 0;
      top: 0;
    }
    .smart-header-top {
      position: relative;
      z-index: 2;
      pointer-events: auto;
      padding-top: max(0.5rem, var(--safe-area-top));
      background: var(--smart-header-surface);
      border-bottom: 1px solid var(--smart-header-border);
      box-shadow: inset 0 -1px 0 rgb(255 255 255 / 0.7);
    }
    .smart-header-tabs {
      position: relative;
      left: 0;
      right: 0;
      top: 0;
      z-index: 1;
      pointer-events: auto;
      background: #f8fafc;
      border-bottom: 1px solid var(--smart-header-border);
      box-shadow: inset 0 -1px 0 rgb(255 255 255 / 0.7);
      transition: none;
    }
    /* Die Pill-Zeile steht ausserhalb des stickenden Shells und behaelt IMMER
       ihren Platz im Dokument: dieselbe Hoehe, derselbe Abstand nach oben. Sie
       wird nie aus dem Layout genommen - deshalb kann beim Ein- und Ausblenden
       nichts darunter verschoben werden oder springen.
       Normalfall: die Zeile sitzt am Seitenanfang und scrollt mit dem Inhalt
       hinter die obere Leiste - oben also sichtbar, unterwegs nicht, ganz ohne
       Zutun der Laufzeit. */
    .smart-header-tabs--main {
      position: relative;
      z-index: 90;
      border-bottom-width: 0;
      box-shadow: none;
      box-sizing: border-box;
    }
    /* Vom Pfeil unterwegs zurueckgeholt: die Zeile klebt unter der Leiste.
       relative und sticky belegen denselben Layout-Platz, das Umschalten
       aendert also nichts an der Seite - es kann nichts springen. Die 1px
       Ueberlappung schluckt Rundungsreste, damit an der Naht nie Content
       durchblitzt (die Leiste liegt im Stapel darueber und deckt sie ab). */
    html.smart-header-tabs-stuck .smart-header-tabs--main {
      position: -webkit-sticky;
      position: sticky;
      top: calc(var(--smart-header-top-height, 4.5rem) - 1px);
      /* Kein will-change hier - aus demselben Grund wie oben an der Shell:
         eine dauerhaft angesagte Ebene laesst WebKit auf iOS die Pills darin
         beim Scrollen nicht mehr malen. Waehrend der Fahrt des Pfeils setzt
         html.smart-header-tabs-sliding das will-change ohnehin gezielt, und
         nur dort wird es gebraucht. */
    }
    /* Innerhalb des Headers weder Linie noch Schatten - ein Schatten zwischen
       oberer Leiste und Tab-Zeile wurde als Farbunterschied gelesen und liess
       die Tabs vom Header abgetrennt wirken. */
    .smart-header-shell--split,
    .smart-header-shell--split .smart-header-top {
      border-bottom-color: transparent;
      box-shadow: none;
      transition: box-shadow 220ms ease;
    }
    /* Der gewohnte Header-Schatten sitzt immer an der untersten Header-Kante:
       solange die Tabs sichtbar sind an der Tab-Zeile, danach an der oberen
       Leiste. Beides blendet ueber denselben Fade-Wert um. */
    .smart-header-tabs--main {
      box-shadow: 0 8px 18px -22px rgb(15 23 42 / 0.12), 0 14px 24px -30px rgb(15 23 42 / 0.1);
    }
    .smart-header-tabs--main::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(-1 * var(--smart-header-edge-height));
      height: var(--smart-header-edge-height);
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(180deg, rgb(15 23 42 / 0.05) 0%, rgb(15 23 42 / 0.025) 38%, rgb(15 23 42 / 0) 100%);
    }
    /* Mit Tab-Zeile darf der Schatten der Leiste nicht mitgemalt werden: er
       raegt 16px nach unten und lag damit ueber der Zeile. Diese Kante
       uebernimmt stattdessen .smart-header-underline - im Stapel UNTER der
       Zeile, damit deren Hintergrund sie deckt, solange sie da ist. */
    .smart-header-shell--split::after {
      opacity: 0;
    }
    /* Schattenkante unter der Leiste. Sie klebt an derselben Stelle wie die
       Tab-Zeile, liegt aber darunter: ist die Zeile da, ist die Kante verdeckt;
       scrollt die Zeile weg, kommt sie zum Vorschein. Rein per CSS - kann beim
       schnellen Scrollen also nie nachhinken oder ueber den Tabs aufblitzen. */
    .smart-header-underline {
      position: -webkit-sticky;
      position: sticky;
      top: calc(var(--smart-header-top-height, 4.5rem) - 1px);
      height: var(--smart-header-edge-height);
      margin-bottom: calc(-1 * var(--smart-header-edge-height));
      z-index: 85;
      pointer-events: none;
      background: linear-gradient(180deg, rgb(15 23 42 / 0.05) 0%, rgb(15 23 42 / 0.025) 38%, rgb(15 23 42 / 0) 100%);
    }
    /* Eingesteckt: die geheftete Zeile liegt hinter der Leiste, waehrend sie
       hervorkommt oder wieder dahinter zurueckfaehrt. Nur ein transform -
       Hoehe und Platz im Dokument bleiben unangetastet, die Seite bewegt sich
       nicht. Die Leiste liegt im Stapel darueber und ist deckend, die Zeile
       ist dort also wirklich weg.
       Bewusst nur zusammen mit dem Kleben: die Zeile im normalen Fluss darf
       nie verschoben werden, sonst laeuft sie dem Scroll davon. */
    html.smart-header-tabs-stuck.smart-header-tabs-tucked .smart-header-tabs--main {
      transform: translateY(calc(-1 * var(--smart-header-tabs-row-height, 41px)));
      pointer-events: none;
    }
    /* Nur waehrend der Fahrt liegt der Uebergang an: ausserhalb muss die Zeile
       sofort sitzen, wo sie hingehoert. */
    html.smart-header-tabs-sliding .smart-header-tabs--main {
      transition: transform 260ms cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }
    /* Solange die Zeile unter der Leiste klebt, malt ihre eigene Schattenkante
       (.smart-header-tabs--main::after). Die sitzt an der Zeile und faehrt mit
       demselben transform mit - sie KANN gar nicht nachziehen, sie ist Teil
       derselben Bewegung. Die Kante unter der Leiste tritt solange zurueck:
       eingesteckt liegt die Zeile genau auf ihr, und beide zusammen waeren
       doppelt so dunkel.
       Der Wechsel ist unsichtbar, weil beide dieselbe Kante an derselben Stelle
       sind: ganz eingesteckt sitzt die Schattenkante der Zeile Pixel fuer Pixel
       dort, wo .smart-header-underline sitzt - gleicher Verlauf, gleiche Hoehe.
       Ein Ein- und Ausblenden per Uebergang braucht es dafuer nicht, und genau
       das hat vorher am Ende der Fahrt sichtbar nachgezogen. */
    html.smart-header-tabs-stuck .smart-header-underline {
      opacity: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      html.smart-header-tabs-sliding .smart-header-tabs--main {
        transition: none;
      }
    }
    /* Ist die Zeile nicht zu sehen, faerbt sich der Pfeil weich blau ein und
       dreht nach oben: das
       ist der Hinweis, dass man die Tabs darueber wieder aufmachen kann. */
    /* Die Icon-Reihe mit Pfeil. Die Luecke steht hier als Name, weil die Icons
       um Pfeilbreite PLUS Luecke zur Seite fahren, wenn es den Pfeil nicht
       gibt. Die Klasse setzt der Render, wenn die Pill-Zeile da ist - frueher
       stand hier ein :has(), das bei jedem Stil-Neuaufbau mit ausgewertet
       wurde. */
    .smart-header-actions--with-collapse {
      --smart-header-actions-gap: 0.25rem;
      /* Die Pfeilbreite steht an der REIHE, nicht am Pfeil: die Icons daneben
         fahren um genau diesen Betrag, und Variablen vererben nach unten, nicht
         seitwaerts. Am Pfeil deklariert kaeme sie bei den Icons nie an - auf
         schmalen Geraeten (1.6rem statt 1.75rem) waeren sie um den Unterschied
         verrutscht. */
      --smart-header-collapse-width: 1.75rem;
      /* Wie lange die Icons fahren. Steht als Name da, weil die Blende des
         Pfeils sich danach richten muss - siehe unten. Zwei Zahlen von Hand
         gleich zu halten waere eine Drift-Falle. */
      --smart-header-collapse-glide: 200ms;
      gap: var(--smart-header-actions-gap);
    }
    .smart-header-collapse-btn {
      color: rgb(100 116 139);
      touch-action: manipulation;

    /* Oben hat der Pfeil nichts zu tun: die Zeile steht da, wo sie hingehoert -
       es gibt nichts zu holen und nichts wegzuraeumen. Also ist er dort nicht
       zu sehen, und die Icons daneben stehen buendig an der rechten Kante.

       BEWEGT WIRD PER TRANSFORM, NICHT PER BREITE.
       Der Pfeil behaelt seinen Platz immer und wechselt nur die Deckkraft; die
       Icons daneben fahren um Pfeilbreite plus Luecke zur Seite. transform und
       opacity erledigt der Compositor - dieselbe Ebene, auf der iOS auch
       scrollt. Vorher fuhr die Breite des Pfeils samt negativem Aussenabstand:
       das ist eine Layout-Fahrt, 200ms lang ein Neuvermessen der Icon-Reihe,
       der Header-Zeile und der klebenden Leiste in JEDEM Bild, auf dem
       Hauptthread - und angestossen wird sie genau beim Scrollen. Daher das
       Stocken. Mit ihr sind auch min-width, die Null-Polsterung, die
       Null-Rahmen und das overflow:hidden weg: die brauchte nur, wer eine
       Breite wirklich auf 0 bringen muss.

       Wirklich weg ist der Pfeil trotzdem: visibility springt am Ende der Fahrt
       auf hidden (Verzoegerung in Hoehe der Fahrtdauer) - nicht anfassbar,
       nicht anspringbar, nicht vorgelesen. Beim Erscheinen umgekehrt, sofort.

       Eingegrenzt auf .smart-header-actions, damit die Regeln die Breiten aus
       dem Utility-Stylesheet und aus der Regel fuer schmale Geraete schlagen. */
    .smart-header-actions > .smart-header-collapse-btn {
      width: var(--smart-header-collapse-width, 1.75rem);
      flex: 0 0 auto;

         den sie einnehmen, wenn es ihn nicht gibt, ist genau seiner. Waehrend
         der Fahrt kreuzen sie ihn also zwangslaeufig. Damit man das nicht
         sieht, blendet er erst auf, wenn die Fahrt durch ist. */

         ist deshalb kuerzer als die Fahrt und wartet nicht. */
      transition:
        opacity 120ms ease-out,
        color 140ms ease-out,
        background-color 140ms ease-out,
        visibility 0s linear 120ms;
    }

    .smart-header-tabs-row {
      display: flex;
      align-items: stretch;

         schmaler, die Zeile bleibt trotzdem randlos gefuellt. */
      gap: 0.85rem;
      /* Seitlich buendig mit der Zeile darueber: links auf Hoehe der Striche im
         Menue-Icon, rechts auf Hoehe des Pfeils. */
      padding: 0.1rem 1.5rem 0.7rem;
    }
    .smart-header-pill {
      /* Die drei Pills teilen sich die Zeile zu gleichen Teilen und fuellen sie

      min-width: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.34rem;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      /* Abgerundetes Rechteck statt Kapselform - die Ecken laufen weniger weit. */
      border-radius: 0.7rem;
      border: 1px solid rgb(226 232 240 / 0.95);

         zeichnet die Pill. Erst der aktive Tab bekommt eine Flaeche. */

      color: rgb(100 116 139);
      padding: 0.4rem 0.6rem;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.12em;

         verzoegert - dieselbe Dauer wie beim Pfeil daneben. */

  <!-- Die Schutzflaeche der Kopfzeile. Sie steht bewusst AUSSERHALB von #app:
       ein Neuaufbau schreibt #app neu, und was darin steht, kann dabei fuer
       Bilder verschwinden. Die Bildschirmaufnahme vom Geraet zeigt genau das -
       ueber sieben Bilder (rund 117ms) ist die Kopfzeile gar nicht da und der
       Seiteninhalt steht an ihrer Stelle. Hier draussen kann kein Render sie
       je anfassen. Sichtbar wird sie nur, wenn es auch eine Kopfzeile gibt
       (html.smart-header-present), und selbst dann liegt sie hinter ihr. -->
  <div id="smartHeaderGuard" aria-hidden="true"></div>
  <script>
    // Messgeraet fuers Geraet: nur mit ?debug-header=1.
    // Am Schreibtisch laesst sich der Fehler nicht ausloesen - es fehlen die
    // Adressleisten-Fahrt von Chrome iOS und das echte Nachladen. Also misst
    // die Seite selbst mit und schreibt es sichtbar hin. Ein Standbild im
    // Moment des Fehlers beantwortet damit in einem Zug, was sonst geraten
    // werden muesste: welcher Stand laeuft, wo die Kopfzeile steht, ob sie
    // ueberhaupt im Dokument ist, und ob ein Neuaufbau dazwischengefahren ist.
    (() => {
      try {
        if (!/[?&]debug-header=1/.test(window.location.search)) return;
        const kasten = document.createElement("div");
        kasten.style.cssText = "position:fixed;left:4px;bottom:4px;z-index:2147483647;background:rgba(0,0,0,.82);color:#fff;font:600 10px/1.35 ui-monospace,Menlo,monospace;padding:5px 7px;border-radius:6px;pointer-events:none;white-space:pre;max-width:calc(100vw - 8px)";
        const anhaengen = () => document.body && document.body.appendChild(kasten);
        if (document.body) anhaengen(); else document.addEventListener("DOMContentLoaded", anhaengen, { once: true });

        let obenMin = Infinity;
        let obenMax = -Infinity;
        let fehlt = 0;      // Bilder ganz ohne Kopfzeile im Dokument
        let versetzt = 0;   // Bilder, in denen sie nicht bei 0 klebt
        let neuaufbauten = 0;
        let letzterKnoten = null;

        const beobachten = () => {
          const app = document.getElementById("app");
          if (!app || !window.MutationObserver) return;
          new MutationObserver(() => {
            const h = document.getElementById("smart-header-top");
            if (h !== letzterKnoten) { neuaufbauten++; letzterKnoten = h; }
          }).observe(app, { childList: true, subtree: true });
        };
        if (document.body) beobachten(); else document.addEventListener("DOMContentLoaded", beobachten, { once: true });

        const bild = () => {
          const el = document.getElementById("smart-header-top");
          const se = document.scrollingElement || document.documentElement;
          const scrollY = Math.round(window.scrollY || 0);
          const maxScroll = Math.max(0, Math.round((se.scrollHeight || 0) - (se.clientHeight || 0)));
          let zeileOben = "-";
          let hoehe = "-";
          if (!el) {
            fehlt++;
          } else {
            const r = el.getBoundingClientRect();
            if (r.top < obenMin) obenMin = r.top;
            if (r.top > obenMax) obenMax = r.top;
            if (Math.abs(r.top) > 1.5) versetzt++;
            zeileOben = r.top.toFixed(1);
            hoehe = Math.round(r.height);
          }
          const wache = document.getElementById("smartHeaderGuard");
          const wacheAn = wache ? getComputedStyle(wache).display !== "none" : false;
          kasten.textContent =
            (window.__MNYRA_BUILD_TOKEN__ || "?") + "\n" +
            "oben " + zeileOben + "  (" + (obenMin === Infinity ? "-" : obenMin.toFixed(0)) + ".." + (obenMax === -Infinity ? "-" : obenMax.toFixed(0)) + ")  hoch " + hoehe + "\n" +
            "fehlt " + fehlt + "  versetzt " + versetzt + "  neuaufbau " + neuaufbauten + "\n" +
            "scroll " + scrollY + "/" + maxScroll + (scrollY >= maxScroll - 1 ? "  ENDE" : "") + "  wache " + (wacheAn ? "an" : "aus");
          requestAnimationFrame(bild);
        };
        requestAnimationFrame(bild);
      } catch (err) {}
    })();

    (() => {
      const setDegraded = typeof window.__MENYRA_SOCIAL_SET_DEGRADED__ === "function"
        ? window.__MENYRA_SOCIAL_SET_DEGRADED__
        : () => {};
      setDegraded("fonts", { active: false, message: "" });
    })();
  </script>
  <script>
    (() => {
      const isPublicWebsiteStartup = window.__MENYRA_SOCIAL_PUBLIC_WEBSITE_STARTUP__ === true;
      const pwaBuildToken = String(window.__MENYRA_SOCIAL_APP_VERSION__ || "2026-08-08-header-stability-08").trim();
      const loadPwa = () => import(`/apps/menyra-social/pwa.js?v=${encodeURIComponent(pwaBuildToken)}`).catch(() => {});
      const schedulePwaLoad = () => {
        const run = () => {
          const afterDelay = () => {
            if ("requestIdleCallback" in window) {
              window.requestIdleCallback(() => loadPwa(), { timeout: isPublicWebsiteStartup ? 8000 : 5000 });
              return;
            }
            window.setTimeout(loadPwa, isPublicWebsiteStartup ? 6000 : 2200);
          };
          if (isPublicWebsiteStartup) {
            window.setTimeout(afterDelay, 14000);
            return;
          }
          afterDelay();
        };
        if (document.readyState === "complete") {
          run();
          return;
        }
        window.addEventListener("load", run, { once: true });
      };
      schedulePwaLoad();
    })();
  </script>
