  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>
    (() => {
      const LIGHT_UI_COLOR = "#f8fafc";
      const ensureMeta = (name, content) => {
        let meta = document.querySelector(`meta[name="${name}"]`);
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", name);
          document.head.appendChild(meta);
        }
        meta.setAttribute("content", content);
      };
      const forceLightUiChrome = () => {
        const themeMetas = Array.from(document.querySelectorAll('meta[name="theme-color"]'));
        if (themeMetas.length) {
          themeMetas[0].setAttribute("content", LIGHT_UI_COLOR);
          themeMetas[0].removeAttribute("media");
          for (let i = 1; i < themeMetas.length; i += 1) themeMetas[i].remove();
        } else {
          ensureMeta("theme-color", LIGHT_UI_COLOR);
        }
        ensureMeta("apple-mobile-web-app-status-bar-style", "default");
        ensureMeta("color-scheme", "light");
        ensureMeta("supported-color-schemes", "light");
        document.documentElement.style.backgroundColor = LIGHT_UI_COLOR;
        if (document.body) document.body.style.backgroundColor = LIGHT_UI_COLOR;
      };

      if ("scrollRestoration" in window.history) {
        window.history.scrollRestoration = "manual";
      }
      const standalone = window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator.standalone === true;
      if (standalone) {
        const vp = document.querySelector('meta[name="viewport"]');
        if (vp) vp.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");
        document.documentElement.classList.add("is-standalone");
      }
      const forceTop = () => {
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        if (y > 0) window.scrollTo(0, 0);
      };
      window.addEventListener("pageshow", () => {
        forceLightUiChrome();
        window.requestAnimationFrame(forceTop);
      }, { once: true });
      window.matchMedia?.("(prefers-color-scheme: dark)")?.addEventListener?.("change", forceLightUiChrome);
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", forceLightUiChrome, { once: true });
      } else {
        forceLightUiChrome();
      }
    })();
  </script>

  <script>
    (() => {
      const BOOTSTRAP_EVENT = "menyra-social-bootstrap";
      const ENDPOINT = String(
        window.__MENYRA_SOCIAL_BOOTSTRAP_ENDPOINT__
        || "https://us-central1-menyra-c0e68.cloudfunctions.net/socialBootstrapFeed"
      ).trim();
      if (!ENDPOINT) return;
      const fetchBootstrap = async () => {
        const controller = ("AbortController" in window) ? new AbortController() : null;
        const timer = window.setTimeout(() => controller?.abort(), 1200);
        try {
          const response = await fetch(ENDPOINT, {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            cache: "no-store",
            signal: controller?.signal
          });
          if (!response.ok) return;
          const payload = await response.json();
          const data = payload && typeof payload === "object" ? payload.data : null;
          if (!data || typeof data !== "object") return;
          window.__MENYRA_SOCIAL_BOOTSTRAP_PAYLOAD__ = data;
          window.dispatchEvent(new CustomEvent(BOOTSTRAP_EVENT, { detail: data }));
        } catch {}
        finally {
          window.clearTimeout(timer);
        }
      };
      fetchBootstrap().catch(() => {});
    })();
  </script>
