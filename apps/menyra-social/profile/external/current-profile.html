<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MNYRA Social - Ultimate Profile</title>
  <meta name="theme-color" content="#f8fafc" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"]
            },
            colors: {
              brand: "#0f172a",
              accent: "#6366f1"
            },
            boxShadow: {
              "glass": "0 8px 32px 0 rgba(31, 38, 135, 0.15)",
              "capsule": "0 4px 12px rgba(0, 0, 0, 0.08)",
              "glow": "0 0 25px rgba(99, 102, 241, 0.25)",
              "dribbble": "0 30px 60px -12px rgba(50, 50, 93, 0.15), 0 18px 36px -18px rgba(0, 0, 0, 0.15)",
              "button": "0 10px 20px -5px rgba(15, 23, 42, 0.25)",
              "button-hover": "0 15px 25px -5px rgba(15, 23, 42, 0.35)",
              "menu": "0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 1px rgba(0,0,0,0.1)",
              "tab-active": "0 4px 12px -2px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04)"
            },
            borderRadius: {
              "squircle": "2.5rem"
            },
            animation: {
              "breathe": "breathe 4s ease-in-out infinite",
              "pop": "pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards",
              "fade-in": "fadeIn 0.2s ease-out forwards"
            },
            keyframes: {
              breathe: {
                "0%, 100%": { transform: "scale(1)", opacity: "0.5" },
                "50%": { transform: "scale(1.05)", opacity: "0.8" }
              },
              pop: {
                "0%": { transform: "scale(0.9)", opacity: "0" },
                "100%": { transform: "scale(1)", opacity: "1" }
              },
              fadeIn: {
                "0%": { opacity: "0", transform: "translateY(-10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" }
              }
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f8fafc; color: #0f172a; }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .fade-enter { opacity: 0; transform: scale(0.98); }
    .fade-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }

    .text-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #4f46e5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .post-modal-root {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 1;
      pointer-events: none;
      visibility: hidden;
    }

    .post-modal-root.is-open {
      pointer-events: auto;
      visibility: visible;
    }

    .post-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      opacity: 1;
    }

    .post-modal-sheet {
      position: relative;
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
      transform: translateY(24px);
      opacity: 1;
      transition: transform 240ms ease;
      will-change: transform;
    }

    .post-modal-root.is-open .post-modal-sheet {
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .post-modal-root,
      .post-modal-backdrop,
      .post-modal-sheet {
        transition: none;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100">
  <div id="app" class="max-w-md mx-auto min-h-screen relative border-x border-slate-100 bg-slate-50 shadow-2xl overflow-hidden flex flex-col">
    <!-- App Content -->
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    const appEl = document.getElementById("app");

    let state = {
      viewMode: "grid",
      activeTab: "posts",
      isFollowing: false,
      menuOpenId: null,
      modal: { open: false, postId: null },
      profile: {
        name: "MNYRA User",
        handle: "@mnyra_official",
        avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80",
        location: "Prishtina",
        bio: "Designing the future of social.\nVisual Storyteller 📸",
        stats: { posts: 42, followers: 1280, following: 312 },
        verified: true
      },
      posts: [
        { id: 1, url: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=800&q=80", likes: 120, comments: 14, type: "image", isWide: false },
        { id: 2, url: "https://images.unsplash.com/photo-1499028344343-cd173ffc68a9?auto=format&fit=crop&w=800&q=80", likes: 240, comments: 32, type: "image", isWide: false },
        { id: 3, url: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80", likes: 98, comments: 6, type: "video", isWide: false },
        { id: 4, url: "https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=800&q=80", likes: 180, comments: 20, type: "image", isWide: false },
        { id: 5, url: "https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?auto=format&fit=crop&w=800&q=80", likes: 350, comments: 45, type: "video", isWide: false },
        { id: 6, url: "https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=800&q=80", likes: 89, comments: 4, type: "image", isWide: false }
      ],
      checkins: [
        { id: 101, name: "Soma Book Station", city: "Prishtina", image: "https://images.unsplash.com/photo-1521017432531-fbd92d768814?auto=format&fit=crop&w=200&q=80" },
        { id: 102, name: "Rugova Canyon", city: "Peja", image: "https://images.unsplash.com/photo-1470770903676-69b98201ea1c?auto=format&fit=crop&w=200&q=80" }
      ]
    };

    const placeholderImages = [
      "https://images.unsplash.com/photo-1466978913421-dad2ebd01d17?auto=format&fit=crop&w=800&q=80",
      "https://images.unsplash.com/photo-1458642849426-cfb724f15ef7?auto=format&fit=crop&w=800&q=80",
      "https://images.unsplash.com/photo-1481931098730-318b6f776db0?auto=format&fit=crop&w=800&q=80",
      "https://images.unsplash.com/photo-1498654896293-37aacf113fd9?auto=format&fit=crop&w=800&q=80",
      "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80"
    ];

    let placeholderIndex = 0;

    const nextPlaceholder = () => {
      const url = placeholderImages[placeholderIndex % placeholderImages.length];
      placeholderIndex += 1;
      return url;
    };

    window.toggleView = (mode) => {
      state.viewMode = mode;
      renderApp();
    };

    window.switchTab = (tab) => {
      state.activeTab = tab;
      renderApp();
    };

    window.toggleFollow = () => {
      state.isFollowing = !state.isFollowing;
      renderApp();
    };

    window.togglePostMenu = (e, id) => {
      e.stopPropagation();
      const next = state.menuOpenId === id ? null : id;
      state.menuOpenId = next;
      setMenuOpen(next);
    };

    window.deletePost = (e, id) => {
      e.stopPropagation();
      if (confirm("Moechtest du diesen Beitrag wirklich loeschen?")) {
        state.posts = state.posts.filter((p) => p.id !== id);
        state.profile.stats.posts = Math.max(0, state.profile.stats.posts - 1);
        state.menuOpenId = null;
        renderApp();
      }
    };

    window.togglePostWidth = (e, id) => {
      e.stopPropagation();
      const post = state.posts.find((p) => p.id === id);
      if (post) {
        post.isWide = !post.isWide;
        state.menuOpenId = null;
        renderApp();
      }
    };

    window.addNewPost = () => {
      const newPost = {
        id: Date.now(),
        url: nextPlaceholder(),
        likes: 0,
        comments: 0,
        type: "image",
        isNew: true,
        isWide: false
      };

      state.posts.unshift(newPost);
      state.profile.stats.posts += 1;
      renderApp();
    };

    window.openPostModal = (id) => {
      const post = state.posts.find((p) => p.id === id);
      if (!post) return;
      state.modal.open = true;
      state.modal.postId = id;
      state.menuOpenId = null;
      setMenuOpen(null);
      renderModal();
    };

    window.closePostModal = () => {
      state.modal.open = false;
      state.modal.postId = null;
      renderModal();
    };

    window.togglePostLike = () => {
      const post = state.posts.find((p) => p.id === state.modal.postId);
      if (!post) return;
      post.liked = !post.liked;
      const base = Number(post.likes) || 0;
      post.likes = Math.max(0, base + (post.liked ? 1 : -1));
      updatePostCardCounts(post);
      renderModal();
    };

    window.triggerAvatarPicker = () => {
      document.getElementById("avatarInput")?.click();
    };

    window.handleAvatarChange = (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = () => {
        state.profile.avatar = reader.result;
        renderApp();
      };
      reader.readAsDataURL(file);
    };

    document.addEventListener("click", (event) => {
      if (state.modal.open) return;
      const target = event.target;
      if (target instanceof Element) {
        if (target.closest("[data-post-menu]") || target.closest("[data-post-menu-button]")) return;
      }
      if (state.menuOpenId !== null) {
        state.menuOpenId = null;
        setMenuOpen(null);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.modal.open) {
        window.closePostModal();
      }
    });

    const Icon = (name, size = 18, className = "") =>
      `<i data-lucide="${name}" width="${size}" height="${size}" class="${className}"></i>`;

    const setMenuOpen = (postId) => {
      const menus = document.querySelectorAll("[data-post-menu]");
      const next = postId ? String(postId) : "";
      menus.forEach((menu) => {
        const isOpen = next && menu.dataset.postMenu === next;
        menu.classList.toggle("hidden", !isOpen);
      });
    };

    const ensureModalRoot = () => {
      let root = document.getElementById("modalRoot");
      if (!root) {
        root = document.createElement("div");
        root.id = "modalRoot";
        appEl.appendChild(root);
      }
      if (!root.dataset.ready) {
        root.innerHTML = `
          <div id="postModalRoot" class="post-modal-root" aria-hidden="true">
            <div class="post-modal-backdrop"></div>
            <div class="post-modal-sheet">
              <div id="postModalContent"></div>
            </div>
          </div>
        `;
        root.dataset.ready = "true";
      }
      bindModalEvents();
      return root;
    };

    const bindModalEvents = () => {
      const modalRoot = document.getElementById("postModalRoot");
      if (!modalRoot || modalRoot.dataset.bound) return;
      modalRoot.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.closest(".post-modal-sheet")) return;
        if (state.modal.open) closePostModal();
      });
      modalRoot.dataset.bound = "true";
    };

    const updatePostCardCounts = (post) => {
      const likeEl = document.querySelector(`[data-post-like-count="${post.id}"]`);
      if (likeEl) likeEl.textContent = post.likes;
      const commentEl = document.querySelector(`[data-post-comment-count="${post.id}"]`);
      if (commentEl) commentEl.textContent = post.comments;
    };

    const ProfileSection = () => `
      <div class="px-5 pb-2 pt-10">
        <input type="file" id="avatarInput" class="hidden" accept="image/*" onchange="handleAvatarChange(event)" />
        <div class="bg-white rounded-[2.5rem] p-8 shadow-dribbble relative overflow-hidden z-10">
          <div class="absolute top-[-60px] right-[-60px] w-64 h-64 bg-gradient-to-bl from-indigo-100 via-purple-100 to-transparent rounded-full blur-3xl opacity-60 pointer-events-none mix-blend-multiply"></div>
          <div class="absolute top-[-20px] right-[-20px] w-32 h-32 bg-white/40 rounded-full blur-xl pointer-events-none"></div>

          <div class="relative z-10">
            <div class="flex justify-between items-start mb-8">
              <div class="relative cursor-pointer tap-highlight-transparent group" onclick="triggerAvatarPicker()">
                <div class="absolute -inset-2 bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 rounded-[2.5rem] blur-md group-hover:blur-lg transition-all duration-500"></div>

                <div class="relative w-[100px] h-[100px] rounded-[2rem] p-[3px] bg-gradient-to-br from-white to-slate-50 shadow-sm">
                  <img src="${state.profile.avatar}" class="w-full h-full rounded-[1.8rem] object-cover" alt="Avatar" />
                </div>

                ${state.profile.verified ? `
                  <div class="absolute -bottom-1 -right-1 bg-white rounded-full p-1.5 shadow-lg text-blue-500 border-2 border-slate-50">
                    ${Icon("badge-check", 16, "fill-blue-500 text-white")}
                  </div>
                ` : ""}
              </div>

              <div class="flex items-center gap-6 pt-3 pr-2">
                 <div class="flex flex-col items-center">
                    <span class="font-black text-2xl text-slate-900 leading-none mb-1">${state.profile.stats.followers}</span>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest opacity-80">Fans</span>
                 </div>

                 <div class="w-px h-8 bg-slate-100"></div>

                 <div class="flex flex-col items-center">
                    <span class="font-black text-2xl text-slate-900 leading-none mb-1">${state.profile.stats.following}</span>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest opacity-80">Folgt</span>
                 </div>
              </div>
            </div>

            <div class="mb-8">
              <h1 class="font-black text-[28px] text-gradient tracking-tight leading-none mb-3">${state.profile.name}</h1>
              <p class="text-[15px] text-slate-500 font-medium leading-relaxed max-w-[300px]">${state.profile.bio}</p>
            </div>

            <div class="flex gap-4">
              <button onclick="toggleFollow()" class="flex-1 h-[56px] rounded-[1.2rem] font-bold text-xs uppercase tracking-widest shadow-button active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 relative overflow-hidden group ${state.isFollowing ? "bg-slate-100 text-slate-600 shadow-none border border-slate-200" : "bg-gradient-to-r from-slate-900 to-slate-800 text-white border border-transparent"}">
                <span class="relative z-10 flex items-center gap-2">
                  ${state.isFollowing ? Icon("check", 16) : ""}
                  ${state.isFollowing ? "Gefolgt" : "Folgen"}
                </span>
                ${!state.isFollowing ? `<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>` : ""}
              </button>

              <button class="w-[56px] h-[56px] flex items-center justify-center rounded-[1.2rem] border border-slate-200 bg-white text-slate-900 active:scale-[0.95] transition-all duration-300 shadow-sm hover:shadow-md hover:border-slate-300 group">
                ${Icon("message-circle", 24, "group-hover:scale-110 transition-transform duration-300")}
              </button>
            </div>
          </div>
        </div>
      </div>
    `;

    const Tabs = () => `
      <div class="px-6 mb-6 mt-4">
        <div class="bg-white/60 p-1.5 rounded-[2rem] border border-white/50 shadow-sm flex items-center relative backdrop-blur-sm">
          <button onclick="switchTab('posts')" class="flex-1 py-3.5 rounded-[1.5rem] text-[11px] font-bold uppercase tracking-wider transition-all duration-300 flex items-center justify-center gap-2 ${state.activeTab === "posts" ? "bg-white text-slate-900 shadow-tab-active scale-[1.02]" : "text-slate-400 hover:text-slate-600"}">
            Beitraege
          </button>

          <button onclick="switchTab('media')" class="flex-1 py-3.5 rounded-[1.5rem] text-[11px] font-bold uppercase tracking-wider transition-all duration-300 flex items-center justify-center gap-2 ${state.activeTab === "media" ? "bg-white text-slate-900 shadow-tab-active scale-[1.02]" : "text-slate-400 hover:text-slate-600"}">
            Medien
          </button>

          <button onclick="switchTab('checkins')" class="flex-1 py-3.5 rounded-[1.5rem] text-[11px] font-bold uppercase tracking-wider transition-all duration-300 flex items-center justify-center gap-2 ${state.activeTab === "checkins" ? "bg-white text-slate-900 shadow-tab-active scale-[1.02]" : "text-slate-400 hover:text-slate-600"}">
            Check-ins
          </button>
        </div>
      </div>
    `;

    const ViewControls = () => {
      if (state.activeTab === "checkins") return "";

      return `
      <div class="flex items-center justify-between px-8 mb-6">
         <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-2">Ansicht</span>
         <div class="flex gap-1 bg-white p-1 rounded-2xl border border-slate-100 shadow-sm">
            <button onclick="toggleView('grid')" class="p-2.5 rounded-xl transition-all active:scale-95 ${state.viewMode === "grid" ? "bg-slate-900 text-white shadow-md" : "text-slate-300 active:text-slate-500"}">
              ${Icon("layout-grid", 18)}
            </button>
            <button onclick="toggleView('feed')" class="p-2.5 rounded-xl transition-all active:scale-95 ${state.viewMode === "feed" ? "bg-slate-900 text-white shadow-md" : "text-slate-300 active:text-slate-500"}">
              ${Icon("square", 18)}
            </button>
         </div>
      </div>
      `;
    };

    const ContentArea = () => {
      if (state.activeTab === "checkins") {
        return `
          <div class="px-6 flex flex-col gap-4 pb-12 animate-pop">
            ${state.checkins.map((place) => `
              <div class="flex items-center gap-4 bg-white p-4 rounded-[2rem] border border-slate-50 shadow-dribbble active:scale-[0.98] transition-all cursor-pointer group">
                <div class="w-16 h-16 rounded-2xl bg-slate-100 overflow-hidden shrink-0 shadow-inner group-hover:shadow-md transition-all">
                  <img src="${place.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                </div>
                <div class="flex-1">
                  <h4 class="font-black text-slate-900 text-sm mb-1">${place.name}</h4>
                  <div class="flex items-center gap-1.5 text-xs text-slate-500 font-bold">
                    ${Icon("map-pin", 12, "text-indigo-500 fill-indigo-500/20")} ${place.city}
                  </div>
                </div>
                <button class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-300 group-hover:text-indigo-500 group-hover:bg-indigo-50 transition-colors">
                  ${Icon("arrow-right", 18)}
                </button>
              </div>
            `).join("")}
             <div class="text-center mt-8">
                <button class="text-xs font-black text-indigo-500 uppercase tracking-widest py-4 px-8 rounded-2xl bg-indigo-50/50 active:bg-indigo-100 transition-colors border border-indigo-100/50 shadow-sm">
                  + Neuer Check-in
                </button>
             </div>
          </div>
        `;
      }

      let displayPosts = state.posts;
      if (state.activeTab === "media") {
        displayPosts = state.posts.filter((p) => p.type === "video");
      }

      const isGrid = state.viewMode === "grid";

      return `
        <div class="flex flex-col pb-24">
          <div class="${isGrid ? "grid grid-cols-2 gap-4 px-6" : "flex flex-col gap-8 px-6"}">
            ${displayPosts.length === 0 ? `
              <div class="col-span-2 py-24 text-center">
                 <div class="w-24 h-24 rounded-[2.5rem] bg-gradient-to-tr from-slate-100 to-white mx-auto flex items-center justify-center text-slate-300 mb-6 shadow-sm rotate-6 border border-slate-50">
                   ${Icon(state.activeTab === "media" ? "film" : "image", 36)}
                 </div>
                 <p class="text-slate-400 text-sm font-bold tracking-wide">Keine Inhalte gefunden</p>
              </div>
            ` : displayPosts.map((post) => {

              const animClass = post.isNew ? "animate-pop" : "";
              const colClass = (isGrid && post.isWide) ? "col-span-2" : "";
              const aspectClass = (isGrid && post.isWide) ? "aspect-[1.8/1]" : "aspect-[4/5]";

              const statsCapsule = `
                <div class="w-full flex items-end justify-center">
                   <div class="flex items-center gap-2.5 bg-white/10 backdrop-blur-md border border-white/20 rounded-full px-3 py-1.5 text-white shadow-capsule">
                      <div class="flex items-center gap-1">
                        ${Icon("heart", 12, "fill-rose-500 text-rose-500")}
                        <span data-post-like-count="${post.id}" class="text-[10px] font-bold tracking-wide">${post.likes}</span>
                      </div>
                      <div class="w-px h-3 bg-white/20"></div>
                      <div class="flex items-center gap-1">
                        ${Icon("message-circle", 12, "text-indigo-200")}
                        <span data-post-comment-count="${post.id}" class="text-[10px] font-bold tracking-wide">${post.comments}</span>
                      </div>
                   </div>
                </div>
              `;

              return `
                <div onclick="openPostModal(${post.id})" class="${colClass} ${animClass} relative ${isGrid ? aspectClass : "aspect-[4/5]"} rounded-[2rem] overflow-visible bg-white shadow-dribbble cursor-pointer transition-transform">
                  <div class="absolute inset-0 rounded-[2rem] overflow-hidden active:scale-[0.98] transition-transform">
                    <img src="${post.url}" loading="eager" class="w-full h-full object-cover" />

                    ${post.type === "video" ? `<div class="absolute top-3 left-3 text-white drop-shadow-md bg-black/20 backdrop-blur-sm rounded-full p-1">${Icon("play", 12, "fill-white")}</div>` : ""}

                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex flex-col justify-end p-3 pb-4 pointer-events-none">
                       ${statsCapsule}
                    </div>
                  </div>

                  <button data-post-menu-button="${post.id}" onclick="togglePostMenu(event, ${post.id})" class="absolute top-3 right-3 p-2 bg-black/20 backdrop-blur-md rounded-full text-white/90 z-20 active:bg-black/40 hover:bg-black/30 transition-colors">
                    ${Icon("more-horizontal", 14)}
                  </button>

                  <div data-post-menu="${post.id}" onclick="event.stopPropagation()" class="absolute top-12 right-3 w-40 bg-white/95 backdrop-blur-xl rounded-2xl shadow-menu border border-slate-100 p-1.5 z-30 animate-fade-in origin-top-right flex flex-col gap-1 hidden">
                      <button onclick="togglePostWidth(event, ${post.id})" class="flex items-center gap-3 px-3 py-2.5 text-xs font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl transition-colors text-left w-full">
                          ${Icon(post.isWide ? "minimize-2" : "maximize-2", 14)}
                          ${post.isWide ? "Schmaler" : "Breiter"}
                      </button>
                      <div class="h-px bg-slate-100 w-full my-0.5"></div>
                      <button onclick="deletePost(event, ${post.id})" class="flex items-center gap-3 px-3 py-2.5 text-xs font-bold text-red-500 hover:bg-red-50 rounded-xl transition-colors text-left w-full">
                          ${Icon("trash-2", 14)}
                          Loeschen
                      </button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          ${state.activeTab === "posts" ? `
            <div class="px-6 mt-8 mb-4">
              <button onclick="addNewPost()" class="w-full py-5 rounded-[2rem] bg-slate-900 text-white font-black text-xs uppercase tracking-[0.2em] shadow-button active:scale-95 transition-all flex items-center justify-center gap-3 group relative overflow-hidden">
                <span class="relative z-10 flex items-center gap-2">
                  ${Icon("plus", 18)} Neuen Beitrag
                </span>
                <div class="absolute inset-0 bg-indigo-600 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
              </button>
            </div>
          ` : ""}

        </div>
      `;
    };

    const PostModal = () => {
      if (!state.modal.open) return "";
      const post = state.posts.find((p) => p.id === state.modal.postId);
      if (!post) return "";
      const isLiked = !!post.liked;

      return `
        <div class="bg-white rounded-t-[2.5rem] shadow-2xl border border-slate-100 p-7">
          <div class="flex items-center justify-between mb-4">
            <div>
              <span class="text-[9px] font-black text-indigo-600 uppercase tracking-widest">Post</span>
              <h3 class="text-xl font-black italic tracking-tighter">Status</h3>
              <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mt-1">${post.type === "video" ? "Video" : "Foto"}</p>
            </div>
            <button onclick="closePostModal()" class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-500">${Icon("x", 16)}</button>
          </div>

          <div class="rounded-[2.5rem] overflow-hidden shadow-lg border border-slate-100">
            <img src="${post.url}" class="w-full h-[22rem] object-cover" />
          </div>

          <div class="mt-4 flex items-center justify-between">
            <button onclick="togglePostLike()" class="flex items-center gap-2 text-sm font-black ${isLiked ? "text-rose-500" : "text-slate-700"}">
              ${Icon("heart", 18)} ${isLiked ? "Gefaellt" : "Like"}
            </button>
            <div class="flex items-center gap-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">
              <span>${post.likes} Likes</span>
              <span>${post.comments} Kommentare</span>
            </div>
          </div>
        </div>
      `;
    };

    const renderApp = () => {
      appEl.innerHTML = `
        <main class="flex-1 overflow-y-auto no-scrollbar">
          ${ProfileSection()}
          ${Tabs()}
          ${ViewControls()}
          ${ContentArea()}
        </main>
        <div id="modalRoot"></div>
      `;

      renderModal();
      setMenuOpen(state.menuOpenId);
      if (window.lucide) window.lucide.createIcons();
    };

    const renderModal = () => {
      ensureModalRoot();
      const modalRoot = document.getElementById("postModalRoot");
      const modalContent = document.getElementById("postModalContent");
      if (!modalRoot || !modalContent) return;
      if (state.modal.open) {
        const nextHtml = PostModal();
        if (modalContent.innerHTML !== nextHtml) {
          modalContent.innerHTML = nextHtml;
        }
        modalRoot.setAttribute("aria-hidden", "false");
        if (!modalRoot.classList.contains("is-open")) {
          requestAnimationFrame(() => {
            modalRoot.classList.add("is-open");
          });
        }
      } else {
        modalRoot.classList.remove("is-open");
        modalRoot.setAttribute("aria-hidden", "true");
      }
      if (window.lucide) window.lucide.createIcons();
      document.body.style.overflow = state.modal.open ? "hidden" : "";
    };

    renderApp();
  </script>
</body>
</html>
