<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MENYRA Social - Current Profile</title>
  <meta name="theme-color" content="#f8fafc" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f8fafc; color: #0f172a; }
    #app { min-height: 100vh; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-in-bottom { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fade-in 0.4s ease-out forwards; }
    .slide-in-from-bottom-10 { animation: slide-in-bottom 0.6s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="app"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    const appEl = document.getElementById("app");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch] || ch));
    }

    function formatCount(value) {
      if (typeof value === "number" && Number.isFinite(value)) return String(value);
      const num = Number(value);
      if (Number.isFinite(num)) return String(num);
      const str = String(value ?? "").trim();
      return str || "0";
    }

    function icon(name, className = "") {
      return `<i data-lucide="${name}" class="${className}"></i>`;
    }

    function renderProfilePosts(posts, showAddTile) {
      const items = posts.length
        ? posts.map((item, index) => renderProfileGridItem(item, index)).join("")
        : `
          <div class="aspect-square rounded-[2rem] border-2 border-dashed flex flex-col items-center justify-center gap-2 text-slate-300 border-slate-200">
            ${icon("image", "w-6 h-6")}<span class="text-[9px] font-black uppercase text-slate-400">Leer</span>
          </div>
        `;
      const addTile = showAddTile ? `
        <button type="button" data-add-post="true" class="aspect-square rounded-[2rem] border-2 border-dashed flex flex-col items-center justify-center gap-2 cursor-pointer transition-all hover:bg-indigo-50/10 hover:border-indigo-500/50 group border-slate-200">
          ${icon("plus-square", "w-6 h-6 text-slate-300 group-hover:text-indigo-500")}
          <span class="text-[9px] font-black uppercase text-slate-400 group-hover:text-indigo-600">Neu</span>
        </button>
      ` : "";
      return items + addTile;
    }

    function resolvePostCounts(item) {
      const likeCount = Number(item.likes) || 0;
      const commentCount = Number(item.comments) || 0;
      return {
        likeLabel: likeCount,
        commentLabel: commentCount
      };
    }

    function renderProfileGridItem(item, index) {
      const counts = resolvePostCounts(item);
      const classes = item.type === "wide" || item.type === "hero"
        ? "col-span-2 aspect-[2/1]"
        : "aspect-square";
      return `
        <button type="button" data-post-index="${index}" class="rounded-[2.5rem] overflow-hidden shadow-md relative group text-left ${classes}">
          <img src="${escapeHtml(item.url)}" class="w-full h-full object-cover" />
          ${item.title ? `<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent p-6 flex flex-col justify-end"><h3 class="text-white text-lg font-black italic">${escapeHtml(item.title)}</h3></div>` : ""}
          <div class="absolute inset-x-0 bottom-0 p-3">
            <div class="flex items-center justify-between text-white bg-black/45 backdrop-blur rounded-2xl px-3 py-2">
              <div class="flex items-center gap-3 text-[10px] font-black">
                <div class="flex items-center gap-1">${icon("heart", "w-3 h-3")}${escapeHtml(counts.likeLabel)}</div>
                <div class="flex items-center gap-1">${icon("message-circle", "w-3 h-3")}${escapeHtml(counts.commentLabel)}</div>
              </div>
              ${item.isVideo ? `<div class="w-9 h-9 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center">${icon("play", "w-4 h-4")}</div>` : ""}
            </div>
          </div>
        </button>
      `;
    }

    function renderPostModal(post) {
      if (!state.modal.open || !post) return "";
      const isLiked = !!post.liked;
      const counts = resolvePostCounts(post);
      return `
        <div class="fixed inset-0 z-[70]">
          <div id="postModalOverlay" class="absolute inset-0 bg-black/60"></div>
          <div class="absolute inset-x-0 bottom-0 max-w-md mx-auto">
            <div class="bg-white rounded-t-[3rem] shadow-2xl border border-slate-100 p-7 animate-in slide-in-from-bottom-10">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <span class="text-[9px] font-black text-indigo-600 uppercase tracking-widest">Post</span>
                  <h3 class="text-xl font-black italic tracking-tighter">Status</h3>
                  <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mt-1">Foto</p>
                </div>
                <button id="postModalClose" class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-500">${icon("x", "w-4 h-4")}</button>
              </div>

              <div class="rounded-[2.5rem] overflow-hidden shadow-lg border border-slate-100">
                <img src="${escapeHtml(post.url)}" class="w-full h-[22rem] object-cover" />
              </div>

              <div class="mt-4 flex items-center justify-between">
                <button id="postLikeBtn" class="flex items-center gap-2 text-sm font-black ${isLiked ? "text-rose-500" : "text-slate-700"}">
                  ${icon("heart", "w-5 h-5")} ${isLiked ? "Gefaellt" : "Like"}
                </button>
                <div class="flex items-center gap-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                  <span>${escapeHtml(counts.likeLabel)} Likes</span>
                  <span>${escapeHtml(counts.commentLabel)} Kommentare</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderProfile(profile, posts) {
      const roleLabel = profile.role === "business" ? "Business Account" : "Explorer";
      appEl.innerHTML = `
        <div class="min-h-screen bg-slate-50 text-slate-900 max-w-md mx-auto shadow-2xl relative flex flex-col overflow-hidden font-sans transition-colors duration-500">
          <header class="p-6 pb-2 flex justify-between items-center sticky top-0 z-40 backdrop-blur-xl bg-slate-50/80">
            <div class="text-center w-full">
              <h1 class="text-2xl font-black italic tracking-tighter leading-none text-slate-900">MENYRA</h1>
              <span class="text-[9px] font-black text-indigo-600 uppercase tracking-[0.4em] block">Social</span>
            </div>
          </header>
          <main class="flex-1 overflow-y-auto no-scrollbar pb-24">
            <div class="p-8 animate-in slide-in-from-bottom-10 duration-700 pb-24">
              <input type="file" id="profileAvatarInput" class="hidden" accept="image/*" />
              <div class="flex flex-col items-center text-center mb-10">
                <div id="profileAvatarTrigger" class="relative mb-6 group cursor-pointer">
                  <div class="w-32 h-32 rounded-[3.5rem] bg-gradient-to-tr from-indigo-600 to-purple-500 p-1 shadow-2xl shadow-indigo-500/20">
                    <img src="${escapeHtml(profile.avatar || "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==")}" class="w-full h-full rounded-[3.2rem] object-cover border-4 border-white" />
                  </div>
                  <div class="absolute -bottom-2 -right-2 w-10 h-10 rounded-2xl shadow-xl flex items-center justify-center text-indigo-600 bg-white">${icon("camera", "w-4 h-4")}</div>
                </div>
                <h2 class="text-3xl font-black tracking-tighter text-slate-900">${escapeHtml(profile.name || "User")}</h2>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-1">${roleLabel} / ${escapeHtml(profile.location || "-")}</p>
                <div class="flex gap-3 mt-6 w-full max-w-xs justify-center">
                  <div class="flex flex-col items-center"><span class="text-lg font-black text-slate-900">${escapeHtml(formatCount(posts.length))}</span><span class="text-[9px] font-bold text-slate-400 uppercase">Posts</span></div>
                  <div class="w-px h-8 bg-slate-200 mx-1"></div>
                  <div class="flex flex-col items-center"><span class="text-lg font-black text-slate-900">${escapeHtml(formatCount(profile.followers))}</span><span class="text-[9px] font-bold text-slate-400 uppercase">Follower</span></div>
                  <div class="w-px h-8 bg-slate-200 mx-1"></div>
                  <div class="flex flex-col items-center"><span class="text-lg font-black text-slate-900">${escapeHtml(formatCount(profile.following))}</span><span class="text-[9px] font-bold text-slate-400 uppercase">Following</span></div>
                </div>
                <div class="flex gap-3 mt-8 w-full">
                  <button id="statusBtn" class="flex-1 py-3 rounded-2xl bg-slate-900 text-white text-xs font-black uppercase tracking-widest shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">${icon("plus-square", "w-4 h-4")} Status</button>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                ${renderProfilePosts(posts, true)}
              </div>
            </div>
          </main>
        </div>
        ${renderPostModal(state.posts[state.modal.index])}
      `;

      if (window.lucide?.createIcons) {
        window.lucide.createIcons();
      }

      document.body.style.overflow = state.modal.open ? "hidden" : "";
    }

    const state = {
      profile: {
        name: "Menyra User",
        avatar: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==",
        location: "Prishtina",
        followers: 1280,
        following: 312,
        role: "user"
      },
      posts: [
        { url: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==", likes: 120, comments: 14, type: "square" },
        { url: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==", likes: 240, comments: 32, type: "square" },
        { url: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==", likes: 98, comments: 6, type: "square" },
        { url: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==", likes: 180, comments: 20, type: "wide" }
      ],
      modal: {
        open: false,
        index: null
      }
    };

    const placeholderImages = [
      "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==",
      "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==",
      "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==",
      "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==",
      "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
    ];

    let placeholderIndex = 0;

    function nextPlaceholder() {
      const url = placeholderImages[placeholderIndex % placeholderImages.length];
      placeholderIndex += 1;
      return url;
    }

    function addDemoPost() {
      const post = {
        url: nextPlaceholder(),
        likes: Math.floor(60 + Math.random() * 320),
        comments: Math.floor(4 + Math.random() * 40),
        type: Math.random() > 0.75 ? "wide" : "square"
      };
      state.posts.unshift(post);
      render();
    }

    function openPostModal(index) {
      if (!Number.isFinite(index)) return;
      state.modal.open = true;
      state.modal.index = index;
      render();
    }

    function closePostModal() {
      state.modal.open = false;
      state.modal.index = null;
      render();
    }

    function togglePostLike() {
      const post = state.posts[state.modal.index];
      if (!post) return;
      post.liked = !post.liked;
      const base = Number(post.likes) || 0;
      post.likes = Math.max(0, base + (post.liked ? 1 : -1));
      render();
    }

    function bindProfileEvents() {
      const avatarTrigger = document.getElementById("profileAvatarTrigger");
      const avatarInput = document.getElementById("profileAvatarInput");
      if (avatarTrigger && avatarInput) {
        avatarTrigger.addEventListener("click", () => avatarInput.click());
        avatarInput.addEventListener("change", (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onloadend = () => {
            state.profile.avatar = reader.result;
            render();
          };
          reader.readAsDataURL(file);
        });
      }

      const statusBtn = document.getElementById("statusBtn");
      if (statusBtn) statusBtn.addEventListener("click", addDemoPost);

      const addTile = document.querySelector("[data-add-post]");
      if (addTile) addTile.addEventListener("click", addDemoPost);

      document.querySelectorAll("[data-post-index]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.postIndex);
          if (Number.isFinite(idx)) openPostModal(idx);
        });
      });

      const overlay = document.getElementById("postModalOverlay");
      const closeBtn = document.getElementById("postModalClose");
      if (overlay) overlay.addEventListener("click", closePostModal);
      if (closeBtn) closeBtn.addEventListener("click", closePostModal);

      const likeBtn = document.getElementById("postLikeBtn");
      if (likeBtn) likeBtn.addEventListener("click", togglePostLike);
    }

    function render() {
      renderProfile(state.profile, state.posts);
      bindProfileEvents();
    }

    render();
  </script>
</body>
</html>
