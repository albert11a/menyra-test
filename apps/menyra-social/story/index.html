<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <title>MNYRA - Story</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <!-- Medien-CDN vorab verbinden: Story-/Video-Streams starten schneller (3G/Cold-Start). -->
  <link rel="preconnect" href="https://menyra-media.alberthoti-vsa.workers.dev" crossorigin />
  <link rel="modulepreload" href="./story.js?v=2026-07-07-story-poster-fix-3" />

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --txt: #ffffff;
      --muted: rgba(255,255,255,0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; }
    body {
      color: var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      overflow: hidden;
      background: #000;
    }

    .reels {
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
      scroll-padding-top: var(--safe-top);
      scroll-padding-bottom: var(--safe-bottom);
      touch-action: pan-y;
    }
    .reels::-webkit-scrollbar { display: none; }
    .reels { scrollbar-width: none; }

    .reel {
      position: relative;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      overflow: hidden;
      isolation: isolate;
      cursor: pointer;
    }

    .reel iframe,
    .reel video,
    .reel img.reel-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      transform: translateZ(0);
      border: none;
      pointer-events: none;
    }

    .reel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: auto;
      z-index: 10;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(120% 70% at 50% 10%, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.8) 100%),
        linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.00) 45%);
      opacity: .9;
      z-index: 5;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding-top: calc(var(--safe-top) + 10px);
      padding-left: calc(var(--safe-left) + 12px);
      padding-right: calc(var(--safe-right) + 12px);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .topbarLeft {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .topbarRight {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .btnIcon {
      border: 0;
      background: rgba(0,0,0,0.45);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(6px);
      font-size: 18px;
      font-weight: 800;
    }
    .btnIcon:active { transform: scale(0.98); }
    .btnIcon[data-story-sound-state="on"] {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .brandPill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 16px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: auto;
      min-width: 0;
    }

    .brandLogo {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      flex: 0 0 auto;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .brandName {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 56vw;
    }

    .rail {
      position: absolute;
      right: calc(var(--safe-right) + 12px);
      bottom: calc(var(--safe-bottom) + 110px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    .railBtn {
      border: 0;
      background: transparent;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .railIcon {
      width: 60px;
      height: 46px;
      border-radius: 18px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.10);
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
      font-weight: 700;
      font-size: 13px;
    }

    .content {
      position: absolute;
      left: calc(var(--safe-left) + 12px);
      right: calc(var(--safe-right) + 78px);
      bottom: calc(var(--safe-bottom) + 28px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .contentTitle {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }

    .contentDesc {
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      max-width: 92%;
      white-space: pre-wrap;
    }

    .contentBtn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.20);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      transition: all 0.2s ease;
      width: fit-content;
    }
    .contentBtn:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-1px);
    }
    .contentBtn:active { transform: translateY(0) scale(0.98); }

    /* Markiertes Produkt: breite Card mit Foto, Name, Preis und Mehr-Button. */
    .productCard {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.16);
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .productCard:hover { background: rgba(0,0,0,0.65); }
    .productCard:active { transform: scale(0.98); }

    .productCardThumb {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 22px;
      overflow: hidden;
    }
    .productCardThumbImg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .productCardInfo { flex: 1; min-width: 0; }
    .productCardName {
      font-weight: 800;
      font-size: 14px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }
    .productCardPrice {
      margin-top: 2px;
      font-weight: 700;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }

    .productCardBtn {
      flex: 0 0 auto;
      padding: 9px 16px;
      border-radius: 14px;
      background: #fff;
      color: #0f172a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .emptyIcon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      font-size: 28px;
    }

    .emptyTitle {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .emptyDesc {
      font-size: 14px;
      opacity: 0.7;
      line-height: 1.4;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: #000;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="reels" id="reelsContainer"></div>

  <div class="loading" id="loadingState">
    <div class="spinner"></div>
  </div>

  <div class="empty" id="emptyState" style="display:none;">
    <div class="emptyIcon">📹</div>
    <div class="emptyTitle">Nuk ka stories</div>
    <div class="emptyDesc">Stories aktive shfaqen ketu.</div>
  </div>

  <script type="module" src="./story.js?v=2026-07-07-story-poster-fix-3"></script>
</body>
</html>
