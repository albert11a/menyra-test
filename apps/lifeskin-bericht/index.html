<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F5" />
  <title>Lifeskin</title>

  <!-- Diese Seite gehoert einem Patienten und traegt seinen Vornamen, seine
       Fallnummer und seine Diagnose. Sie ist absichtlich teilbar - er soll
       sie speichern und weiterschicken koennen -, aber sie hat in keinem
       Suchindex etwas verloren. robots.txt sperrt /analiza/ fuer Crawler;
       diese Zeile sperrt zusaetzlich das Indexieren einer Adresse, die
       jemand irgendwo oeffentlich verlinkt hat. Beides, nicht eins davon. -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Die Vorschau beim Teilen.
       Diese Seite ist absichtlich teilbar - sie hat sogar einen Knopf zum
       Kopieren des Links. Bis hierher kam sie beim Teilen als nackte
       graue Adresse an, und ein Link ohne Vorschau sieht in WhatsApp aus
       wie etwas, das man nicht antippt.

       SIE IST FUER JEDEN FALL DIESELBE, und das ist keine Bequemlichkeit,
       sondern die eigentliche Anforderung: Eine Vorschau erscheint in
       Gruppen, in denen niemand sie angefordert hat, und die Dienste
       speichern sie. Stuenden hier Vorname und Diagnose - beides steht
       auf der Seite dahinter -, laege die Diagnose einer Patientin in
       jeder Gruppenvorschau und in fremden Zwischenspeichern. Wer den
       Link weitergibt, entscheidet ueber die Seite; ueber die Vorschau
       entscheidet er nicht mit.

       Deshalb auch fest im Aufbau und nicht von einer Funktion gesetzt:
       Was nicht eingesetzt wird, kann nicht versehentlich das Falsche
       einsetzen.

       Das noindex darueber bleibt. Es widerspricht dem hier nicht: Die
       Marke sperrt Suchmaschinen, die Vorschau ist fuer den Boten.

       KEIN og:url und kein canonical, und das ist Absicht: Jede Analyse
       hat ihre eigene Adresse. Eine feste hier wuerde jede geteilte
       Analyse auf dieselbe Seite zeigen lassen - und wer den Link
       antippt, landete im Zweifel im Fall eines anderen. Ohne die Marke
       nimmt der Bote die Adresse, die wirklich geteilt wurde. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lifeskin" />
  <meta property="og:locale" content="sq_AL" />
  <meta property="og:title" content="Analiza dermatologjike" />
  <meta property="og:description" content="Vlerësim i lëkurës nga Dr. Violeta Gashi, dermatologe." />
  <meta property="og:image" content="https://www.mnyra.com/apps/lifeskin/share-analiza.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Lifeskin — Dr. Violeta Gashi, Dermatologe" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Analiza dermatologjike" />
  <meta name="twitter:description" content="Vlerësim i lëkurës nga Dr. Violeta Gashi, dermatologe." />
  <meta name="twitter:image" content="https://www.mnyra.com/apps/lifeskin/share-analiza.jpg" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Verbindung zu Firestore aufbauen, solange noch geladen wird. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="//firestore.googleapis.com" />

  <link rel="stylesheet" href="/apps/lifeskin/lifeskin-styles.css" />
  <link rel="stylesheet" href="/apps/lifeskin-bericht/bericht.css" />
  <link rel="modulepreload" href="/apps/lifeskin-bericht/bericht.js" />
  <link rel="modulepreload" href="/apps/lifeskin-bericht/bericht-texte.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-config.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-session.js" />
  <link rel="modulepreload" href="/apps/lifeskin/lifeskin-pixel.js" />
</head>
<body>

<main class="lb" id="lb">

  <!-- Solange geladen wird. Kein leerer Bildschirm: Wer hier ankommt, kommt
       oft aus einem langsamen Netz und hat gerade eine Minute investiert. -->
  <section class="lb-schirm lb-schirm--mitte" id="lb-laedt" data-aktiv="ja">
    <div class="lb-puls" aria-hidden="true"></div>
    <p class="ls-leise" id="lb-laedttext"></p>
  </section>

  <!-- Der Fall wurde nicht gefunden. -->
  <section class="lb-schirm lb-schirm--mitte" id="lb-weg" data-aktiv="nein">
    <h1 id="lb-wegtitel"></h1>
    <p class="ls-leise" id="lb-wegtext"></p>
  </section>

  <!-- Der Wartezustand. Das ist der Bildschirm, den fast jeder sieht.
       Er passt auf ein Telefon, ohne dass jemand scrollen muss: oben die
       Wartezeit, in der Mitte die Aussage, darunter die Akte, unten die eine
       Handlung. Gescrollt wird erst, wenn der Befund da ist. -->
  <section class="lb-schirm" id="lb-wartet" data-aktiv="nein">

    <div class="lb-kopf">
      <span class="ls-marke">Lifeskin</span>
      <!-- Die Wartezeit steht ganz oben und nicht im Text.
           Sie ist die erste Frage, die jeder hat: wann. -->
      <span class="lb-wann" id="lb-dauer"><i aria-hidden="true"></i><b></b></span>
    </div>

    <!-- Die Buehne. Sie schrumpft als Einzige, wenn das Telefon klein ist -
         Akte und Knopf bleiben unangetastet. -->
    <div class="lb-buehne">
      <div class="lb-ring" aria-hidden="true">
        <span class="lb-ring__bahn"></span>
        <span class="lb-ring__bahn"></span>
        <span class="lb-ring__bahn"></span>
        <span class="lb-ring__kern">
          <!-- Ein Gesicht unter der Lupe: genau das, was der Satz daneben
               sagt. Kein Zahnrad, keine Wellenlinie - hier arbeitet keine
               Maschine, hier sieht ein Mensch hin. -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M24 6c7.2 0 12 4.8 12 12v5c0 8-5.4 14-12 14s-12-6-12-14v-5C12 10.8 16.8 6 24 6z"/>
            <path d="M18.5 20.5h3M26.5 20.5h3"/>
            <path d="M24 22v4.5h-2"/>
            <path d="M20.5 30c1.2 1 2.2 1.4 3.5 1.4s2.3-.4 3.5-1.4"/>
            <circle cx="33" cy="33" r="7.5" stroke-width="2"/>
            <path d="M38.6 38.6L44 44" stroke-width="2.4"/>
          </svg>
        </span>
      </div>

      <h1 id="lb-titel"></h1>
      <!-- Der Satz, der die Wartezeit vom Mangel in den Beweis verwandelt. -->
      <p class="lb-warum" id="lb-warum"></p>
    </div>

    <!-- Die Akte. Nummer gross, alles andere klein, der Fortschritt als vier
         Punkte statt als vier Zeilen. -->
    <div class="lb-akte">
      <div class="lb-akte__zeile">
        <span class="lb-akte__marke" id="lb-aktemarke"></span>
        <strong class="lb-akte__nummer" id="lb-nummer"></strong>
      </div>
      <div class="lb-akte__zeile lb-akte__zeile--leise">
        <span id="lb-zeit"></span>
        <span id="lb-fotos"></span>
      </div>
      <ol class="lb-punkte" id="lb-schritte"></ol>
      <p class="lb-punkte__jetzt" id="lb-jetzt"></p>
    </div>

    <div class="lb-fuss">
      <p class="lb-frage" id="lb-benachrichtigen"></p>
      <a class="ls-knopf ls-knopf--wa" id="lb-walink" href="#" rel="noopener"></a>
      <p class="ls-unterknopf" id="lb-waunter"></p>

      <div class="ls-warueck ls-verstecken" id="lb-warueck">
        <p id="lb-warueckfrage"></p>
        <div class="ls-warueck__knoepfe">
          <button type="button" class="ls-knopf ls-knopf--klein" id="lb-warueckja"></button>
        </div>
      </div>

      <div class="lb-leise">
        <button type="button" class="lb-leise__knopf" id="lb-kopieren"></button>
        <span class="lb-leise__strich" aria-hidden="true"></span>
        <button type="button" class="lb-leise__knopf" id="lb-faqknopf"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="lb-blatt"></button>
      </div>
    </div>
  </section>

  <!-- Der fertige Befund.
       Gebaut fuer jemanden, der ueberfliegt: Jeder Abschnitt traegt seine
       Aussage in der Ueberschrift, links steht ein Symbol als Ankerpunkt,
       und der Kaufknopf klebt unten - er ist nie weiter weg als ein Blick. -->
  <!-- Der fertige Bericht.
       Aufgebaut wie ein Arztbrief und nicht wie eine Werbeseite: erst was
       geprueft wurde, dann was gefunden wurde, dann die Messwerte, dann als
       SCHLUSS daraus die Diagnose. Wer die Zahlen gelesen hat, bevor die
       Diagnose kommt, hinterfragt sie nicht mehr - sie ist dann seine eigene
       Rechnung und nicht unsere Behauptung. -->
  <section class="lb-schirm lb-schirm--fertig" id="lb-fertig" data-aktiv="nein">
    <!-- Der Lesefortschritt. Er sagt zwei Dinge auf einmal: wie viel noch
         kommt - und dass es ein Ende gibt. -->
    <div class="lb-fortschritt" aria-hidden="true"><i id="lb-fortschritt"></i></div>
    <div class="lb-rolle" id="lb-rolle">

      <!-- Die Kopfzeile: was das Dokument ist, und welcher Fall.
           Beides gleich gesetzt und auf derselben Grundlinie - zwei
           verschieden gesetzte Zeilen nebeneinander sehen nach Entwurf
           aus, zwei gleich gesetzte nach Vordruck. Die Fallnummer ist das
           Erste, was nach Akte aussieht. -->
      <div class="lb-briefkopf">
        <h1 id="lb-ftitel"></h1>
        <!-- DIE FALLNUMMER IST ANTIPPBAR.
             Sie ist der glaubwuerdigste Einzelbeweis der Seite: eine
             Kennung, die es nur einmal gibt. Antippen kopiert sie - damit
             wird aus einer Angabe ein Besitz. Und wer bei einer Rueckfrage
             seine Nummer nennen kann, hat einen Vorgang und keinen
             Werbekontakt. -->
        <span class="lb-briefkopf__nummer" id="lb-fnummer" role="button" tabindex="0"></span>
      </div>

      <!-- Versandstand. Steht ganz oben, sobald bestellt wurde - dort, wo
           die erste Frage nach dem Kauf sitzt: "und jetzt?" -->
      <div class="lb-versand ls-verstecken" id="lb-versand">
        <div class="lb-versand__kopf">
          <span class="lb-versand__marke" id="lb-versandmarke"></span>
          <span class="lb-versand__zeit" id="lb-versandzeit"></span>
        </div>
        <ol class="lb-spur" id="lb-spur"></ol>
        <p class="lb-versand__zahlung" id="lb-versandzahlung"></p>
      </div>

      <!-- Die Aerztin.
           KEIN Kasten darum: Sie steht frei auf dem warmen Grund der
           Seite, wie eine Unterschrift auf einem Brief. Ein Rahmen machte
           daraus ein Werbebanner.

           Ein Gesicht ist der ganze Unterschied zwischen "eine App hat
           das gerechnet" und "ein Mensch hat das angesehen" - und genau
           das ist der Satz, den diese Seite tragen muss.

           Sein Name steht in der ersten Zeile. Ohne ihn ist es eine
           Vorlage; mit ihm ist es SEIN Bericht - und die Seite ist
           teilbar, also steht da nur der Vorname, nie eine Anschrift. -->
      <!-- Die Anrede. Der groesste Text des ersten Bildschirms.
           Die erste Frage vor einer unbekannten Marke ist "ist das ueber
           mich", nicht "wer seid ihr". Bis hierher gewann die Marke: Der
           groesste, dunkelste Text oben war der Name der Aerztin, der
           Name des Patienten stand klein und grau in einem Satz darueber.
           Jetzt steht sein Name zuerst - und "sot" bindet den Befund an
           einen Tag: Ein Befund gilt fuer einen Zustand, nicht fuer
           immer, und das macht ihn glaubwuerdiger, nicht schwaecher. -->
      <p class="lb-anrede" id="lb-ffuer"></p>

      <div class="lb-arzt">
        <span class="lb-arzt__bild">
          <!-- Leeres alt: Der Name steht unmittelbar daneben. Ein
               Vorleseprogramm saegte ihn sonst zweimal. -->
          <img src="/apps/lifeskin/dr-gashi.jpg" alt="" width="58" height="58"
               decoding="async" />
          <!-- HIER SASS EIN VERIFIZIERUNGSHAKEN - ER IST WEG.
               Ein gruenes Haekchen am Profilbild ist die Bildsprache der
               sozialen Netze, und genau von dort kommen diese Leser. Es
               sagt "verifiziert" - aber von wem? Die Seite verifiziert
               sich selbst. Ein Signal ist nur glaubwuerdig, wenn es den
               Absender etwas kostet, und ein Haken kostet nichts: Jeder
               kann ihn zeichnen.
               Was hier wirklich traegt, steht ohnehin daneben - Name,
               Fachrichtung, Datum - und weiter unten der Abschnitt, der
               freiwillig sagt, was ein Foto NICHT hergibt. Der kostet im
               Zweifel einen Verkauf; deshalb wird er geglaubt. -->
        </span>
        <div class="lb-arzt__leib">
          <p class="lb-arzt__vor" id="lb-fvor"></p>
          <p class="lb-von" id="lb-fvon"><span id="lb-fvontext"></span></p>
          <p class="lb-arzt__rolle" id="lb-farzt"></p>
        </div>
      </div>

      <!-- Drei Angaben, immer in einer Reihe: Sie teilen sich die Breite
           zu gleichen Teilen und gehen deshalb auch auf 320 Bildpunkten
           auf. Sie sind der Beweis der Arbeit, bevor irgendetwas
           behauptet wird. -->
      <ul class="lb-pillen" id="lb-pillen"></ul>

      <!-- Hier endet der Kopf. Alles darunter ist der Befund.

           Die Verbindung.
           Sie zeigt, dass das Folgende AUS dem Vorigen kommt: Aus den
           drei gezaehlten Angaben faellt eine Linie nach unten, laeuft
           als Schiene quer und biegt links hinunter auf das Zeichen des
           Befunds zu. Sie stoppt davor - der Befund selbst ist kein Kasten
           in einem Diagramm, er ist der Text. -->
      <span class="lb-fluss lb-fluss--kopf" aria-hidden="true">
        <i class="lb-fluss__auf"></i>
        <i class="lb-fluss__stich"></i>
        <i class="lb-fluss__bogen"></i>
      </span>

      <!-- Der Hauptbefund. Er steht GANZ OBEN.
           Wer seine Analyse oeffnet, will als Erstes wissen, was mit
           SEINER Haut ist - nicht, mit welchem Verfahren geprueft wurde.
           Das Verfahren steht unten und aufklappbar; wer es sucht, findet
           es, und wer nur seine Antwort will, wird nicht aufgehalten. -->
      <section class="lb-teil lb-teil--ohnelinie">
        <div class="lb-teil__kopf">
          <span class="lb-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h9l4 4v15H6z"/><path d="M14.5 2.5V7H19"/><path d="M9 12h7M9 16h5"/></svg>
          </span>
          <h2 id="lb-gjetmarke"></h2>
        </div>
        <p class="lb-satz" id="lb-gjettext"></p>
      </section>

      <!-- Und weiter: vom Ende des Befundtextes hinunter zur Diagnose. -->
      <span class="lb-fluss lb-fluss--ab" aria-hidden="true"></span>

      <!-- Drei Messwerte. Beurteilt werden zehn, gezeigt die drei, die
           zaehlen - die zwei staerksten und der eine, der in Ordnung ist.
           Die uebrigen stehen im Aufklapper darunter. -->
      <section class="lb-teil ls-verstecken" id="lb-messteil">
        <div class="lb-teil__kopf">
          <span class="lb-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          </span>
          <h2 id="lb-messmarke"></h2>
        </div>
        <div class="lb-mess" id="lb-mess"></div>
      </section>

      <!-- DIE LINIE TRAEGT KEIN WORT.
           Hier stand einmal "PRANDAJ" (deshalb) und weiter unten "PER
           KETE" (dafuer) - gebaut, angesehen, wieder entfernt. Die Folge
           steht schon in der Reihenfolge: Wer die Messwerte gelesen hat
           und dann die Diagnose sieht, braucht kein Wort dazwischen, das
           ihm sagt, was er gerade selbst getan hat. Beschriftet wird die
           Linie zum Diagramm; unbeschriftet bleibt sie eine Geste.
           Nicht wieder einbauen, ohne dass jemand danach fragt. -->
      <span class="lb-fluss lb-fluss--ab" aria-hidden="true"></span>

      <!-- Die Diagnose. Sie steht NACH den Messwerten, und das ist der
           ganze Punkt: Sie ist der Schluss aus Zahlen, die er gerade
           gelesen hat, und nicht eine Behauptung, die er noch pruefen
           muesste. Eine Diagnose, die man sich selbst hergeleitet hat,
           hinterfragt man nicht.
           GEMESSEN AN DER SEITE, NICHT AN DER ABSICHT: Sie stand bis
           hierher VOR den Messwerten - genau andersherum, als dieser
           Kommentar seit jeher behauptet hat.
           Und sie verzoegert nichts: Die Frage "was ist mit meiner Haut"
           beantwortet der Hauptbefund ganz oben. Hier steht das Etikett
           dazu - Fachbegriff und Grad -, nicht die Antwort.
           Der Fachbegriff darf "leicht" sagen; die Zeile darunter benennt
           die Handlung. -->
      <section class="lb-diagnose ls-verstecken" id="lb-diagnose">
        <!-- KEIN ZEICHEN. Hier stand eines, in die obere linke Ecke
             ausgestanzt - es ist bewusst wieder heraus.
             Es unterschied nichts (die Karte nennt Marke, Diagnosename und
             lateinischen Namen bereits), ein Abzeichen kostet den Sender
             nichts und belegt deshalb nichts, und es schwaechte genau das,
             was diese Karte stark macht: dass sie DIE EINE AUSNAHME ist -
             der einzige gefuellte Farbblock der Seite. Die Begruendung in
             voller Laenge steht bei .lb-diagnose in bericht.css.
             Die Linie kommt trotzdem an: Die Kante der Karte traegt die
             Farbe und die Staerke der Linie. -->
        <span class="lb-diagnose__marke" id="lb-diagmarke"></span>
        <strong class="lb-diagnose__name" id="lb-diagname"></strong>
        <span class="lb-diagnose__lat" id="lb-diaglat"></span>
        <span class="lb-diagnose__stufe" id="lb-diagstufe"></span>

        <!-- DIE IGA-SKALA. Sie war fertig geschrieben und wurde nie
             gezeichnet - der Wert niveli treibt seit jeher die Zeile
             darueber ("Kërkon kujdes aktiv"), die Skala selbst lag tot in
             den Texten.
             Sie steht hier, weil sie die EINORDNUNG ist: "e lehtë" allein
             ist ein Adjektiv, und davon hat die Seite genug. Erst die
             Position auf einer fremden, nachschlagbaren Skala macht daraus
             eine Einordnung - und die fuenf Segmente zeigen sie, ohne ein
             einziges Wort mehr. Es ist dieselbe Form wie bei den
             Messbalken drei Abschnitte weiter oben, nur ohne Farbe.
             Das Zeichen am Etikett ist Pflicht, nicht Zierde: Niemand
             weiss, was "IGA" bedeutet. -->
        <div class="lb-iga ls-verstecken" id="lb-iga">
          <span class="lb-iga__marke" id="lb-igamarke"></span>
          <span class="lb-iga__wert" id="lb-igawert"></span>
          <span class="lb-iga__skala" id="lb-igaskala" aria-hidden="true"></span>
        </div>
      </section>

      <span class="lb-fluss lb-fluss--ab" aria-hidden="true"></span>

      <!-- Was ein Foto NICHT sagen kann.
           Der Text dafuer stand fertig in bericht-texte.js und wurde nie
           gezeichnet - der Abschnitt war geschrieben und tot.

           Er steht NICHT im Aufklapper und er steht VOR dem Angebot.
           Beides ist der Punkt: Freiwillig genannte Grenzen sind das, was
           den Rest glaubwuerdig macht. Wer die Einschraenkung erst nach dem
           Kauf findet, hat sie zu spaet gefunden - und wer sie gar nicht
           findet, sucht sie selbst und findet dann etwas anderes.

           UND ER STEHT AN DER DIAGNOSE, NICHT VOR DEM UEBERGANG.
           Dieselben Saetze lesen sich an zwei Stellen verschieden: an der
           Diagnose als aerztliche Sorgfalt - hier ist der Name, und hier
           ist, was dieser Name aus einem Foto NICHT hergibt -, unmittelbar
           vor dem Angebot als Haftungsausschluss. Was zuletzt gelesen
           wurde, liegt im Arbeitsgedaechtnis, wenn die Zahl kommt; dort
           stand bisher eine Einschraenkung und lieferte dem Zweifler die
           Vorlage fuer seinen eigenen Einwand. Jetzt steht dort
           "Çfarë mund të vazhdojë".

           Es kostet im Zweifel einen Verkauf. Genau deshalb wird der Rest
           geglaubt. Das durchgestrichene Auge sagt dieselbe Sache vor dem
           ersten Wort: Hier geht es um das, was ein Bild nicht hergibt. -->
      <section class="lb-teil" id="lb-grenzenteil">
        <div class="lb-teil__kopf">
          <span class="lb-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A9 9 0 0 1 21 12a8.9 8.9 0 0 1-2.2 4.5M6.2 6.2A9 9 0 0 0 3 12a9 9 0 0 0 9 7 8.9 8.9 0 0 0 3.4-.7"/></svg>
          </span>
          <h2 id="lb-grenzenmarke"></h2>
        </div>
        <p class="lb-satz" id="lb-grenzentext"></p>
      </section>

      <span class="lb-fluss lb-fluss--ab" aria-hidden="true"></span>

      <!-- EIN Aufklapper, und in ihm die ganze uebrige Analyse.
           Sichtbar bleibt oben, was jemand geoeffnet hat, um es zu lesen:
           sein Kopf, die Zusammenfassung, die Diagnose und die drei
           Hauptparameter. Alles Weitere - die ausfuehrliche Erklaerung,
           das Verfahren, die Zonen, die uebrigen Parameter und der
           Verlauf ohne Pflege - liegt hier, vollstaendig und in einer
           einzigen Ebene. Keine verschachtelten Aufklapper: Wer zweimal
           tippen muss, tippt nicht.
           Was NICHT hier hineingehoert, ist der Warnhinweis auf die
           aerztliche Abklaerung; er steht unverdeckt im Fluss der Seite -
           seit dem Umzug DARUEBER, direkt an der Diagnose. -->
      <details class="lb-detajet" id="lb-detajet">
        <!-- DER KOPF WIRD GEBAUT WIE JEDER ANDERE ABSCHNITTSKOPF:
             Zeichen und Titel in EINER Zeile, der Text darunter ueber die
             volle Breite. Vorher standen Titel und Zeile nebeneinander im
             Zeichen - der Titel sass dadurch hoeher als die Mitte des
             Zeichens, und beim Aufklappen stand das erste Zeichen des
             Inhalts unmittelbar unter dem Zeichen des Kopfes. Zwei gleiche
             Kacheln in einer Spalte lesen sich als Doppelung. Jetzt liegt
             die Zeile dazwischen. -->
        <summary>
          <span class="lb-detajet__kopf">
            <!-- Dasselbe Zeichen im tuerkisen Quadrat wie jeder andere
                 Abschnitt. Der Block enthaelt die halbe Analyse - sieben
                 weitere Parameter, fuenf Zonen, die ausfuehrliche
                 Erklaerung, den Verlauf. Ohne Zeichen und auf grauem Grund
                 sah er aus wie das Kleingedruckte. -->
            <span class="lb-icon" aria-hidden="true">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M15 6.2A2.7 2.7 0 0 0 12.3 3.5H6.2A2.7 2.7 0 0 0 3.5 6.2v6.1A2.7 2.7 0 0 0 6.2 15"/></svg>
            </span>
            <span id="lb-ruajkopietext"></span>
          </button>
        </div>
      </section>

      <!-- Wer geradesteht.
           Die Seite nimmt Namen, Telefonnummer und Anschrift entgegen und
           schliesst einen Kauf ab. Bis hierher hat sie ein Gesicht und
           einen Kontaktweg - aber keine Stelle, an die sich jemand wendet,
           wenn etwas schiefgeht. Das ist der Unterschied zwischen einer
           Marke mit Verantwortlichem und einer Marke mit Formular.
           Leise gesetzt und ganz unten: Es ist kein Argument, es ist eine
           Angabe. Steht in lifeskin-config.js nichts, erscheint hier auch
           nichts - erfunden wird keine Zeile. -->
      <footer class="lb-anbieter ls-verstecken" id="lb-anbieter">
        <span class="lb-anbieter__marke" id="lb-anbietermarke"></span>
        <p class="lb-anbieter__name ls-verstecken" id="lb-anbietername"></p>
        <p class="lb-anbieter__zeile ls-verstecken" id="lb-anbieteranschrift"></p>
        <p class="lb-anbieter__zeile ls-verstecken" id="lb-anbieteremail"></p>
      </footer>
    </div>

    <!-- Die Kaufleiste.
         Sie erscheint, sobald der Angebotsblock ins Bild kommt, und
         bleibt danach verfuegbar; oberhalb davon ist sie nicht da. Keine
         Lesedauer, keine Zeitschaltung - nur die Stelle, an der aus dem
         Bericht ein Angebot wird. Beschriftung und Betrag sind dieselben
         wie im Angebotsblock. -->
    <div class="lb-leiste" id="lb-leiste">
      <button type="button" class="ls-knopf ls-knopf--kauf" id="lb-kaufen"></button>
      <p class="ls-unterknopf" id="lb-kaufunter"></p>
    </div>
  </section>

  <!-- Der Bestellbildschirm.
       Kein Blatt ueber der Seite: Vier Felder und eine aufgeklappte Tastatur
       passen nicht in einen Kasten am unteren Rand - genau dort bricht es
       auf kleinen Geraeten. Ein eigener Bildschirm wie alle anderen, oben
       die Bestellung zur Kontrolle, unten der Knopf. -->
  <!-- ---------- Der Bestellschirm ----------

       Kein Blatt ueber der Seite, sondern eine ganze Seite: Vier Felder und
       die Tastatur des Telefons passen in kein Blatt am unteren Rand. Oben
       der Korb - wer beim Tippen der Adresse nicht mehr sieht, was er
       kauft, bricht haeufiger ab. Unten fest der Knopf.

       Die Beschriftungen sitzen IM Feld, nicht darueber: vier Zeilen
       gespart, und auf 320x568 entscheidet genau das darueber, ob der
       Knopf noch im Bild ist. Fuer Vorleseprogramme bleiben sie als
       aria-label erhalten. -->
  <section class="lb-schirm lb-schirm--bestellen" id="lb-bestellen" data-aktiv="nein">
    <div class="lb-kopf">
      <button type="button" class="ls-zurueck" id="lb-bzurueck" aria-label="Zurück">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="lb-bkopftext">
        <!-- "Der letzte Schritt" - und das ist keine Behauptung, es ist
             wirklich der letzte. Wer sieht, dass er fast fertig ist,
             bricht seltener ab als der, der nicht weiss, wie viel noch
             kommt. -->
        <span class="lb-bschritt" id="lb-bschritt"></span>
        <h1 class="lb-btitel" id="lb-besttitel"></h1>
      </div>
    </div>

    <div class="lb-bmitte">
      <div class="lb-bkorb" id="lb-bkorb"></div>

      <form class="lb-form" id="lb-bestellform" novalidate>
        <input class="ls-eingabe" id="lb-bname" type="text" name="name" autocomplete="name" enterkeyhint="next" />
        <input class="ls-eingabe" id="lb-btelefon" type="tel" name="tel" autocomplete="tel" inputmode="tel" enterkeyhint="next" />
        <input class="ls-eingabe" id="lb-badresse" type="text" name="street-address" autocomplete="street-address" enterkeyhint="next" />
        <input class="ls-eingabe" id="lb-bort" type="text" name="city" autocomplete="address-level2" enterkeyhint="done" />
        <p class="lb-formfehler ls-verstecken" id="lb-bfehler" role="alert"></p>
      </form>
    </div>

    <div class="lb-leiste">
      <ul class="lb-sicher lb-sicher--eng" id="lb-bsicher"></ul>
      <button type="submit" form="lb-bestellform" class="ls-knopf ls-knopf--kauf" id="lb-bsenden"></button>
      <p class="ls-unterknopf" id="lb-bunter"></p>
    </div>
  </section>

  <!-- Das Blatt.
       Alles, was nicht jeder lesen muss, aber jeder finden koennen soll:
       was beim Tippen passiert, was ohne WhatsApp gilt, und der Hinweis.
       Es liegt UEBER der Seite statt darin - so bleibt der Bildschirm
       darunter genau einen Bildschirm hoch. -->
  <div class="lb-blatt ls-verstecken" id="lb-blatt" role="dialog" aria-modal="true"
       aria-labelledby="lb-blatttitel">
    <div class="lb-blatt__grund" data-blatt-zu></div>
    <div class="lb-blatt__leib">
      <span class="lb-blatt__griff" aria-hidden="true"></span>
      <h2 id="lb-blatttitel"></h2>
      <!-- Dasselbe Blatt traegt zweierlei: die WhatsApp-Frage von der
           Warteseite und die Erklaerung eines Fachworts vom Befund. Zwei
           Blaetter waeren zwei Bedienungen fuer dieselbe Geste. -->
      <div id="lb-blattinfo" class="ls-verstecken"></div>
      <div id="lb-blattwa">
        <p id="lb-wafaqtext"></p>
        <p class="ls-klein" id="lb-kopierenunter"></p>
        <p class="ls-klein" id="lb-haftung"></p>
      </div>
      <button type="button" class="ls-knopf ls-knopf--leise" id="lb-blattzu" data-blatt-zu></button>
    </div>
  </div>

</main>

<script type="module" src="/apps/lifeskin-bericht/bericht.js"></script>
</body>
</html>
