<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#000000">

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      color: #fff;
      -ms-overflow-style: none;
      scrollbar-width: none;
      background: #000;
    }
    body {
      min-height: 100%;
      overscroll-behavior-y: auto;
      background: #000;
      color: #fff;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    #app {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #app::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

</head>
