<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ef" />
  <meta name="heart-api-base" content="/api/heart/" />
  <meta name="heart-api-fallback-base" content="" />
  <title>MENYRA Heart</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/apps/menyra-social/assets/icon-192.png" />
  <link rel="apple-touch-icon" href="/apps/menyra-social/assets/icon-192.png" />
  <link rel="stylesheet" href="./heart.css" />
</head>
<body>
  <div id="heartApp"></div>
  <noscript>
    <section style="padding:24px;font-family:Segoe UI,sans-serif;">
      <h1>MENYRA Heart braucht JavaScript</h1>
      <p>Dieses Kontrollzentrum braucht JavaScript fuer die CEO-Anmeldung, sichere Teststarts und den Live-Status.</p>
    </section>
  </noscript>
  <script>
    const heartLocalHost = /^(localhost|127\.0\.0\.1)$/i.test(window.location.hostname);
    const heartCloudFunctionsBase = "https://us-central1-menyra-c0e68.cloudfunctions.net/";
    const heartPreviewHost = /\.vercel\.app$/i.test(window.location.hostname);
    if (!heartPreviewHost) {
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = "./manifest.json";
      manifestLink.crossOrigin = "use-credentials";
      document.head.appendChild(manifestLink);
    }
    window.__MNYRA_HEART_CONFIG__ = Object.freeze({
      apiBase: heartLocalHost ? heartCloudFunctionsBase : "/api/heart/",
      fallbackApiBase: heartLocalHost ? "" : ""
    });
  </script>
  <script type="module" src="./heart.js"></script>
</body>
</html>
