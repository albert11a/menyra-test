<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leads Ansicht</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-primary: #6366f1;
      --brand-bg: #eef0ff;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
      --shadow-premium: 0 20px 50px -12px rgba(15, 23, 42, 0.08);
      --border-soft: rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.12), transparent 45%),
        radial-gradient(circle at 100% 80%, rgba(168, 85, 247, 0.08), transparent 45%),
        var(--brand-bg);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    .leads-page {
      max-width: 980px;
      margin: 0 auto;
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .m-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      background: var(--accent-grad);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.2);
    }

    .m-btn--ghost {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-soft);
      box-shadow: none;
    }

    .m-btn--small {
      padding: 6px 12px;
      font-size: 0.75rem;
    }

    .m-btn--xs {
      padding: 4px 10px;
      font-size: 0.7rem;
    }

    .m-input,
    .m-select2,
    .m-textarea {
      width: 100%;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-main);
    }

    .m-input:focus,
    .m-select2:focus,
    .m-textarea:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .m-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .m-input-group label {
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .rev-tabs {
      display: inline-flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      padding: 5px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
    }

    .rev-tab {
      padding: 10px 22px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: transparent;
      color: #fff;
      opacity: 0.65;
    }

    .rev-tab.active {
      background: #fff;
      color: var(--brand-primary);
      opacity: 1;
    }

    .leads-filters {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      align-items: end;
      margin-bottom: 16px;
    }

    .leads-filters .leads-search {
      grid-column: 1 / -1;
    }

    .leads-tabs-bar {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px;
    }

    .leads-tabs-bar .rev-tab {
      flex: 0 0 auto;
      justify-content: center;
      padding: 10px 18px;
      font-size: 0.85rem;
      background: #fff;
      color: var(--brand-primary);
      opacity: 1;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: var(--shadow-soft);
    }

    .leads-tabs-bar .rev-tab.active {
      border-color: rgba(99, 102, 241, 0.45);
      box-shadow: 0 12px 24px -18px rgba(99, 102, 241, 0.6);
    }

    .leads-tabs-bar::-webkit-scrollbar {
      display: none;
    }

    .table-card {
      background: #fff;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: var(--shadow-premium);
      border: 1px solid var(--card-border);
    }

    .leads-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }

    .lead-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .lead-row:last-child {
      border-bottom: none;
    }

    .lead-avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #64748b;
      overflow: hidden;
      flex-shrink: 0;
    }

    .lead-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .lead-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .lead-name {
      font-weight: 800;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .lead-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lead-labels .m-badge {
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(99, 102, 241, 0.18);
      background: rgba(99, 102, 241, 0.12);
      color: #4f46e5;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .lead-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .m-modal-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.2);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      padding: 24px;
    }

    .m-modal-overlay.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .m-modal {
      background: #fff;
      border-radius: 24px;
      width: min(720px, 100%);
      box-shadow: var(--shadow-premium);
      padding: 20px;
    }

    .m-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .m-modal-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .m-modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .m-input-row {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    @media (max-width: 720px) {
      .leads-filters {
        grid-template-columns: 1fr 1fr auto;
        gap: 8px;
      }

      .leads-filters label {
        display: none;
      }

      .leads-filters .leads-search {
        grid-column: 1 / 3;
      }

      .leads-tabs-bar .rev-tab {
        font-size: 0.72rem;
        padding: 8px 10px;
      }

      .lead-row {
        padding: 10px 6px;
        gap: 10px;
      }

      .lead-avatar {
        width: 38px;
        height: 38px;
        border-radius: 12px;
      }

      .lead-name {
        font-size: 0.86rem;
      }

      .lead-labels .m-badge:nth-child(n+2) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="leads-page">
    <header class="header-main">
      <div>
        <h2 class="fw-800 m-0" style="letter-spacing:-0.8px;">Lead Management</h2>
        <p class="text-muted small fw-600 m-0" style="color:var(--text-muted);">Leads uebersichtlich verwalten</p>
      </div>
      <button class="m-btn" id="newLeadBtn" type="button">Neuer Lead</button>
    </header>

    <div class="leads-filters">
      <div class="m-input-group leads-search">
        <label for="leadsSearch">Suche</label>
        <input id="leadsSearch" class="m-input" placeholder="Betrieb, Kontakt, IG, Label..." />
      </div>
      <div class="m-input-group">
        <label for="leadsStatusFilter">Status</label>
        <select id="leadsStatusFilter" class="m-select2">
          <option value="">Alle Status</option>
          <option value="new">Open</option>
          <option value="contacted">Contacted</option>
          <option value="waiting">Waiting</option>
          <option value="follow_up">Follow up</option>
          <option value="interested">Interested</option>
          <option value="no_interest">No interest</option>
          <option value="converted">Converted</option>
          <option value="archived">Archiv</option>
        </select>
      </div>
      <div class="m-input-group">
        <label for="leadsTypeFilter">Typ</label>
        <select id="leadsTypeFilter" class="m-select2">
          <option value="">Alle Typen</option>
          <option value="restaurant">Restaurant</option>
          <option value="cafe">Cafe</option>
          <option value="hotel">Hotel</option>
          <option value="ecommerce">Ecommerce</option>
          <option value="service">Service</option>
        </select>
      </div>
      <div class="m-input-group">
        <label for="leadsLabelFilter">Label</label>
        <select id="leadsLabelFilter" class="m-select2">
          <option value="">Alle Labels</option>
        </select>
      </div>
    </div>

    <div class="rev-tabs leads-tabs-bar">
      <button class="rev-tab active" type="button">Gesamt <span id="leadsTotalBadge">0</span></button>
      <button class="rev-tab" type="button" id="leadsStatNew"></button>
      <button class="rev-tab" type="button" id="leadsStatContacted"></button>
      <button class="rev-tab" type="button" id="leadsStatInterested"></button>
      <button class="rev-tab" type="button" id="leadsStatNoInterest"></button>
      <button class="rev-tab" type="button" id="leadsStatArchived"></button>
    </div>

    <div class="table-card p-0 leads-card">
      <div class="leads-list" id="leadsTableBody" data-view-style="list"></div>
    </div>
  </div>

  <div class="m-modal-overlay" id="leadModalOverlay">
    <div class="m-modal">
      <div class="m-modal-header">
        <h3 class="m-modal-title" id="leadModalTitle">Lead bearbeiten</h3>
        <button class="m-btn m-btn--ghost m-btn--small" id="leadModalClose" type="button">Close</button>
      </div>
      <div class="m-modal-body">
        <input type="hidden" id="leadId" />
        <div class="m-input-row">
          <div class="m-input-group">
            <label for="leadBusinessName">Business</label>
            <input id="leadBusinessName" class="m-input" placeholder="Cafe name" />
          </div>
          <div class="m-input-group">
            <label for="leadCustomerType">Type</label>
            <select id="leadCustomerType" class="m-select2">
              <option value="restaurant">Restaurant</option>
              <option value="cafe">Cafe</option>
              <option value="ecommerce">Ecommerce</option>
              <option value="hotel">Hotel</option>
              <option value="service">Service</option>
            </select>
          </div>
        </div>
        <div class="m-input-row">
          <div class="m-input-group">
            <label for="leadLogoUrl">Logo URL</label>
            <input id="leadLogoUrl" class="m-input" placeholder="https://" />
          </div>
          <div class="m-input-group">
            <label for="leadContactName">Contact</label>
            <input id="leadContactName" class="m-input" placeholder="Contact name" />
          </div>
        </div>
        <div class="m-input-row">
          <div class="m-input-group">
            <label for="leadPhone">Phone</label>
            <input id="leadPhone" class="m-input" placeholder="+00" />
          </div>
          <div class="m-input-group">
            <label for="leadInstagram">Instagram</label>
            <input id="leadInstagram" class="m-input" placeholder="@handle" />
          </div>
        </div>
        <div class="m-input-row">
          <div class="m-input-group">
            <label for="leadCity">City</label>
            <input id="leadCity" class="m-input" placeholder="City" />
          </div>
          <div class="m-input-group">
            <label for="leadStatus">Status</label>
            <select id="leadStatus" class="m-select2">
              <option value="new">Open</option>
              <option value="contacted">Contacted</option>
              <option value="waiting">Waiting</option>
              <option value="follow_up">Follow up</option>
              <option value="interested">Interested</option>
              <option value="no_interest">No interest</option>
              <option value="converted">Converted</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>
        <div class="m-input-group">
          <label for="leadLabels">Labels</label>
          <input id="leadLabels" class="m-input" placeholder="IG, warm, vip" />
        </div>
        <div class="m-input-group">
          <label for="leadNote">Note</label>
          <textarea id="leadNote" class="m-textarea" placeholder="Short note"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="m-btn m-btn--ghost" id="leadCancelBtn" type="button">Cancel</button>
          <button class="m-btn" id="leadSaveBtn" type="button">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const leadsAll = [
      {
        id: "l1",
        businessName: "Cafe Aurora",
        customerType: "cafe",
        contactName: "Mira",
        phone: "+49 170 11111",
        instagram: "@aurora",
        city: "Berlin",
        labels: ["IG", "warm"],
        status: "new",
        logoUrl: ""
      },
      {
        id: "l2",
        businessName: "Ristorante Luna",
        customerType: "restaurant",
        contactName: "Paolo",
        phone: "+49 170 22222",
        instagram: "@luna",
        city: "Hamburg",
        labels: ["vip"],
        status: "contacted",
        logoUrl: ""
      },
      {
        id: "l3",
        businessName: "Hotel Nord",
        customerType: "hotel",
        contactName: "Sina",
        phone: "+49 170 33333",
        instagram: "",
        city: "Koeln",
        labels: ["hotel", "warm"],
        status: "interested",
        logoUrl: ""
      }
    ];

    const statusLabels = {
      new: "Offen",
      contacted: "Kontaktiert",
      waiting: "Warten",
      follow_up: "Follow up",
      interested: "Interesse",
      no_interest: "Kein Interesse",
      converted: "Kunde erstellt",
      archived: "Archiv"
    };

    const typeLabels = {
      restaurant: "Restaurant",
      cafe: "Cafe",
      ecommerce: "Ecommerce",
      hotel: "Hotel",
      service: "Service"
    };

    const $ = (id) => document.getElementById(id);

    function normalizeLeadStatusKey(value) {
      return String(value || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
    }

    function normalizeLeadTypeKey(value) {
      const key = String(value || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
      return key === "e_commerce" ? "ecommerce" : key;
    }

    function normalizeLeadLabels(value) {
      const list = Array.isArray(value) ? value : (typeof value === "string" ? value.split(/[;,]/) : []);
      const seen = new Set();
      const out = [];
      list.forEach((raw) => {
        const label = String(raw || "").trim();
        if (!label) return;
        const key = label.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        out.push(label);
      });
      return out;
    }

    function leadStatusLabel(value) {
      const key = normalizeLeadStatusKey(value);
      return statusLabels[key] || value || "-";
    }

    function applyFilters(rows) {
      const term = ($("leadsSearch").value || "").trim().toLowerCase();
      const statusFilter = normalizeLeadStatusKey($("leadsStatusFilter").value || "");
      const typeFilter = normalizeLeadTypeKey($("leadsTypeFilter").value || "");
      const labelFilter = ($("leadsLabelFilter").value || "").trim().toLowerCase();

      return rows.filter((r) => {
        const statusKey = normalizeLeadStatusKey(r.status || "");
        if (statusFilter && statusKey !== statusFilter) return false;

        const typeKey = normalizeLeadTypeKey(r.customerType || "");
        if (typeFilter && typeKey !== typeFilter) return false;

        const labels = normalizeLeadLabels(r.labels || []);
        if (labelFilter && !labels.some((l) => l.toLowerCase() === labelFilter)) return false;

        if (!term) return true;
        const hay = [
          r.businessName,
          r.city,
          r.contactName,
          r.phone,
          r.instagram,
          r.status,
          r.customerType,
          labels.join(" ")
        ].join(" ").toLowerCase();
        return hay.includes(term);
      });
    }

    function renderLabelFilterOptions(rows) {
      const sel = $("leadsLabelFilter");
      const current = sel.value || "";
      const labels = new Set();
      rows.forEach((r) => normalizeLeadLabels(r.labels || []).forEach((l) => labels.add(l)));
      sel.innerHTML = "";
      const opt0 = document.createElement("option");
      opt0.value = "";
      opt0.textContent = "Alle Labels";
      sel.appendChild(opt0);
      Array.from(labels).sort().forEach((label) => {
        const opt = document.createElement("option");
        opt.value = label;
        opt.textContent = label;
        sel.appendChild(opt);
      });
      if (current && labels.has(current)) sel.value = current;
    }

    function renderTabs(rows) {
      $("leadsTotalBadge").textContent = String(rows.length);
      const counts = {
        new: 0,
        contacted: 0,
        interested: 0,
        no_interest: 0,
        archived: 0
      };
      rows.forEach((r) => {
        const key = normalizeLeadStatusKey(r.status || "");
        if (counts[key] !== undefined) counts[key] += 1;
      });
      $("leadsStatNew").textContent = `${leadStatusLabel("new")}: ${counts.new}`;
      $("leadsStatContacted").textContent = `${leadStatusLabel("contacted")}: ${counts.contacted}`;
      $("leadsStatInterested").textContent = `${leadStatusLabel("interested")}: ${counts.interested}`;
      $("leadsStatNoInterest").textContent = `${leadStatusLabel("no_interest")}: ${counts.no_interest}`;
      $("leadsStatArchived").textContent = `${leadStatusLabel("archived")}: ${counts.archived}`;
    }

    function renderLeads(rows) {
      const body = $("leadsTableBody");
      body.innerHTML = "";
      if (!rows.length) {
        body.innerHTML = '<div style="padding:10px;color:#64748b;">Keine Leads.</div>';
        return;
      }
      rows.forEach((r) => {
        const logoUrl = String(r.logoUrl || "").trim();
        const name = String(r.businessName || "-");
        const initial = name.trim() ? name.trim().charAt(0).toUpperCase() : "?";
        const labels = normalizeLeadLabels(r.labels || []);
        const labelsHtml = labels.length
          ? `<div class="lead-labels">${labels.map((l) => `<span class="m-badge">${l}</span>`).join("")}</div>`
          : "";

        const row = document.createElement("div");
        row.className = "lead-row";
        row.innerHTML = `
          <div class="lead-avatar">
            ${logoUrl ? `<img src="${logoUrl}" alt="" loading="lazy" />` : `<span>${initial}</span>`}
          </div>
          <div class="lead-details">
            <div class="lead-name">${name}</div>
            ${labelsHtml}
          </div>
          <div class="lead-actions">
            <button class="m-btn m-btn--ghost m-btn--xs" type="button" data-id="${r.id}">Bearbeiten</button>
          </div>
        `;
        row.querySelector("button").addEventListener("click", () => openLeadModal(r));
        body.appendChild(row);
      });
    }

    function refresh() {
      renderLabelFilterOptions(leadsAll);
      renderTabs(leadsAll);
      const filtered = applyFilters(leadsAll);
      renderLeads(filtered);
    }

    function openLeadModal(data) {
      $("leadModalTitle").textContent = data?.id ? "Lead bearbeiten" : "Neuer Lead";
      $("leadId").value = data?.id || "";
      $("leadBusinessName").value = data?.businessName || "";
      $("leadCustomerType").value = data?.customerType || "cafe";
      $("leadLogoUrl").value = data?.logoUrl || "";
      $("leadContactName").value = data?.contactName || "";
      $("leadPhone").value = data?.phone || "";
      $("leadInstagram").value = data?.instagram || "";
      $("leadCity").value = data?.city || "";
      $("leadStatus").value = data?.status || "new";
      $("leadLabels").value = normalizeLeadLabels(data?.labels || []).join(", ");
      $("leadNote").value = data?.note || "";
      $("leadModalOverlay").classList.add("is-visible");
    }

    function closeLeadModal() {
      $("leadModalOverlay").classList.remove("is-visible");
    }

    function saveLead() {
      const id = $("leadId").value || `l${Date.now()}`;
      const payload = {
        id,
        businessName: $("leadBusinessName").value.trim(),
        customerType: $("leadCustomerType").value.trim(),
        logoUrl: $("leadLogoUrl").value.trim(),
        contactName: $("leadContactName").value.trim(),
        phone: $("leadPhone").value.trim(),
        instagram: $("leadInstagram").value.trim(),
        city: $("leadCity").value.trim(),
        status: $("leadStatus").value.trim(),
        labels: normalizeLeadLabels($("leadLabels").value || ""),
        note: $("leadNote").value.trim()
      };
      const idx = leadsAll.findIndex((l) => l.id === id);
      if (idx === -1) leadsAll.unshift(payload);
      else leadsAll[idx] = payload;
      closeLeadModal();
      refresh();
    }

    $("newLeadBtn").addEventListener("click", () => openLeadModal({}));
    $("leadModalClose").addEventListener("click", closeLeadModal);
    $("leadCancelBtn").addEventListener("click", closeLeadModal);
    $("leadSaveBtn").addEventListener("click", saveLead);
    $("leadModalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "leadModalOverlay") closeLeadModal();
    });

    ["leadsSearch", "leadsStatusFilter", "leadsTypeFilter", "leadsLabelFilter"].forEach((id) => {
      $(id).addEventListener("input", refresh);
      $(id).addEventListener("change", refresh);
    });

    refresh();
  </script>
</body>
</html>
