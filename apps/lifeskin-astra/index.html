<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Der Befund eines Patienten gehoert in keine Suchmaschine. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f8f7f3">
  <title>Analiza juaj e lëkurës · LifeSkin</title>
  <meta name="description" content="Rezultati i analizës suaj, plani i kujdesit dhe paketa në një faqe të qartë.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/apps/lifeskin-astra/astra.css">
  <script type="module" src="/apps/lifeskin-astra/astra.js"></script>
</head>
<body>
  <a class="skip" href="#rezultati">Kalo te analiza</a>
  <header class="masthead">
    <a class="wordmark" href="#rezultati"><span id="an-kopftitel"></span><span id="an-kopfnummer" hidden></span></a>
    <button class="quiet-button" data-help type="button" hidden id="an-pyetjeknopf"><span id="an-pyetje"></span><span class="ikona-platz" data-ikona="arrow-up-right" aria-hidden="true"></span></button>
  </header>

  <!-- Wird geladen. Eine Zeile, kein Geruest, das gleich wieder
       verschwindet - ein Skelett, das eine halbe Sekunde steht, sieht
       nach Panne aus. -->
  <div class="state-screen" id="an-laedt">
    <p class="state-lead" id="an-laedttext"></p>
  </div>

  <!-- Nicht gefunden. -->
  <div class="state-screen" id="an-weg" hidden>
    <p class="eyebrow state-mark"><span class="ikona-platz" data-ikona="circle-alert" aria-hidden="true"></span><span>LIFESKIN</span></p>
    <h1 class="state-title" id="an-wegtitel"></h1>
    <p class="state-lead" id="an-wegtext"></p>
  </div>

  <!-- Warten: der Bildschirm, den fast jeder zuerst sieht.

       ER IST DER DER VORLAGE, Teil fuer Teil: oben die Wartezeit, in der
       Mitte die Aussage, darunter die Akte, unten die eine Handlung. Er
       passt auf ein Telefon, ohne dass jemand scrollen muss - gescrollt
       wird erst, wenn der Befund da ist. Deshalb traegt er auch seinen
       eigenen Kopf und nicht den Briefkopf der Analyse: Was hier steht,
       ist ein Bildschirm und noch kein Dokument. -->
  <div class="wait" id="an-prit" hidden>

    <div class="wait-head">
      <span class="wait-brand">LIFESKIN</span>
      <!-- Die Wartezeit steht ganz oben und nicht im Text. Sie ist die
           erste Frage, die jeder hat: wann. -->
      <span class="wait-when"><i aria-hidden="true"></i><b id="an-pritdauer"></b></span>
    </div>

    <!-- DIE ZEILE STATT DER BUEHNE.
         Vorher stand hier ein grosser Ring mit dem Zeichen darin, darunter
         der Satz - zusammen ueber ein Drittel des Bildschirms fuer eine
         Auskunft, die in eine Zeile passt. Jetzt: das Zeichen klein und
         links, der Satz daneben. Was dadurch frei wird, bekommt das
         Nummernfeld, denn davon haengt ab, ob dieser Mensch seinen Befund
         je zu sehen bekommt. -->
    <div class="wait-lead">
      <span class="wait-mark" aria-hidden="true">
        <!-- Ein Gesicht unter der Lupe: genau das, was der Satz daneben
             sagt. Kein Zahnrad, keine Wellenlinie - hier arbeitet keine
             Maschine, hier sieht ein Mensch hin. -->
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M24 6c7.2 0 12 4.8 12 12v5c0 8-5.4 14-12 14s-12-6-12-14v-5C12 10.8 16.8 6 24 6z"/>
          <path d="M18.5 20.5h3M26.5 20.5h3"/>
          <path d="M24 22v4.5h-2"/>
          <path d="M20.5 30c1.2 1 2.2 1.4 3.5 1.4s2.3-.4 3.5-1.4"/>
          <circle cx="33" cy="33" r="7.5" stroke-width="2.8"/>
          <path d="M38.6 38.6L44 44" stroke-width="3.2"/>
        </svg>
      </span>
      <h1 id="an-prittitel"></h1>
    </div>

    <!-- Die Akte. Nummer gross, alles andere klein, der Fortschritt als
         vier Punkte statt als vier Zeilen. -->
    <div class="wait-file">
      <div class="wait-file-row">
        <span class="wait-file-mark" id="an-pritnumrimarke"></span>
        <strong class="wait-file-number" id="an-pritnumri"></strong>
      </div>
      <div class="wait-file-row wait-file-row-quiet">
        <span id="an-pritzeit"></span>
        <span id="an-pritfoto"></span>
      </div>
      <ol class="wait-dots" id="an-prithapat"></ol>
      <p class="wait-now" id="an-pritjetzt"></p>
    </div>

    <div class="wait-foot">
      <!-- DIE NUMMER ZUERST, UND NICHT ALS FRAGE.
           Hier stand "Dëshironi të njoftoheni kur të përfundojë?" - eine
           Frage, auf die "nein" eine Antwort ist. Sie ist keine: Ohne
           einen Weg zurueck ist die Analyse wertlos, weil der Patient sie
           nie zu sehen bekommt. Von 32 fertigen Analysen haben 13 ihren
           Befund geoeffnet - genau die 13, die erreichbar waren.
           Also steht hier eine Ansage und darunter das Feld. -->
      <form class="wait-phone" id="an-pritnrform" novalidate>
        <p class="wait-phone-title" id="an-pritnrtitel"></p>
        <div class="wait-phone-row">
          <!-- type=tel und inputmode=tel: Auf dem Telefon kommt die
               Zifferntastatur, nicht die Buchstaben. Das ist der
               Unterschied zwischen "kurz eintippen" und "aufgeben". -->
          <input class="wait-phone-input" id="an-pritnr" name="tel" type="tel"
                 inputmode="tel" autocomplete="tel" maxlength="24"
                 aria-describedby="an-pritnrgabim" />
          <button class="wait-phone-save" type="submit" id="an-pritnrknopf"></button>
        </div>
        <p class="wait-phone-error" id="an-pritnrgabim" role="alert" hidden></p>
      </form>

      <p class="wait-phone-done" id="an-pritnrgati" hidden></p>

      <!-- Und der zweite Weg, kleiner: Wer lieber selbst schreibt, tut es
           hier. Er ersetzt die Nummer nicht, er steht daneben. -->
      <div class="wait-or" id="an-pritose" aria-hidden="true"><span></span></div>
      <a class="wa-button wa-button-small" id="an-pritwa" href="#" target="_blank" rel="noopener"></a>

      <div class="wait-back" id="an-pritwarueck" hidden>
        <p id="an-pritwarueckfrage"></p>
        <button class="wa-button wa-button-small" type="button" id="an-pritwarueckja"></button>
      </div>

      <!-- Die zwei leisen Woerter. Beides sind Auswege, keine Angebote:
           Wer sie braucht, findet sie; wer nicht, liest ueber sie
           hinweg. -->
      <div class="wait-quiet">
        <button class="wait-quiet-button" type="button" id="an-pritkopjo"></button>
        <span class="wait-quiet-line" aria-hidden="true"></span>
        <button class="wait-quiet-button" type="button" id="an-pritsi"
                aria-haspopup="dialog" aria-controls="an-pritblatt"></button>
      </div>
    </div>
  </div>

  <!-- Die fertige Analyse. -->
  <div class="layout" id="an-fertig" hidden>
    <aside class="contents" aria-label="Në këtë analizë">
      <p class="eyebrow" id="an-permbledhja">PËRMBLEDHJA JUAJ</p>
      <nav id="an-nav">
        <a href="#rezultati" aria-current="location"><span>01</span> Rezultati</a>
        <a href="#plani"><span>02</span> Plani juaj</a>
        <a href="#paketa"><span>03</span> Paketa</a>
        <a href="#ndjekja"><span>04</span> Ndjekja</a>
        <a href="#analiza-plote"><span>05</span> Analiza e plotë</a>
      </nav>
      <div class="contents-foot">Një hap i qartë,<br>pastaj hapi tjetër.</div>
    </aside>
    <main>
      <section class="section hero" id="rezultati">
        <h1 id="an-titel"></h1>
        <p class="intro" id="an-intro"></p>
        <div class="reviewer" id="an-arzt">
          <img id="an-arztbild" src="/apps/lifeskin/dr-gashi.jpg" alt="Dr. Violeta Gashi" width="64" height="64">
          <div><strong id="an-arztname"></strong><span id="an-arztrolle"></span></div>
        </div>
        <div class="result-card">
          <span class="eyebrow" id="an-rezultatimarke"></span>
          <h2 id="an-gjetjakryesore"></h2>
          <p id="an-permbledhjatext"></p>
          <div class="diagnosis" id="an-diagnoza">
            <div><span id="an-diagnozamarke"></span><strong id="an-diagnozaemri"></strong><em lang="la" id="an-diagnozalat"></em></div>
            <span class="grade" id="an-diagnozagrada"></span>
          </div>
          <div class="result-next"><span id="an-hapimarke"></span><strong id="an-hapitext"></strong></div>
        </div>
        <p class="method-note"><span id="an-metodanote"></span> <a href="#kufijte" id="an-metodalink"></a></p>
        <a class="text-link" href="#plani"><span id="an-drejtplanit"></span><span class="ikona-platz" data-ikona="arrow-down" aria-hidden="true"></span></a>
      </section>

      <section class="section findings" aria-labelledby="an-gjetjettitel" id="an-gjetjetsektion">
        <div class="section-heading"><span class="eyebrow" id="an-gjetjetmarke"></span><h2 id="an-gjetjettitel"></h2></div>
        <div id="an-gjetjet"></div>
        <p class="note" id="an-gjetjetnote"></p>
      </section>

      <section class="section" id="plani">
        <div class="section-heading"><span class="eyebrow" id="an-planimarke"></span><h2 id="an-planititel"></h2><p id="an-planiintro"></p></div>
        <div class="goal"><span class="eyebrow" id="an-objektivimarke"></span><p id="an-objektivitext"></p></div>
        <div class="product-list" id="an-produkte"></div>
        <div class="routine" id="an-rutina">
          <div class="section-heading"><span class="eyebrow" id="an-rutinamarke"></span><h3 id="an-rutinatitel"></h3></div>
          <div class="routine-columns">
            <div><h4><span class="ikona-platz" data-ikona="sun" aria-hidden="true"></span><span id="an-rutinamengjesmarke"></span></h4><p id="an-rutinamengjes"></p></div>
            <div><h4><span class="ikona-platz" data-ikona="moon" aria-hidden="true"></span><span id="an-rutinambremjemarke"></span></h4><p id="an-rutinambremje"></p></div>
          </div>
        </div>
      </section>

      <!-- Das Angebot. Es faellt ganz weg, wenn der Befund keines
           traegt - eine leere Angebotskarte unter einem Befund, der eine
           aerztliche Abklaerung verlangt, waere das Schlimmste, was
           diese Seite tun kann. -->
      <section class="section offer-section" id="paketa" hidden>
        <div class="section-heading"><span class="eyebrow" id="an-paketamarke"></span><h2 id="an-paketatitel"></h2><p id="an-paketaintro"></p></div>
        <div class="offer-card">
          <div class="set-heading"><div><span class="eyebrow" id="an-setimarke"></span><h3 id="an-setititel"></h3></div><span class="set-count" id="an-setinumri"></span></div>
          <ul class="set-items" id="an-setitems"></ul>
          <ul class="included" id="an-perfshihet"></ul>
          <div class="price-area"><div><span class="price-label" id="an-cmimimarke"></span><strong class="price" data-price></strong><span class="price-day" id="an-cmimidita"></span></div><p><span id="an-pagesanjehere"></span><br><strong id="an-pagesakur"></strong></p></div>
          <div class="purchase-facts">
            <span><span class="ikona-platz" data-ikona="truck" aria-hidden="true"></span><span id="an-faktdergesamarke"></span> <b data-delivery></b></span>
            <span><span class="ikona-platz" data-ikona="package" aria-hidden="true"></span><span id="an-fakttransportimarke"></span> <b id="an-faktfalas"></b></span>
            <span><span class="ikona-platz" data-ikona="hand-coins" aria-hidden="true"></span><span id="an-faktparapagim"></span></span>
          </div>
          <details class="guarantee" id="an-garancia" hidden><summary><span class="ikona-platz" data-ikona="shield-check" aria-hidden="true"></span><span id="an-garanciatitel"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body"><p id="an-garanciatext"></p></div></details>
        </div>
        <button class="help-link" data-help type="button" id="an-pyetjeparavendimit"></button>
      </section>

      <!-- Der Zustand nach der Bestellung. Er steht an der Stelle des
           Angebots: Wer schon bestellt hat, sucht keinen Kaufknopf,
           sondern sein Paket. -->
      <section class="section" id="an-porosiastatus" hidden>
        <div class="section-heading"><span class="eyebrow" id="an-statusmarke"></span><h2 id="an-statustitel"></h2></div>
        <ol class="timeline" id="an-statushapat"></ol>
        <p class="note" id="an-statusnote"></p>
      </section>

      <section class="section" id="ndjekja">
        <div class="section-heading"><span class="eyebrow" id="an-ndjekjamarke"></span><h2 id="an-ndjekjatitel"></h2><p id="an-ndjekjaintro"></p></div>
        <ol class="timeline" id="an-ndjekjahapat"></ol>
        <div class="care-card"><img src="/apps/lifeskin/dr-gashi.jpg" alt="" width="56" height="56" loading="lazy"><div><h3 id="an-kontakttitel"></h3><p id="an-kontakttext"></p><button data-help class="text-link" type="button"><span id="an-kontaktknopf"></span><span class="ikona-platz" data-ikona="arrow-up-right" aria-hidden="true"></span></button></div></div>
      </section>

      <section class="section full-report" id="analiza-plote">
        <div class="section-heading"><span class="eyebrow" id="an-plotemarke"></span><h2 id="an-plotetitel"></h2><p id="an-ploteintro"></p></div>
        <details id="an-zonatblock" hidden><summary><span id="an-zonatmarke"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body"><dl class="zone-list" id="an-zonat"></dl></div></details>
        <details id="an-kuptimiblock" hidden><summary><span id="an-kuptimimarke"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body" id="an-kuptimi"></div></details>
        <details id="an-parametratblock" hidden><summary><span id="an-parametratmarke"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body"><dl class="zone-list" id="an-parametrat"></dl><p class="note" id="an-parametratnote"></p></div></details>
        <details id="an-termatblock" hidden><summary><span id="an-termatmarke"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body" id="an-termat"></div></details>
        <details id="an-ekzaminimiblock" hidden><summary><span id="an-ekzaminimimarke"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body"><p id="an-ekzaminimi"></p></div></details>
        <!-- Die Grenze der Methode. Sie steht IMMER da, bei jedem
             Befund, mit demselben Wortlaut. -->
        <details id="kufijte"><summary><span id="an-kufijtemarke"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body"><p id="an-kufijtetext"></p></div></details>
        <details id="an-pakujdesblock" hidden><summary><span id="an-pakujdesmarke"></span><span class="ikona-platz" data-ikona="plus" aria-hidden="true"></span></summary><div class="details-body" id="an-pakujdes"></div></details>
      </section>

      <section class="section faq" id="pyetjet">
        <div class="section-heading"><span class="eyebrow" id="an-pyetjetmarke"></span><h2 id="an-pyetjettitel"></h2></div>
        <div id="an-pyetjet"></div>
      </section>

      <footer class="page-footer">
        <div><span class="wordmark">LIFESKIN<span>SKINREACT</span></span><p id="an-slogan"></p></div>
        <p class="note" id="an-anbieter" hidden></p>
        <button class="text-link" data-help type="button"><span id="an-kontaktfus"></span><span class="ikona-platz" data-ikona="arrow-up-right" aria-hidden="true"></span></button>
      </footer>
    </main>
  </div>

  <div class="sticky-purchase" id="an-leiste" hidden>
    <button class="primary-button" data-order type="button" id="an-leisteknopf"></button>
    <p class="unterknopf" id="an-leisteunter"></p>
  </div>

  <!-- Die Bestellung: EINE GANZE SEITE, KEIN BLATT UEBER DER SEITE.

       GEMESSEN, NICHT GESCHAETZT: Vier Felder und die Tastatur des
       Telefons passen in kein Blatt am unteren Rand. Die Tastatur schiebt
       es hoch, der Knopf rutscht aus dem Bild - und der Kunde tippt seine
       Anschrift, ohne noch zu sehen, was er kauft.

       Aufbau wie in der frueheren Fassung: oben der Kopf mit dem Weg
       zurueck, darunter der Korb mit dem, was er bekommt, dann die
       Felder, unten festgenagelt der Knopf. Die Beschriftungen sitzen IM
       Feld - vier Zeilen gespart, und auf einem kleinen Telefon
       entscheidet genau das darueber, ob der Knopf noch im Bild ist. Fuer
       Vorleseprogramme bleiben sie als aria-label erhalten. -->
  <div class="order-screen" id="an-porosia" hidden>
    <div class="order-head" id="an-porosiakopf">
      <button class="order-back" id="an-porosiazurueck" type="button" aria-label="Kthehu">
        <span class="ikona-platz" data-ikona="arrow-left" aria-hidden="true"></span>
      </button>
      <div class="order-head-text">
        <span class="eyebrow" id="an-porosiamarke"></span>
        <h1 class="order-title" id="an-porosiatitel"></h1>
      </div>
    </div>

    <div class="order-middle" id="an-porosiaform">
      <!-- Der Korb steht UEBER den Feldern, nicht darunter: Wer beim
           Tippen nicht mehr sieht, was er kauft, bricht haeufiger ab. -->
      <div class="order-basket" id="an-porosiakorb"></div>
      <form class="order-form" id="an-form" novalidate>
        <input class="order-input" id="an-emri" name="name" autocomplete="name" enterkeyhint="next" required maxlength="100">
        <input class="order-input" id="an-telefon" name="tel" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="next" required maxlength="30">
        <input class="order-input" id="an-adresa" name="street-address" autocomplete="street-address" enterkeyhint="next" required maxlength="150">
        <input class="order-input" id="an-qyteti" name="city" autocomplete="address-level2" enterkeyhint="done" required maxlength="100">
        <p class="form-error" id="an-fehler" role="alert" hidden></p>
      </form>
    </div>

    <!-- Die Leiste klebt unten und scrollt nicht weg. Die Zusagen stehen
         hier und nicht weiter oben: Der Zweifel kommt beim Tippen der
         Anschrift zurueck, nicht davor. -->
    <div class="order-bar" id="an-porosialeiste">
      <ul class="order-promises" id="an-porosiasiguria"></ul>
      <button class="primary-button" type="submit" form="an-form" id="an-senden"><span id="an-sendentext"></span><span data-price></span><span class="ikona-platz" data-ikona="arrow-right" aria-hidden="true"></span></button>
      <p class="unterknopf" id="an-porosianote"></p>
    </div>

    <div class="order-done" id="an-danke" hidden role="status">
      <span class="success-icon" data-ikona="check" aria-hidden="true"></span>
      <h2 id="an-danketitel"></h2>
      <p id="an-danketext"></p>
      <button class="primary-button" type="button" id="an-dankeknopf"></button>
    </div>
  </div>

  <dialog id="an-ndihma" aria-labelledby="an-ndihmatitel">
    <div class="dialog-top"><span class="eyebrow">LIFESKIN</span><button class="close-button" data-close type="button" aria-label="Mbyll"><span class="ikona-platz" data-ikona="x" aria-hidden="true"></span></button></div>
    <h2 id="an-ndihmatitel"></h2>
    <p id="an-ndihmatext"></p>
    <a class="primary-button" id="an-whatsapp" href="#" target="_blank" rel="noopener"><span class="ikona-platz" data-ikona="message-circle" aria-hidden="true"></span><span id="an-whatsapptext"></span><span class="ikona-platz" data-ikona="arrow-right" aria-hidden="true"></span></a>
    <button class="text-link" data-close type="button" id="an-ndihmambyll"></button>
  </dialog>

  <!-- Das Blatt der Warteseite: was beim Tippen auf WhatsApp wirklich
       passiert, was ohne WhatsApp gilt, und der Hinweis. Es liegt UEBER
       dem Bildschirm statt darin - so bleibt der Bildschirm genau einen
       Bildschirm hoch. -->
  <dialog id="an-pritblatt" class="sheet" aria-labelledby="an-pritblatttitel">
    <span class="sheet-grip" aria-hidden="true"></span>
    <h2 id="an-pritblatttitel"></h2>
    <p id="an-pritblatttext"></p>
    <p class="sheet-small" id="an-pritkopjounder"></p>
    <button class="sheet-close" data-close type="button" id="an-pritblattmbyll"></button>
  </dialog>

  <noscript><p class="noscript-note">Kjo analizë kërkon JavaScript për t'u hapur. Ju lutemi aktivizojeni dhe rifreskoni faqen.</p></noscript>
</body>
</html>
