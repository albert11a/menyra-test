<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="transparent" />
  <meta name="heart-api-base" content="/api/heart/" />
  <meta name="heart-api-fallback-base" content="" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MNYRA Heart</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/apps/mnyra-heart/assets/icon-192.png?v=2026-03-20-heart-icon-normal-2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apps/mnyra-heart/assets/apple-touch-icon.png?v=2026-03-20-heart-icon-normal-2" />
  <link rel="stylesheet" href="/apps/mnyra-heart/heart.css" />
</head>
<body>
  <div id="heartApp"></div>
  <noscript>
    <section style="padding:24px;font-family:Segoe UI,sans-serif;">
      <h1>MNYRA Heart braucht JavaScript</h1>
      <p>Diese Heart-Oberflaeche braucht JavaScript fuer Anmeldung, Teststarts und Live-Status.</p>
    </section>
  </noscript>
  <script>
    function isHeartLocalDevelopmentHost(hostname) {
      const host = String(hostname || "").trim().toLowerCase();
      return /^(localhost|127\.0\.0\.1|0\.0\.0\.0|::1)$/i.test(host)
        || /^10\./.test(host)
        || /^192\.168\./.test(host)
        || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(host);
    }
    const heartLocalHost = isHeartLocalDevelopmentHost(window.location.hostname);
    const heartCloudFunctionsBase = "https://us-central1-menyra-c0e68.cloudfunctions.net/";
    const heartPreviewHost = /\.vercel\.app$/i.test(window.location.hostname);
    function getHeartEmulatorFunctionsBase() {
      try {
        const runtime = window.__MENYRA_FIREBASE_EMULATORS__;
        const source = runtime && typeof runtime === "object" ? runtime : {};
        const queryEnabled = new URLSearchParams(window.location.search).get("firebase-emulator") === "1";
        if (source.enabled !== true && !queryEnabled) return "";
        const projectId = String(source.projectId || "mnyra-local").trim();
        if (!/^(mnyra-local|demo-|test-|local-)/.test(projectId)) return "";
        const host = String(source.host || "127.0.0.1").trim() || "127.0.0.1";
        const functionsPort = Math.max(1, Number(source.functionsPort || 5001) || 5001);
        return `http://${host}:${functionsPort}/${projectId}/us-central1/`;
      } catch {
        return "";
      }
    }
    const heartEmulatorFunctionsBase = getHeartEmulatorFunctionsBase();
    if (!heartPreviewHost) {
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = "/apps/mnyra-heart/manifest.json";
      manifestLink.crossOrigin = "use-credentials";
      document.head.appendChild(manifestLink);
    }
    window.__MNYRA_HEART_CONFIG__ = Object.freeze({
      apiBase: heartEmulatorFunctionsBase || (heartLocalHost ? heartCloudFunctionsBase : "/api/heart/"),
      fallbackApiBase: heartLocalHost ? "" : ""
    });
  </script>
  <script type="module" src="/apps/mnyra-heart/heart.js"></script>
</body>
</html>
