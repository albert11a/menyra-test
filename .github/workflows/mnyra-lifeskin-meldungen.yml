name: mnyra-lifeskin-meldungen

# DER MELDUNGS-WAECHTER - eine Zwischenloesung, und sie sagt es selbst.
#
# Eine Meldung zu SCHICKEN ist einfach. Schwer ist das MERKEN: Jemand muss
# in dem Augenblick wach sein, in dem die Analyse ankommt. Dafuer gibt es
# notifyCeoOnLifeskinSessionWrite - eine Cloud Function, die von selbst
# anspringt. Sie steht fertig im Code und ist nicht deployt.
#
# Bis sie es ist, schaut dieser Zeitplan alle fuenfzehn Minuten nach. Eine
# Analyse um 09:01 wird um 09:15 gemeldet. Das ist schlechter als sofort und
# besser als nie.
#
# WIEDER ABSTELLEN, sobald die Functions deployt sind: unten "schedule"
# auskommentieren oder den Workflow in der GitHub-Oberflaeche deaktivieren
# (Actions -> mnyra-lifeskin-meldungen -> ... -> Disable workflow). Doppelte
# Meldungen gibt es dabei nicht - Waechter und Funktion schreiben dasselbe
# Dokument, und wer zuerst kommt, gewinnt -, aber ein Zeitplan, der
# nachsieht, ob eine Funktion ihre Arbeit tut, ist kein Dauerzustand.
#
# WAS EINMAL EINGETRAGEN WERDEN MUSS: das Geheimnis MNYRA_FIREBASE_ADMIN_KEY,
# der JSON-Schluessel des Firebase-Admin-SDK (Firebase-Konsole ->
# Projekteinstellungen -> Dienstkonten -> Neuen privaten Schluessel
# generieren). Der darf Firestore und Push - mehr braucht der Waechter
# nicht, und mehr soll er auch nicht duerfen. Das ist NICHT derselbe
# Schluessel wie FIREBASE_SERVICE_ACCOUNT beim Deploy.

on:
  schedule:
    # Stuendlich - nur noch Rueckfall. Sofort meldet jetzt
    # api/lifeskin-meldung.js (Vercel), angestossen von der Seite selbst.
    # Jeder Lauf kostet mindestens eine Actions-Minute; alle 15 Minuten
    # waeren bis zu 96 Minuten am Tag fuer einen Rueckfall.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      trocken:
        description: 'Nur anzeigen, was gemeldet wuerde (nichts schicken)'
        type: boolean
        required: false
        default: false

# Zwei Waechter gleichzeitig wuerden dieselbe Analyse zweimal ansehen. Das
# Dokument faengt es ab, aber gar nicht erst doppelt laufen ist billiger.
concurrency:
  group: mnyra-lifeskin-meldungen
  cancel-in-progress: false

jobs:
  nachsehen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OHNE SCHLUESSEL IST EIN ZEITPLAN NICHT KAPUTT, SONDERN UNEINGERICHTET.
      #
      # Ein roter Lauf alle fuenfzehn Minuten schickt alle fuenfzehn Minuten
      # eine Fehlermail - und wer die bekommt, schaltet nach dem dritten Mal
      # den ganzen Zeitplan ab. Also: Beim Zeitplan eine Warnung und Schluss,
      # von Hand ein Fehler. Wer den Lauf selbst startet, will wissen, warum
      # nichts passiert.
      - name: Schluessel pruefen
        id: schluessel
        env:
          MNYRA_FIREBASE_ADMIN_KEY: ${{ secrets.MNYRA_FIREBASE_ADMIN_KEY }}
        run: |
          if [ -n "$MNYRA_FIREBASE_ADMIN_KEY" ]; then
            echo "ueberspringen=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::warning::MNYRA_FIREBASE_ADMIN_KEY fehlt - der Waechter ist noch nicht eingerichtet. Lauf uebersprungen."
            echo "ueberspringen=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Das Geheimnis MNYRA_FIREBASE_ADMIN_KEY fehlt. Es ist der JSON-Schluessel des Firebase-Admin-SDK (Firebase-Konsole -> Projekteinstellungen -> Dienstkonten). Einzutragen unter Settings -> Secrets and variables -> Actions."
          exit 1

      - name: Setup Node
        if: steps.schluessel.outputs.ueberspringen != 'ja'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # NUR firebase-admin, nicht das ganze Projekt. Ein "npm ci" in der
      # Wurzel zieht Vite, Playwright und ESLint mit - das sind je Lauf
      # Minuten, und der Lauf kommt alle fuenfzehn Minuten.
      - name: Install
        if: steps.schluessel.outputs.ueberspringen != 'ja'
        run: npm install --prefix scripts/meldungs-waechter --no-audit --no-fund

      - name: Nachsehen
        if: steps.schluessel.outputs.ueberspringen != 'ja'
        env:
          MNYRA_FIREBASE_ADMIN_KEY: ${{ secrets.MNYRA_FIREBASE_ADMIN_KEY }}
          TROCKEN: ${{ inputs.trocken }}
        run: |
          if [ "$TROCKEN" = "true" ]; then
            node scripts/meldungs-waechter/waechter.mjs --trocken
          else
            node scripts/meldungs-waechter/waechter.mjs
          fi
