name: mnyra-deploy-functions

# DER DEPLOY-KNOPF.
#
# Das Frontend faehrt mit Vercel von selbst hoch, sobald etwas auf main
# liegt. Die Cloud Functions tun das NICHT - sie gehen erst live, wenn
# jemand "firebase deploy" laeuft. Genau daran hing die Meldung aus dem
# LifeSkin-Trichter wochenlang: Der Code war da, der Token war da, und die
# Funktion, die beides verbindet, stand nie in der Produktion.
#
# Dieser Lauf ist dieses "jemand". Zu starten von Hand hier in GitHub
# (Actions -> mnyra-deploy-functions -> Run workflow) oder aus Heart
# heraus (Einrichtung -> Deploy). Beides landet in demselben Lauf.
#
# WAS EINMAL VON HAND EINGERICHTET WERDEN MUSS, beides unter
# Settings -> Secrets and variables -> Actions:
#
#   FIREBASE_SERVICE_ACCOUNT  der ganze JSON-Schluessel eines Dienstkontos
#                             mit den Rollen "Cloud Functions Admin" und
#                             "Service Account User". Der Admin-SDK-
#                             Schluessel der Apps taugt dafuer NICHT - er
#                             darf Firestore und Push und keine einzige
#                             Cloud Function.
#   META_CAPI_TOKEN           das Zugriffstoken der Conversions API
#                             (Ereignismanager -> LF WEB -> Einstellungen).
#                             Dieser Lauf schreibt es in den Google Secret
#                             Manager, bevor er deployt.
#
# Beide Schritte sagen es, falls etwas fehlt - statt erst nach vier
# Minuten Installation.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Was deployt wird (firebase --only). Standard: alle Functions.'
        required: false
        default: 'functions'
      reason:
        description: 'Warum - steht nur im Protokoll'
        required: false
        default: ''

# Zwei Deploys gleichzeitig auf dasselbe Projekt sind ein Deploy zu viel.
# Nicht abbrechen, sondern anstellen: Ein halb durchgelaufener Deploy
# hinterlaesst die Haelfte der Funktionen in der alten Fassung.
concurrency:
  group: mnyra-deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ZUERST, und ohne Installation davor: Wer das Geheimnis nicht gesetzt
      # hat, soll es nach zehn Sekunden erfahren und nicht nach vier Minuten.
      - name: Schluessel pruefen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Geheimnis FIREBASE_SERVICE_ACCOUNT fehlt. Es ist der vollstaendige JSON-Schluessel eines Dienstkontos mit den Rollen 'Cloud Functions Admin' und 'Service Account User'. Einzutragen unter Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | grep -q '"private_key"'; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT sieht nicht nach einem Dienstkonto-Schluessel aus - es fehlt das Feld private_key."
            exit 1
          fi

      # Die Auswahl kommt von aussen und geht in eine Kommandozeile. Also
      # wird sie geprueft und nicht eingesetzt: Alles ausser Buchstaben,
      # Ziffern und den Trennzeichen von firebase --only hat hier nichts
      # verloren.
      - name: Auswahl pruefen
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if ! printf '%s' "$ONLY" | grep -Eq '^[A-Za-z0-9_.:,-]{1,200}$'; then
            echo "::error::Unerlaubte Auswahl: $ONLY"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (Wurzel)
        run: npm ci

      # Die Firebase-CLI laedt functions/index.js, um zu sehen, welche
      # Funktionen darin stehen. Ohne die Abhaengigkeiten der Functions
      # scheitert dieses Lesen - und zwar mit einer Meldung, die nach
      # allem klingt ausser nach fehlenden Paketen.
      - name: Install (functions)
        run: npm ci --prefix functions

      - name: Schluessel ablegen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"

      # ══ GEHEIMNISSE DER FUNKTIONEN, VOR DEM DEPLOY ════════════════════
      #
      # Eine Funktion mit runWith({ secrets: [...] }) laesst sich NICHT
      # ausspielen, solange das genannte Geheimnis im Google Secret Manager
      # nicht existiert - der Deploy bricht ab, und die Meldung nennt das
      # Geheimnis, nicht den Grund. Deshalb steht dieser Schritt davor.
      #
      # WARUM UEBER GITHUB UND NICHT VON HAND: "firebase functions:secrets:set"
      # verlangt ein Terminal mit angemeldeter CLI. Wer keines hat, kaeme
      # sonst nie bis zum Deploy - und genau dafuer gibt es diesen Lauf.
      # Eingetragen wird das Geheimnis einmal unter
      # Settings -> Secrets and variables -> Actions, also in einer
      # Oberflaeche und nicht in einer Kommandozeile.
      #
      # Der Wert geht ueber stdin und nie ueber die Kommandozeile: Was in
      # einem Befehl steht, steht in der Prozessliste.
      #
      # OHNE GITHUB-GEHEIMNIS PASSIERT HIER NICHTS, und das ist Absicht:
      # Wer es schon von Hand gesetzt hat, soll es nicht ueberschrieben
      # bekommen. Ob es wirklich da ist, prueft der Schritt danach.
      - name: Geheimnisse der Funktionen setzen
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: |
          if [ -z "$META_CAPI_TOKEN" ]; then
            echo "META_CAPI_TOKEN nicht als GitHub-Geheimnis gesetzt - uebersprungen."
            exit 0
          fi
          printf '%s' "$META_CAPI_TOKEN" | npx firebase functions:secrets:set META_CAPI_TOKEN \
            --project menyra-c0e68 --data-file - --force
          echo "META_CAPI_TOKEN gesetzt."

      # Sagt VOR dem Deploy, was danach sonst als kryptischer Abbruch
      # kaeme. Die Funktion lifeskinCapiPurchase verlangt das Geheimnis;
      # fehlt es, laesst sie sich nicht ausspielen.
      - name: Geheimnisse pruefen
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          if ! npx firebase functions:secrets:access META_CAPI_TOKEN \
               --project menyra-c0e68 >/dev/null 2>&1; then
            echo "::error::Das Geheimnis META_CAPI_TOKEN fehlt im Secret Manager. Die Funktion lifeskinCapiPurchase laesst sich ohne es nicht ausspielen. Eintragen unter Settings -> Secrets and variables -> Actions als META_CAPI_TOKEN (das Zugriffstoken aus dem Ereignismanager: Datensatz LF WEB -> Einstellungen -> Conversions API), dann diesen Lauf erneut starten."
            exit 1
          fi
          echo "META_CAPI_TOKEN liegt im Secret Manager."

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
          FUNCTIONS_DISCOVERY_TIMEOUT: "120"
          ONLY: ${{ inputs.only }}
          GRUND: ${{ inputs.reason }}
        run: |
          echo "Deploy: $ONLY ${GRUND:+($GRUND)}"
          # KEIN --force: Ohne ihn bricht die CLI ab, wenn der Deploy eine
          # Funktion LOESCHEN wuerde, die in der Produktion steht. Genau so
          # soll es sein - ein Deploy aus einem halben Stand darf nicht
          # stillschweigend Funktionen abraeumen.
          npx firebase deploy --only "$ONLY" --project menyra-c0e68 --non-interactive

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
