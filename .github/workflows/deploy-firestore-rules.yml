name: deploy-firestore-rules

# Vercel deployt bei Push auf main nur das Frontend (dist/).
# Firestore-Rules wurden bisher nie automatisch deployt -- dadurch liefen in
# Produktion veraltete Rules (z. B. fehlten die analyticsDaily/analyticsEvents-
# Regeln => Analytics-Tab: permission-denied). Dieser Workflow schliesst die
# Luecke: bei jeder Aenderung an firestore.rules auf main wird nach Firebase
# deployt (via Admin-SDK-Rules-API, siehe scripts/deploy-firestore-rules.mjs).
#
# Hinweis: firestore.indexes.json wird hier NICHT deployt -- dafuer braeuchte
# der Service-Account zusaetzlich die Rolle "Cloud Datastore Index Admin";
# Indexes bei Bedarf manuell deployen:
#   npx firebase-tools deploy --only firestore:indexes --project menyra-c0e68

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - scripts/deploy-firestore-rules.mjs
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt. In den Repo-Settings (Settings -> Secrets and variables -> Actions) das Service-Account-JSON aus der Firebase Console (Projekteinstellungen -> Dienstkonten -> Neuen privaten Schluessel generieren) hinterlegen."
            exit 1
          fi

      - name: Install firebase-admin
        run: npm install --no-save --no-audit --no-fund firebase-admin

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy-firestore-rules.mjs
