name: deploy-firestore-rules

# Deployt Firestore-Rules + Indizes automatisch, sobald sie sich auf `main`
# aendern. Vercel deployt nur das Frontend; ohne diesen Workflow muessen
# Rules manuell (`npm run deploy:rules`) live geschaltet werden, was leicht
# vergessen wird (Analytics-Reads faellen sonst auf die Catch-all-Deny).
#
# No-op ohne Secret: Ist FIREBASE_TOKEN nicht gesetzt, ueberspringt der Job
# den Deploy sauber (kein CI-Fehler). Zum Aktivieren im Repo-Setting die
# Secrets FIREBASE_TOKEN (aus `firebase login:ci`) und optional
# FIREBASE_PROJECT_ID hinterlegen.

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firestore.indexes.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for FIREBASE_TOKEN
        id: guard
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN nicht gesetzt – Deploy wird uebersprungen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install firebase-tools
        if: steps.guard.outputs.enabled == 'true'
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules + indexes
        if: steps.guard.outputs.enabled == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          else
            firebase deploy --only firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN" --non-interactive
          fi
