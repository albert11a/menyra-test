<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <!-- Dieselbe Angabe wie in der echten index.html. viewport-fit=cover gilt
       dort bedingungslos, also auch im Browser-Tab - davon haengt ab, ob
       env(safe-area-inset-top) ueberhaupt einen Wert hat, und die
       Safe-Area-Polsterung des Headers haengt daran. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Smart Header Fixture</title>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // Das CSS kommt aus der echten index.html, nicht aus einer Kopie: eine
    // Quelle, sonst prueft der Test irgendwann etwas anderes als die App malt.
    async function ladeHeaderCss() {
      const html = await (await fetch("/apps/menyra-social/index.html")).text();
      const bloecke = [...html.matchAll(/<style>([\s\S]*?)<\/style>/g)].map((treffer) => treffer[1]);
      const css = bloecke.find((block) => block.includes(".smart-header-shell"));
      if (!css) throw new Error("Header-CSS in index.html nicht gefunden");
      const el = document.createElement("style");
      el.textContent = css;
      document.head.appendChild(el);
    }

    try {
      await ladeHeaderCss();
      const mod = await import("/apps/menyra-social/core/app-shell/app-shell-runtime-controller.js");
      window.__erzeugeController = mod.createAppShellRuntimeController;
      window.__fixtureBereit = true;
    } catch (err) {
      window.__fixtureFehler = String(err && err.message ? err.message : err);
    }
  </script>
</body>
</html>
